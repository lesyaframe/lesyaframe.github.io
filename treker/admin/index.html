<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Доступы · мой сезон</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Yeseva+One&display=swap">
<style>
:root{--bg:#F3EBDA;--paper:#FBF6E9;--choco:#3B1B14;--brown:#5A2A20;--salad:#D3DC8C;--olive:#8E9A3C;--sky:#A6BFD2;--ink:#2A140F;--soft:#6B5550;--red:#A8432F;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
button,input{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:30px 16px 60px}
h1{font-family:"Yeseva One",Georgia,serif;font-weight:400;font-size:44px;line-height:1;color:var(--brown);margin:0 0 6px}
.sub{color:var(--soft);margin:0 0 24px}
.card{background:var(--paper);padding:22px;box-shadow:0 10px 24px rgba(59,27,20,.1);margin-bottom:20px}
.card h2{margin:0 0 12px;font-size:18px;letter-spacing:-.02em}
form{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto;gap:10px}
input{border:0;border-bottom:1.5px solid rgba(0,0,0,.25);background:transparent;padding:8px 2px;font-size:16px;min-width:0}
input:focus{outline:none;border-bottom-color:var(--olive)}
.btn{border:0;border-radius:999px;background:var(--brown);color:var(--paper);padding:10px 18px;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;border:1.5px solid var(--brown);color:var(--brown)}
.msg{min-height:20px;font-size:13px;margin-top:10px;color:var(--soft)}
.msg.err{color:var(--red)}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:12px;color:var(--soft);font-size:14px}
.stats b{color:var(--ink);font-size:22px;margin-right:4px}
ul{list-style:none;margin:0;padding:0}
li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed rgba(0,0,0,.14)}
li:last-child{border-bottom:0}
.em{font-weight:600;word-break:break-all}
.note{font-size:13px;color:var(--soft)}
.date{font-size:12px;color:var(--soft);white-space:nowrap}
.del{border:0;background:none;color:var(--soft);cursor:pointer;font-size:18px;padding:2px 6px}
.del:hover{color:var(--red)}
.search{width:100%;margin-bottom:6px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px;font-size:13px;color:var(--soft)}
.top a{color:inherit}
.gate{text-align:center;padding:40px 22px}
@media(max-width:600px){form{grid-template-columns:1fr}li{grid-template-columns:minmax(0,1fr) auto}.date{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1>доступы</h1>
  <p class="sub">кто может открыть трекер «мой сезон». добавь почту после оплаты, и человек сразу сможет войти.</p>
  <div id="app"><div class="card gate">загружаю…</div></div>
</div>

<script src="../app/firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
(function(){
  const OWNER = "lesya009ghh8@gmail.com";
  firebase.initializeApp(window.FIREBASE_CONFIG);
  const auth = firebase.auth(), db = firebase.firestore();
  const app = document.getElementById("app");
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const fmt = ts => { if (!ts || !ts.toDate) return ""; const d = ts.toDate(); return d.toLocaleDateString("ru-RU", { day:"numeric", month:"short", year:"numeric" }); };
  let unsub = null, rows = [], filter = "";

  function gate(html){ app.innerHTML = '<div class="card gate">' + html + '</div>'; }
  function login(){
    gate('<p>войди своим аккаунтом Google</p><button class="btn" id="go">войти через Google</button>');
    document.getElementById("go").onclick = () => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => {
      if (e.code === "auth/popup-blocked") auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider());
    });
  }

  function draw(){
    const list = rows.filter(r => !filter || r.id.includes(filter) || (r.note || "").toLowerCase().includes(filter));
    const box = document.getElementById("list");
    document.getElementById("count").textContent = rows.length;
    box.innerHTML = list.length ? list.map(r =>
      '<li><div><div class="em">' + esc(r.id) + '</div>' + (r.note ? '<div class="note">' + esc(r.note) + '</div>' : "") + '</div>' +
      '<span class="date">' + fmt(r.addedAt) + '</span><button class="del" data-del="' + esc(r.id) + '" title="закрыть доступ" aria-label="закрыть доступ">×</button></li>').join("")
      : '<li><span class="note">' + (rows.length ? "ничего не найдено" : "пока никого нет") + '</span></li>';
  }

  function panel(user){
    app.innerHTML =
      '<div class="top"><span>вошла как ' + esc(user.email) + '</span><span><a href="../app/" target="_blank">открыть трекер</a> · <a href="#" id="out">выйти</a></span></div>' +
      '<div class="card"><h2>открыть доступ</h2><form id="add"><input id="em" type="email" required placeholder="почта покупательницы"><input id="nt" placeholder="заметка: пилот 490, перевод 30.09"><button class="btn">добавить</button></form><div class="msg" id="msg"></div></div>' +
      '<div class="card"><div class="stats"><span><b id="count">0</b>с доступом</span></div><input class="search" id="q" placeholder="поиск по почте или заметке"><ul id="list"></ul></div>';
    document.getElementById("out").onclick = e => { e.preventDefault(); auth.signOut(); };
    document.getElementById("q").oninput = e => { filter = e.target.value.trim().toLowerCase(); draw(); };
    document.getElementById("add").onsubmit = async e => {
      e.preventDefault();
      const email = document.getElementById("em").value.trim().toLowerCase(), note = document.getElementById("nt").value.trim().slice(0, 200);
      const msg = document.getElementById("msg");
      if (!email) return;
      msg.className = "msg"; msg.textContent = "добавляю…";
      try {
        await db.collection("sezon_access").doc(email).set({ addedAt: firebase.firestore.FieldValue.serverTimestamp(), note });
        msg.textContent = "готово: " + email + " может входить в трекер";
        document.getElementById("em").value = ""; document.getElementById("nt").value = "";
      } catch (err) { msg.className = "msg err"; msg.textContent = "не получилось: " + (err.code || err.message); }
    };
    document.getElementById("list").onclick = async e => {
      const b = e.target.closest("[data-del]"); if (!b) return;
      if (!confirm("закрыть доступ для " + b.dataset.del + "? её записи останутся, если откроешь снова.")) return;
      try { await db.collection("sezon_access").doc(b.dataset.del).delete(); } catch (err) { alert("не получилось: " + (err.code || err.message)); }
    };
    unsub = db.collection("sezon_access").onSnapshot(snap => {
      rows = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => ((b.addedAt && b.addedAt.seconds) || 0) - ((a.addedAt && a.addedAt.seconds) || 0));
      draw();
    }, err => gate('<p>нет доступа к списку: ' + esc(err.code) + '</p>'));
  }

  auth.onAuthStateChanged(user => {
    if (unsub) { unsub(); unsub = null; }
    if (!user) return login();
    if ((user.email || "").toLowerCase() !== OWNER) { gate('<p>эта страница только для Леси.</p><button class="btn ghost" id="o">выйти</button>'); document.getElementById("o").onclick = () => auth.signOut(); return; }
    panel(user);
  });
})();
</script>
</body>
</html>
