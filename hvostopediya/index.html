"id": "dog-branch-vne-marshruta",
"sec": "povedenie",
"author": "vnemarshruta",
"type": "Презентация",
"img": "img/a4/brunch-1.webp",
"pdf": "pdf/dog-branch-vne-marshruta.pdf",
"title": "Dog-бранч «Вне маршрута»: здоровье, зубы и поведение",
"lead": "Ветеринар, ветеринарный стоматолог и специалист по поведению о симптомах, которые нельзя списывать на «это нормально», уходе за зубами и о том, почему обучение иногда не работает.",
"html": "<h2 id=\"b1\">Спикеры</h2>\n<ul><li><b>Гараева Елизавета Андреевна</b>, ветеринарный врач-онколог. Окончила СПБГУВМ, опыт работы с 2019 года, 6 лет в ветеринарном центре «Прайд», сейчас куратор клиник в двух регионах.</li><li><b>Хакимова Зарина Рафиковна</b>, ветеринарный врач-стоматолог, ветеринарный госпиталь «Прайд» (Санкт-Петербург). Опыт работы с 2017 года, гигиена, хирургия, терапия.</li><li><b>Бурлакова Леша</b>, специалистка по поведению и благополучию собак: адаптация дома и на улице, агрессия, реактивность, тревожность, страхи, одиночество. Telegram <a href=\"https://t.me/lleshas\" target=\"_blank\" rel=\"noopener\">@lleshas</a>, <a href=\"https://lleshasdog.tilda.ws/about\" target=\"_blank\" rel=\"noopener\">сайт</a>.</li></ul>\n<h2 id=\"b2\">Ветеринария: «это же нормально?»</h2>\n<h4>Собака стала больше пить</h4>\n<p>Почти половина владельцев не считает это достаточной причиной для обращения → А ведь это может быть одним из первых заметных признаков эндокринных, почечных и других системных заболеваний</p>\n<h4>Периодически рвёт — это же бывает у собак</h4>\n<p>→ С чем может быть связано: гастрит/энтерит, паразиты, пищевая непереносимость, инородное тело, панкреатит, заболевания печени или почек, эндокринные заболевания Главная мысль: единичная рвота у здоровой собаки и регулярно повторяющаяся рвота — совершенно разные ситуации</p>\n<h4>Диарея, но собака в остальном нормальная</h4>\n<p>→ С чем может быть связано: нарушение питания, паразиты, пищевая непереносимость, хроническое воспаление кишечника, заболевания поджелудочной железы, инфекции Особенно важно: если диарея становится повторяющейся или хронической, появляется кровь/чёрный стул, снижается вес или меняется аппетит</p>\n<h4>Просто набрал вес</h4>\n<p>→ С чем может быть связано: перекорм и недостаток активности — но также гипотиреоз, гиперадренокортицизм, некоторые лекарства, реже другие эндокринные нарушения Важный нюанс: увеличение веса само по себе чаще действительно связано с калориями, но быстрый или необъяснимый набор веса + изменения аппетита/жажды/активности уже заслуживает внимания</p>\n<h4>Она просто стала медленнее ходить</h4>\n<p>→ С чем может быть связано: остеоартрит, хроническая боль, заболевания позвоночника, проблемы с суставами/связками, сердечно-дыхательные заболевания, ожирение Особенно характерно: собака медленнее встаёт, не хочет прыгать в машину, избегает лестниц, меньше играет или быстрее устаёт</p><div class=\"gallery\"><a href=\"img/a4/brunch-5.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a4/brunch-5.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a4/brunch-6.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a4/brunch-6.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a4/brunch-7.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a4/brunch-7.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a4/brunch-8.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a4/brunch-8.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a4/brunch-9.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a4/brunch-9.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a4/brunch-10.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a4/brunch-10.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a4/brunch-11.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a4/brunch-11.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a4/brunch-12.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a4/brunch-12.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a4/brunch-13.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a4/brunch-13.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a4/brunch-14.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a4/brunch-14.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a4/brunch-15.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a4/brunch-15.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a4/brunch-16.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a4/brunch-16.webp\" alt=\"\" loading=\"lazy\"></a></div>\n<h2 id=\"b3\">Стоматология</h2>\n<h4>Зачем нужны зубы?</h4>\n<p>Зубы домашней собаки достались от их диких предков. Трубются для обороны и добывания пищи: Захватить Удержать «Убить» Оторвать кусок В современных реалиях – для рабочих собак: Охота, охрана, служба и т.д.</p>\n<h4>У собак тоже меняются зубы?</h4>\n<p>Два набора зубов: молочные и постоянные. Молочные растут с 1 по 4 месяц жизни щенка Смена зубов усреднено происходит с 4 по 7 месяц жизни У декоративных пород собак есть склонность к задержке выпадения временных зубов – генетические особенности – все вопросы к заводчику</p>\n<h4>Болят ли зубы так же как у людей?</h4>\n<p>Да, могут болеть. Часто не замечаем вовремя ввиду поведения питомца. Нормальная природа поведения собаки – не жаловаться владельцу. Собаки никогда не отказываются от пищи из-за зубной боли</p>\n<h4>Какие бывают проблемы?</h4>\n<p>Врожденные и приобретенные патологии. Врожденные: -Аномалии прикуса/строение лицевого черепа -Неполная зубная формула или дополнительные зубы -Задержка выпадения «молочных» зубов -Аномалии постоянныхзубов (изменена форма,размер,плотность эмали,цвет и т.д) Приобретенные: -Травма зуба (перелом, вывих, трещина) -Бактериальные инфекции приводящие к периодонтиту</p>\n<h4>Нужно ли заниматься зубами?</h4>\n<p>Зуб – орган имеющий нервно-сосудистый пучок. Запущенная инфекция распространяется с кровотоком по всему организму. Не редко страдают важные системы органов затрагивающие сердце, почки, легкие, ЖКТ. В некоторых случаях головной мозг!</p>\n<h4>Как понять все ли в порядке с зубами?</h4>\n<p>Важно обратиться к специалисту – ветеринарному стоматологу. НЕ К ГРУМЕРУ – парикмахер не должен заниматься зубами. Цирюльники остались в прошлом… Стоматолог проводит предварительный осмотр, составляет план лечения/дает рекомендации по уходу. Гигиена дома – лучшая профилактика многих заболеваний. Беспокойства должны вызвать: неприятный запах, появление тёмного налёта, покраснение десен, болезненность при надавливании, кровоточивость десен, резкое отсутствие интереса к игрушкам</p>\n<h4>Нужно ли чистить зубы собаке?</h4>\n<p>Да, чистка зубов дома имеет большое значение. Основная суть в механической нагрузке – важно использовать зубную щетку, можно использовать ветеринарные зубные пасты (здесь важно подобрать ВКУСНУЮ, которая понравится питомцу). В дополнении можно использовать грызные лакомства – важно обратить внимание на жесткость продукта (при надавливании пальцем остается слабый след от ногтя) Желательно ИЗБЕГАТЬ использование рогов, копыт, жил, «корней» - слишком плотные для эмали собак – приводит к травмам зубов.</p>\n<h4>Игрушки и инвентарь</h4>\n<p>Важно регулярно обрабатывать игровые принадлежности и посуду Самый простой и рабочий способ – кипячение. Так мы профилактируем распространение бактерий и появление особо плохих. Мягкие игрушки можно обрабатывать в стиральной машине при высокой температуре без моющих средств. Желательно не обмениваться игрушками с другими собачками и использовать только свои миски.</p>\n<h4>Профессиональная гигиена в условиях клиники</h4>\n<p>Проводится ветеринарным стоматологом Проводится только под общим наркозом Есть возможность провести детальный осмотр пока питомец спит Возможность дополнительной диагностики: Дентальный рентген/КТ- выявляется до 90% патологий Одномоментное удаление проблемных зубов при их обнаружении с возможностью обработать лунку Преимущества: Качественная работа с долгосрочным эффектом. Устранение очагов инфекции (в том числе скрытых) Более безопасная и прогнозируемая процедура Недостатки: Наркоз Боль.. Цена…</p>\n<h4>Подробнее о недостатках (страхи владельца)</h4>\n<p>Наркоз Дает нам возможность спокойно и для пациента, и для врача провести все необходимые манипуляции, в том числе и болезненные. Пациент спит пока мы лечим зубы – мечта для любого человека Боль Не редко после операции болит не сильнее чем болело до. Пациент обезболен на всех этапах – во время операции и после, не редко применяются наркотические обезболивающие (не вызывающие зависимость). Препараты подбираются индивидуально. Цена Высокая стоимость процедуры обусловлена экспертностью подхода к случаю ввиду дорогостоящего оборудования, лекарственных и наркотизирующих препаратов, квалификации врачей.</p>\n<h4>Заключение</h4>\n<p>Важно следить за состоянием ротовой полости Регулярно поддерживать гигиену (в том числе инвентаря) Проводить профилактические осмотры 1-2 раза в год</p><div class=\"gallery\"><a href=\"img/a4/brunch-17.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a4/brunch-17.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a4/brunch-18.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a4/brunch-18.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a4/brunch-19.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a4/brunch-19.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a4/brunch-20.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a4/brunch-20.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a4/brunch-21.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a4/brunch-21.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a4/brunch-22.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a4/brunch-22.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a4/brunch-23.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a4/brunch-23.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a4/brunch-24.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a4/brunch-24.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a4/brunch-25.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a4/brunch-25.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a4/brunch-26.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a4/brunch-26.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a4/brunch-27.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a4/brunch-27.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a4/bru const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip=s=>s.replace(/<[^>]+>/g,' ');
function plural(n,a,b,c){const m=n%10,h=n%100;return n+' '+(m==1&&h!=11?a:m>=2&&m<=4&&(h<12||h>14)?b:c)}
const bySec=id=>MATERIALS.filter(m=>m.sec===id||(m.also||[]).includes(id));
function matText(m){return m.blocks?m.blocks.map(b=>b.x).join(' '):strip(m.html)}
function minutes(m){return Math.max(1,Math.round(matText(m).split(/\s+/).length/170))}
const SHORT='в|во|на|с|со|к|ко|и|а|о|об|у|по|за|из|до|не|ни|от|для|без|при|про|над|под|что|если|чтобы|как|где|когда|это|или|но|же|ее|её|их|вы|мы|я|он|она|то|бы|ли|уже|все|всё|так';
const RX=new RegExp('(^|[\\s«(„"])('+SHORT+')\\s','gi');
function nb(s){return s.replace(RX,'$1$2 ').replace(RX,'$1$2 ').replace(/(\d)\s(часов|минут|недел|дн|мин|материал|раздел|автор)/g,'$1 $2').replace(/\s—\s/g,' — ').replace(/\s(\S{1,3})([.!?…»]*)$/,' $1$2')}
function fixText(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){if(n.parentNode.closest('script,style,input,textarea,.title,.f-big'))continue;if(/\s/.test(n.nodeValue))n.nodeValue=nb(n.nodeValue)}}

const SUBS={vospitanie:['Отношения и общение','Обучение и команды','Игры и игрушки','Вокализация'],'pervaya-pomosh':['Экстренные ситуации','Жара и холод','Отравления']};
function subBlock(id,list){
  const subs=SUBS[id];if(!subs)return `<div class="mat-list">${list.map(matRow).join('')}</div>`;
  const rest=list.filter(m=>!subs.includes(m.sub));
  return `<div class="subnav">${subs.map((s,i)=>`<a class="chip" href="#sub${i}" data-to="sub${i}">${s} <b>${list.filter(m=>m.sub===s).length||'скоро'}</b></a>`).join('')}</div>`+
   subs.map((s,i)=>{const l=list.filter(m=>m.sub===s);return `<div class="subsec" id="sub${i}"><h2 class="subh">${s}</h2>${l.length?`<div class="mat-list">${l.map(matRow).join('')}</div>`:`<div class="soon"><div><h3>Скоро</h3><p>Собираем материалы для этой темы</p></div></div>`}</div>`}).join('')+
   (rest.length?`<div class="subsec"><h2 class="subh">Ещё</h2><div class="mat-list">${rest.map(matRow).join('')}</div></div>`:'');
}
function sectionPage(id){
  const t=SEC[id]; if(!t) return notFound();
  const list=bySec(id), i=GRID.findIndex(s=>s[0]===id);
  const others=SECTIONS.filter(s=>s[0]!==id&&bySec(s[0]).length).concat(SECTIONS.filter(s=>s[0]!==id&&!bySec(s[0]).length)).slice(0,7);
  return `<section class="sec-top"><div class="pan"><div class="crumbs"><a href="#/">Хвостопедия</a><span>/</span><a href="#/razdely">Разделы</a></div><div class="lbl" style="color:var(--caramel);margin-bottom:14px">${i<0?'Вступление':'Раздел '+String(i+1).padStart(2,'0')+'/'}</div><h1 class="page-title">${t}</h1><div class="facts"><span>${cnt(list.length)}</span></div></div><div class="sec-img">${media(id)}</div></section>
  <section class="pan blk">${list.length||SUBS[id]?subBlock(id,list):`<div class="soon rv"><div><h3>Материалы скоро появятся</h3><p>Мы собираем статьи специалистов для этого раздела</p></div><a class="btn" href="#/razdely">Все разделы <span class="ar">${ARR}</span></a></div>`}
  <div class="next-secs rv">${others.map(([sid,st])=>`<a class="chip" href="#/r/${sid}">${st}</a>`).join('')}</div></section>${footer()}`;
}

function articleBody(m){
  if(m.html) return {html:m.html,toc:[...m.html.matchAll(/<h2 id="(\w+)">(.*?)<\/h2>/g)].map(x=>({id:x[1],t:x[2],k:'h2'}))};
  const out=[],toc=[];let i=0,ul=null,arr=null,steps=null,n=0;
  const flush=()=>{if(ul){out.push(`<ul${ul.cls?` class="${ul.cls}"`:''}>${ul.items.join('')}</ul>`);ul=null}if(arr){out.push(`<div class="arrows">${arr.join('')}</div>`);arr=null}};
  let lastH3='';
  for(const b of m.blocks){
    let x=esc(b.x);
    if(b.k!=='li')ul&&flush(); if(b.k!=='arrow')arr&&flush();
    if(b.k==='h2'||b.k==='h3'){const id='s'+(++n);toc.push({id,t:b.x.replace(/^(Часть \d+|Глава \d+)\.\s*/,'$1. '),k:b.k});out.push(`<${b.k} id="${id}">${x}</${b.k}>`);lastH3=b.x;continue}
    if(b.k==='h4'){const mm=x.match(/^(Пример \d+: \S+)\s+(.*)$/);if(mm){out.push(`<h4>${mm[1]}</h4><p>${mm[2]}</p>`)}else out.push(`<h4>${x}</h4>`);continue}
    if(b.k==='quote'){out.push(`<blockquote>${x}</blockquote>`);continue}
    if(b.k==='note'){out.push(`<p class="note">${x}</p>`);continue}
    if(b.k==='li'){if(!ul)ul={items:[],cls:/специалиста/.test(lastH3)?'names':''};ul.items.push(`<li>${x}</li>`);continue}
    if(b.k==='arrow'){const [q,a]=x.split('→');(arr=arr||[]).push(`<div>${q.trim()}<span>→</span>${a.trim()}</div>`);continue}
    if(/^Первые три дня|^Первые три недели|^И наконец, три месяца/.test(b.x)){
      const lab=/дня/.test(b.x.slice(0,18))?['3','дня']:/недели/.test(b.x.slice(0,20))?['3','недели']:['3','месяца'];
      if(!steps){steps=[];out.push('<!--steps-->')}
      steps.push(`<div><small>${lab[1]==='дня'?'острый стресс':lab[1]==='недели'?'привыкание':'дом'}</small><b>${lab[0]} ${lab[1]}</b><span>${x}</span></div>`);continue}
    if(/^С заботой о вас/.test(b.x)){out.push(`<p class="sign">${x}</p>`);continue}
    out.push(`<p>${x}</p>`);
  }
  flush();
  let html=out.join('\n');
  if(steps) html=html.replace('<!--steps-->',`<div class="steps3">${steps.join('')}</div>`);
  return {html,toc};
}

  return `<section class="art-top">
    <div class="pan"><div class="crumbs"><a href="#/">Хвостопедия</a><span>/</span><a href="#/r/${m.sec}">${SEC[m.sec]}</a></div>

  </section>
  <section class="pan paper art-wrap ${body.toc.length<2?'notoc':''}" id="read">
    ${body.toc.length<2?'':`<aside class="toc" id="toc"><b class="lbl">Содержание</b>${toc}</aside>`}
    <article class="text">${body.html}
      <div class="after"><h3>${a.empty||!a.links.length?'Понравился материал?':'Хотите разобраться глубже?'}</h3><p>${a.empty||!a.links.length?(m.pdf?'Скачайте его целиком, чтобы вернуться в трудный момент':'Загляните в другие материалы раздела'):'Переходите к автору: консультации и полезное в соцсетях'}</p><div class="btns">${contact}${m.pdf?`<a class="btn ${a.empty?'':'soft'}" href="${m.pdf}" download>Скачать PDF</a>`:''}${more.map(x=>`<a class="btn soft" href="#/m/${x.id}">${x.title} ${ARR}</a>`).join('')}</div></div>
    </article>
  </section>${footer()}`;
}

function notFound(){return `<section class="pan blk" style="min-height:80svh;display:flex;flex-direction:column;justify-content:center"><div class="lbl" style="color:var(--caramel)">Ой</div><h1 class="page-title">Такой страницы нет</h1><div style="margin-top:28px"><a class="btn" href="#/">На главную ${ARR}</a></div></section>`}

/* ---------- поиск ---------- */
function search(q){
  q=q.trim().toLowerCase(); if(q.length<2) return [];
  const res=[];
  SECTIONS.forEach(([id,t])=>{if(t.toLowerCase().includes(q))res.push({href:'#/r/'+id,t,sub:'Раздел · '+(bySec(id).length?plural(bySec(id).length,'материал','материала','материалов'):'скоро')})});
  MATERIALS.forEach(m=>{
    const txt=matText(m),low=txt.toLowerCase(),i=low.indexOf(q),inT=(m.title+' '+strip(m.lead)).toLowerCase().includes(q);
    if(i<0&&!inT)return;
    let sub=SEC[m.sec]+' · '+AUTHORS[m.author].short;
    if(i>=0){const s=Math.max(0,i-50);sub=(s?'…':'')+esc(txt.slice(s,i))+'<mark>'+esc(txt.slice(i,i+q.length))+'</mark>'+esc(txt.slice(i+q.length,i+q.length+70))+'…'}
    res.push({href:'#/m/'+m.id,t:m.title,sub,score:inT?0:1});
  });
  return res.sort((a,b)=>(a.score||0)-(b.score||0)).slice(0,7);
}
function bindSearch(){
  const q=$('#q'),box=$('#res'); if(!q) return;
  const draw=()=>{const r=search(q.value);if(q.value.trim().length<2){box.classList.remove('open');return}
    box.innerHTML=r.length?r.map((x,i)=>`<a href="${x.href}" class="${i?'':'act'}"><b>${esc(x.t)}</b><small>${x.sub}</small></a>`).join(''):`<div class="none">Пока ничего не нашлось. Загляните в&nbsp;<a href="#/razdely" style="text-decoration:underline">разделы</a></div>`;box.classList.add('open')};
  q.addEventListener('input',draw);
  q.addEventListener('keydown',e=>{if(e.key==='Enter'){const a=$('a',box);if(a)location.hash=a.getAttribute('href')}});
  $('#qgo').onclick=()=>{draw();const a=$('a',box);if(a)location.hash=a.getAttribute('href');else q.focus()};
  $$('.chip[data-q]').forEach(c=>c.onclick=()=>{q.value=c.dataset.q;draw();q.focus()});
  document.addEventListener('click',e=>{if(!e.target.closest('#search'))box.classList.remove('open')});
}



/* ---------- роутер ---------- */
let io,tocIO;
function render(){
  const h=location.hash.replace(/^#\/?/,'');
  const [p,arg]=h.split('/');
  let html,nav='';
  if(!p) html=home();
  else if(p==='razdely'){html=home();nav='razdely'}
  else if(p==='r') html=sectionPage(arg);
  else if(p==='m') html=articlePage(arg);
  else if(p==='avtory'){html=authorsPage();nav='avtory'}
  else if(document.getElementById(p)) return;
  else html=notFound();
  const app=$('#app'); app.innerHTML=html; fixText(app);
  $$('[data-nav]').forEach(a=>a.classList.toggle('on',a.dataset.nav===nav));
  window.scrollTo(0,0);
  if(nav==='razdely') requestAnimationFrame(()=>window.scrollTo(0,$('#razdely').offsetTop-12));
  document.title=p==='m'?(MATERIALS.find(x=>x.id===arg)||{}).title+' · Хвостопедия':p==='r'&&SEC[arg]?SEC[arg]+' · Хвостопедия':'Хвостопедия';
  bindSearch(); placeDog(); document.fonts&&document.fonts.ready.then(placeDog);
  io&&io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12,rootMargin:'0px 0px -6% 0px'});
  $$('.rv').forEach(el=>io.observe(el));
  $$('[data-to]').forEach(a=>a.onclick=e=>{e.preventDefault();const el=document.getElementById(a.dataset.to);el&&window.scrollTo({top:el.getBoundingClientRect().top+scrollY-(a.dataset.to==='read'?12:90),behavior:'smooth'});if(innerWidth<980&&a.closest('.toc'))$('#toc').classList.remove('open')});
  const toc=$('#toc');
  if(toc){ $('b',toc).onclick=()=>toc.classList.toggle('open');
    tocIO&&tocIO.disconnect();
    tocIO=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){$$('a',toc).forEach(a=>a.classList.toggle('on',a.dataset.to===e.target.id))}}),{rootMargin:'-20% 0px -70% 0px'});
    $$('.text h2[id],.text h3[id]').forEach(h=>tocIO.observe(h));
  }
}

function placeDog(){
  const slot=$('.dslot'),box=$('.hero .dogbox'),hero=$('.hero');
  if(!slot||!box)return;
  if(getComputedStyle(slot).display==='none'){box.removeAttribute('style');return}
  const r=slot.getBoundingClientRect(),h=box.parentElement.getBoundingClientRect();
  const top=r.top-h.top-r.height*0.04, dh=h.bottom-top-r.top+r.top-h.top+0, H=h.bottom-r.top+r.height*0.04, dw=H*728/966;
  box.style.cssText=`top:${top}px;height:${H}px;bottom:auto;left:${r.left-h.left+r.width/2-dw*0.335}px`;
}
addEventListener('resize',placeDog);
addEventListener('hashchange',render);
addEventListener('scroll',()=>{
  $('#hdr').classList.toggle('small',scrollY>30);
  const r=$('#read'); const bar=$('#bar');
  if(r){const t=r.offsetTop,hgt=r.offsetHeight-innerHeight;bar.style.width=Math.min(100,Math.max(0,(scrollY-t)/hgt*100))+'%'}else bar.style.width=0;
},{passive:true});
$('#navSearch').onclick=()=>{if(location.hash.replace(/^#\/?/,'')){location.hash='#/';setTimeout(()=>{$('#q')&&$('#q').focus()},80)}else{window.scrollTo({top:0,behavior:'smooth'});$('#q').focus()}};
