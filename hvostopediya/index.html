 {id:'kak-vybrat-amuniciyu',sec:'amuniciya',author:'shmakova',type:'Статья',img:'img/m/shmakova-amun.webp',
  title:'Как правильно выбрать амуницию',
  lead:'Ошейник, шлейка, поводок или рулетка и из чего всё это бывает. Единого ответа нет, но есть ориентиры, как подобрать амуницию именно для вашей собаки.',
  html:`<p>Как правильно выбрать амуницию? Вопрос, который постоянно волнует владельцев. Огорчу: чёткого и единого ответа на то, что взять, не существует. Но давайте разбираться, как подобрать ту самую, идеальную амуницию именно для твоего питомца.</p>
<h2 id="s1">Ошейник</h2>
<p>Классика в мире амуниции! Ошейники бывают разными: на застёжке (фастексе), типа мартингейл, светящиеся (чтобы не потерять хвостика в темноте), для адресника (тот самый жетончик с номером телефона), корректирующие.</p>
<p>Говоря о компаньонах, ошейник будет идеальным вариантом для собаки, которая не душит себя. В этом случае он не причинит вреда и не нанесёт травмы вопреки современным мифам.</p>
<h2 id="s2">Шлейка</h2>
<p>Самая спорная амуниция 21 века! Кто-то говорит, что они предназначены только для ездовых собак, кто-то уверен, что шлейки портят строение тела собаки и противопоказаны щенкам, а кто-то спорит с пеной у рта о том, какая она, та самая анатомическая шлейка!</p>
<p>На сегодняшний день самым удобным и комфортным для собак [по мнению людей] является Y-образная шлея. Она не сковывает движения, не мешает анатомически верному вымаху лап, не давит на шею. Такие шлейки идеально подходят всем породам собак, в том числе и удлинённым ребятам по типу корги и такс. Спинка во многих брендах регулируется, и потому посадить модель правильно обычно не составляет труда. И да, щенкам можно! К тому же шлейка часто решает проблему погрызов поводков, так как малыш просто не дотягивается до него.</p>
<h4>Чем же плохи другие шлейки?</h4>
<ul>
<li>Шлейки по типу жилетов часто состоят из синтетической ткани, которая может натирать кожу и скатывать под собой шерсть.</li>
<li>Шлейки с ремнём спереди: тихий ужас среди амуниции. Мешают верному вымаху лап, во время ходьбы спускаются то вниз, то поднимаются вверх и давят на шею.</li>
<li>Шлейки с ремнями под подмышками: представьте, что вам постоянно что-то натирает при ходьбе. Приятные ли это ощущения? Думаю, ответ очевиден.</li>
</ul>
<h2 id="s3">Поводок</h2>
<p>Ошейник купили, шлейку заказали! А что с поводком? Берём обычный классический поводок или поводок-перестёжку от 5 м.</p>
<p>Рулетка (если отдаёте ей предпочтение) должна быть подобрана по весу. Иначе:</p>
<h4>Постоянное напряжение и возбуждение</h4>
<p>Представь, что ты идёшь, постоянно преодолевая сопротивление троса. Собака на рулетке всё время борется с его натяжением, чтобы просто двигаться вперёд. Это физическое усилие держит нервную систему в хроническом тонусе, повышает общий уровень возбуждения. В таком состоянии даже нейтральный раздражитель (прохожий, другая собака) может вызвать бурную, импульсивную реакцию.</p>
<h4>Искажённые сигналы при общении</h4>
<p>Для собак язык тела — это целый разговор. На рулетке, из-за того же постоянного натяжения, собака часто принимает невольную «угрожающую» позу: корпус подаётся вперёд, шея вытянута. Другие собаки могут читать это как вызов или неуверенность, что провоцирует ненужные конфликты или недопонимание. Мы невольно лишаем питомца возможности общаться комфортно и понятно для сородичей.</p>
<h4>Чувство незащищённости</h4>
<p>С точки зрения психологии надёжная связь с хозяином — основа чувства безопасности. Рулетка же часто выскальзывает из рук, падает с грохотом и пугает собаку. Испугавшись, питомец может инстинктивно пуститься в бегство, увлекая за собой этот гремящий предмет. Ситуация становится неконтролируемой и травматичной для психики. К сожалению, такие случаи не редкость.</p>
<h4>Иллюзия контроля</h4>
<p>Кажется, что рулетка даёт управление на расстоянии. Но на деле контроль часто лишь кажущийся. В критический момент (испуг, погоня) тонкий трос сложно удержать, а кнопка блокировки может не сработать мгновенно. Ты физически не можешь мягко подвести собаку к себе или быстро укоротить поводок, как с обычной стропой.</p>
<h2 id="s4">Материалы</h2>
<p>Амуниция бывает из различных материалов. Самые стойкие и немаркие: водонепроницаемые гекса и биотан. Гекса — материал в форме сот, более дешёвый, грязь может забиваться в тиснение на стропе. Биотан гладкий, бывает нескольких видов: твёрдый для поводков, мягкий для ошейников и шлеек. Единственный минус таких материалов: на морозе они дубеют.</p>
<p>Для поводков идеальна прорезиненная стропа.</p>

 {id:'inekcii-insulina',sec:'diabet',author:'diabet',type:'Памятка',img:'img/m/inekcii.webp',
  title:'Инъекции инсулина хвостикам',
  lead:'Как выбрать место укола, техника подкожной инъекции, что важно и чего нельзя. Плюс таблица инсулинов для собак и кошек.',
  html:`<p>Для введения инсулина можно использовать как обычные инсулиновые шприцы, так и шприц-ручки, включая ветеринарные модели. Преимущество обычного шприца: можно визуально контролировать процесс и убедиться, что вся набранная доза введена подкожно.</p>
<h2 id="i1">Выбор места инъекции</h2>
<p>Используйте участки с достаточным количеством подкожной клетчатки. В зависимости от зоны инсулины могут «раскрываться» по-разному. Например, в паховой складке кожа тоньше, а кровеносных сосудов больше, поэтому всасывание быстрее и активнее, чем в холке.</p>
<p>Периодически меняйте место инъекции (ротация), чтобы избежать уплотнений и нарушения всасывания.</p>
<h4>Рекомендованные зоны для собак и кошек</h4>
<ul><li>область холки</li><li>вдоль рёберной дуги</li><li>паховая складка</li></ul>
<p class="note">В разных зонах всасываемость инсулина может отличаться. Если ваша кошка претендент на ремиссию, старайтесь колоть в одну зону, просто отступайте 1–2 см от места предыдущего укола.</p>
<h2 id="i2">Техника подкожной инъекции</h2>
<ol class="steps">
<li><b>Поднимите кожную складку</b>В форме пирамидки, чтобы не ввести ошибочно в кожу или мышцу.</li>
<li><b>Введите иглу</b>В основание складки под небольшим углом. Введите инсулин.</li>
<li><b>Извлеките иглу</b>Убедитесь, что инсулин не вытек.</li>
</ol>
<h4>После инъекции</h4>
<ul><li>Похвалите питомца, дайте небольшое угощение: это вырабатывает позитивные ассоциации с процедурой.</li><li>Запишите введённую дозу и время или отметьте в приложении CGM.</li><li>Следите за аппетитом, активностью и самочувствием питомца.</li></ul>
<h2 id="i3">Важно</h2>
<ul>
<li>Опускать складку во время введения инсулина необязательно, только если вам и питомцу так удобнее.</li>
<li>Держать шприц под кожей ещё какое-то время после нажатия на поршень нужно только со шприц-ручками. С обычными шприцами это может понадобиться кошкам в ремиссии, когда шаг дозы уже «нулевой».</li>
<li>Не вводите инсулин внутримышечно или внутрикожно.</li>
<li>Не используйте одноразовые иглы повторно или хотя бы минимизируйте это.</li>
<li>Не вводите препарат в воспалённую, повреждённую или инфицированную кожу. Не смешивайте разные инсулины без назначения врача.</li>
<li>Все виды инсулинов запрещено встряхивать! Суспензии (все НПХ-инсулины, Caninsulin/Vetsulin, Винсувет микс, ProZinc) равномерно ресуспендируют перед каждым введением. Прозрачные растворы (детемир, гларгин, деглудек) перед введением не перемешивают.</li>
</ul>
<blockquote>Если питомец испытывает выраженный стресс или проявляет агрессию при измерениях и инъекциях, рекомендуется консультация врача поведенческой медицины. Не применяйте насильственную фиксацию: она только усилит страх перед процедурами, которые теперь жизненно необходимы.</blockquote>
<h2 id="i4">Шприцы</h2>
<p>Шприц выбирают по концентрации инсулина и назначенной дозе. Обозначение U (U-40, U-100 и т. д.) показывает, сколько единиц (ЕД) в 1 мл. Шкала шприца размечена в ЕД, а шаг деления показывает, сколько единиц соответствует одному делению.</p>
<h2 id="i5">Инсулины: ориентировочная таблица</h2>
<p class="note">Дозировка подбирается ветеринарным врачом индивидуально: по потребности питомца, уровню и динамике глюкозы, сопутствующим болезням и терапии. Данные в таблице ориентировочные и не являются схемой дозирования.</p>

function articleBody(m){
  if(m.html) return {html:m.html,toc:[...m.html.matchAll(/<h2 id="(\w+)">(.*?)<\/h2>/g)].map(x=>({id:x[1],t:x[2],k:'h2'}))};
  const out=[],toc=[];let i=0,ul=null,arr=null,steps=null,n=0;
  const flush=()=>{if(ul){out.push(`<ul${ul.cls?` class="${ul.cls}"`:''}>${ul.items.join('')}</ul>`);ul=null}if(arr){out.push(`<div class="arrows">${arr.join('')}</div>`);arr=null}};
  let lastH3='';
  for(const b of m.blocks){
    let x=esc(b.x);
    if(b.k!=='li')ul&&flush(); if(b.k!=='arrow')arr&&flush();
    if(b.k==='h2'||b.k==='h3'){const id='s'+(++n);toc.push({id,t:b.x.replace(/^(Часть \d+|Глава \d+)\.\s*/,'$1. '),k:b.k});out.push(`<${b.k} id="${id}">${x}</${b.k}>`);lastH3=b.x;continue}
    if(b.k==='h4'){const mm=x.match(/^(Пример \d+: \S+)\s+(.*)$/);if(mm){out.push(`<h4>${mm[1]}</h4><p>${mm[2]}</p>`)}else out.push(`<h4>${x}</h4>`);continue}
    if(b.k==='quote'){out.push(`<blockquote>${x}</blockquote>`);continue}
    if(b.k==='note'){out.push(`<p class="note">${x}</p>`);continue}
    if(b.k==='li'){if(!ul)ul={items:[],cls:/специалиста/.test(lastH3)?'names':''};ul.items.push(`<li>${x}</li>`);continue}
    if(b.k==='arrow'){const [q,a]=x.split('→');(arr=arr||[]).push(`<div>${q.trim()}<span>→</span>${a.trim()}</div>`);continue}
    if(/^Первые три дня|^Первые три недели|^И наконец, три месяца/.test(b.x)){
      const lab=/дня/.test(b.x.slice(0,18))?['3','дня']:/недели/.test(b.x.slice(0,20))?['3','недели']:['3','месяца'];
      if(!steps){steps=[];out.push('<!--steps-->')}
      steps.push(`<div><small>${lab[1]==='дня'?'острый стресс':lab[1]==='недели'?'привыкание':'дом'}</small><b>${lab[0]} ${lab[1]}</b><span>${x}</span></div>`);continue}
    if(/^С заботой о вас/.test(b.x)){out.push(`<p class="sign">${x}</p>`);continue}
    out.push(`<p>${x}</p>`);
  }
  flush();
  let html=out.join('\n');
  if(steps) html=html.replace('<!--steps-->',`<div class="steps3">${steps.join('')}</div>`);
  return {html,toc};
}

/* ---------- поиск ---------- */
function search(q){
  q=q.trim().toLowerCase(); if(q.length<2) return [];
  const res=[];
  SECTIONS.forEach(([id,t])=>{if(t.toLowerCase().includes(q))res.push({href:'#/r/'+id,t,sub:'Раздел · '+(bySec(id).length?plural(bySec(id).length,'материал','материала','материалов'):'скоро')})});
  MATERIALS.forEach(m=>{
    const txt=matText(m),low=txt.toLowerCase(),i=low.indexOf(q),inT=(m.title+' '+strip(m.lead)).toLowerCase().includes(q);
    if(i<0&&!inT)return;
    let sub=SEC[m.sec]+' · '+AUTHORS[m.author].short;
    if(i>=0){const s=Math.max(0,i-50);sub=(s?'…':'')+esc(txt.slice(s,i))+'<mark>'+esc(txt.slice(i,i+q.length))+'</mark>'+esc(txt.slice(i+q.length,i+q.length+70))+'…'}
    res.push({href:'#/m/'+m.id,t:m.title,sub,score:inT?0:1});
  });
  return res.sort((a,b)=>(a.score||0)-(b.score||0)).slice(0,7);
}
function bindSearch(){
  const q=$('#q'),box=$('#res'); if(!q) return;
  const draw=()=>{const r=search(q.value);if(q.value.trim().length<2){box.classList.remove('open');return}
    box.innerHTML=r.length?r.map((x,i)=>`<a href="${x.href}" class="${i?'':'act'}"><b>${esc(x.t)}</b><small>${x.sub}</small></a>`).join(''):`<div class="none">Пока ничего не нашлось. Загляните в&nbsp;<a href="#/razdely" style="text-decoration:underline">разделы</a></div>`;box.classList.add('open')};
  q.addEventListener('input',draw);
  q.addEventListener('keydown',e=>{if(e.key==='Enter'){const a=$('a',box);if(a)location.hash=a.getAttribute('href')}});
  $('#qgo').onclick=()=>{draw();const a=$('a',box);if(a)location.hash=a.getAttribute('href');else q.focus()};
  $$('.chip[data-q]').forEach(c=>c.onclick=()=>{q.value=c.dataset.q;draw();q.focus()});
  document.addEventListener('click',e=>{if(!e.target.closest('#search'))box.classList.remove('open')});
}

let io,tocIO;
function render(){
  const h=location.hash.replace(/^#\/?/,'');
  const [p,arg]=h.split('/');
  let html,nav='';
  if(!p) html=home();
  else if(p==='razdely'){html=home();nav='razdely'}
  else if(p==='r') html=sectionPage(arg);
  else if(p==='m') html=articlePage(arg);
  else if(p==='avtory'){html=authorsPage();nav='avtory'}
  else if(document.getElementById(p)) return;
  else html=notFound();
  const app=$('#app'); app.innerHTML=html; fixText(app);
  $$('[data-nav]').forEach(a=>a.classList.toggle('on',a.dataset.nav===nav));
  window.scrollTo(0,0);
  if(nav==='razdely') requestAnimationFrame(()=>window.scrollTo(0,$('#razdely').offsetTop-12));
  document.title=p==='m'?(MATERIALS.find(x=>x.id===arg)||{}).title+' · Хвостопедия':p==='r'&&SEC[arg]?SEC[arg]+' · Хвостопедия':'Хвостопедия';
  bindSearch(); placeDog(); document.fonts&&document.fonts.ready.then(placeDog);
  io&&io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12,rootMargin:'0px 0px -6% 0px'});
  $$('.rv').forEach(el=>io.observe(el));
  $$('[data-to]').forEach(a=>a.onclick=e=>{e.preventDefault();const el=document.getElementById(a.dataset.to);el&&window.scrollTo({top:el.getBoundingClientRect().top+scrollY-(a.dataset.to==='read'?12:90),behavior:'smooth'});if(innerWidth<980&&a.closest('.toc'))$('#toc').classList.remove('open')});
  const toc=$('#toc');
  if(toc){ $('b',toc).onclick=()=>toc.classList.toggle('open');
    tocIO&&tocIO.disconnect();
    tocIO=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){$$('a',toc).forEach(a=>a.classList.toggle('on',a.dataset.to===e.target.id))}}),{rootMargin:'-20% 0px -70% 0px'});
    $$('.text h2[id],.text h3[id]').forEach(h=>tocIO.observe(h));
  }
}

function placeDog(){
  const slot=$('.dslot'),box=$('.hero .dogbox'),hero=$('.hero');
  if(!slot||!box)return;
  if(getComputedStyle(slot).display==='none'){box.removeAttribute('style');return}
  const r=slot.getBoundingClientRect(),h=box.parentElement.getBoundingClientRect();
  const top=r.top-h.top-r.height*0.04, dh=h.bottom-top-r.top+r.top-h.top+0, H=h.bottom-r.top+r.height*0.04, dw=H*728/966;
  box.style.cssText=`top:${top}px;height:${H}px;bottom:auto;left:${r.left-h.left+r.width/2-dw*0.335}px`;
}
