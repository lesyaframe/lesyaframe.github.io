{
"id": "chto-pochitat",
"sec": "vstuplenie",
"author": "galimova",
"type": "Подборка",
"img": "",
"title": "Что почитать о собаках",
"lead": "Книжная подборка для владельцев и начинающих кинологов: язык тела, стресс и благополучие, обучение и кормление.",
"html": "<ul><li>Если вы владелец собаки или начинающий кинолог и хотите больше узнать про собак и их поведение, начните с качественной литературы. Этот список поможет выстроить надёжную базу знаний и избежать мифов и устаревших методов</li></ul>\n<h2 id=\"t1\">На каком языке общаются собаки? Язык тела и сигналы примирения</h2>\n<p>Лили Чин «Собака. Иллюстрированный справочник по языку тела»</p>\n<p>Понятная короткая книга-комикс. Научит видеть, что «говорит» ваша собака: где она расслаблена, где ей страшно или неприятно. Хорошо подходит и для детей.</p>\n<p>Тюрид Ругас «Сигналы примирения»</p>\n<p>КлассикаЧитается легко, много картинок. После этой книги вы начнёте замечать, как собаки используют «вежливые» сигналы, чтобы избежать конфликтов. Обязательный минимум для всех, кто любым образом контактирует с собаками.</p>\n<h2 id=\"t2\">Про стресс и благополучие</h2>\n<p>Кларисса фон Рейнхардт «Стресс у собак»</p>\n<p>Почему «плохое поведение» часто — всего лишь сигнал о стрессе. Объясняет, как стресс влияет на поведение и здоровье, и что можно сделать, чтобы помочь собаке чувствовать себя лучше.</p>\n<p>Заззи Тодд «Как сделать собаку счастливой»</p>\n<p>Современная и научно обоснованная книга о том, как заботиться о психическом здоровье собаки: про эмоции, общение и доверие. Простая и понятная.</p>\n<h2 id=\"t3\">Про обучение и отношения</h2>\n<p>Карен Прайор «Не рычите на собаку»</p>\n<p>Нестареющая классика! Книга о том, как работает кликер-тренинг и позитивное подкрепление. Лёгкий стиль, много примеров и историй из жизни.</p>\n<p>Юлия Подкосова «Моя собака — сатана»</p>\n<p>Честная и ироничная книга о том, что даже «сложная» собака не приговор. Реальные истории, опыт и советы без пафоса.</p>\n<p>Мария Мизерницкая, Карина Пинтийская «Пёс со мной»</p>\n<p>Современный взгляд на жизнь с собакой: как понимать её поведение, строить доверие и решать конфликты без мифов и жёсткости.</p>\n<h2 id=\"t4\">Про кормление</h2>\n<p>Екатерина Нигова «Чем и как кормить собаку»</p>\n<p>Пособие для тех, кто хочет разобраться в кормах, натуралке, добавках и рекламных мифах. Просто, понятно и по делу.</p><p class=\"src\">Источник: канал «ваш кинолог ALEYHAB», <a href=\"https://t.me/aleydog/106\" target=\"_blank\" rel=\"noopener\">t.me/aleydog/106</a></p>"
},
{
"id": "obida-mest-styd",
"sec": "povedenie",
"author": "galimova",
"type": "Статья",
"img": "",
"title": "Могут ли собаки обижаться, мстить и стыдиться?",
"lead": "«Наругал собаку, а она написала на кровать — это месть?» Нет. И «виноватый вид» тоже не про совесть: что показывают исследования.",
"html": "<p>Давайте обсудим, обижаются ли собаки, делают на зло, мстят?</p>\n<p>Нет, они так делать не умеют! Выдыхаем!</p>\n<p>Собаки ребята простые и живут, делая то, что безопасно, приносит удовольствие, выгоду. Они способны испытывать первичные эмоции, как ответ на то, что происходит вокруг (радость, злость, страх, грусть, тревогу). Но их когнитивные способности ограничены, им не доступно самосознание, как у человека, поэтому они не испытывают таких сложных чувств, как обида и не способны мстить.</p>\n<h2 id=\"t1\">Вернёмся к примеру</h2>\n<p>Собака написала на кровать не от обиды и не в отместку. Наоборот!</p>\n<p>Она прочитала вашу угрозу и пыталась помириться, наладить отношения. И использовала для этого запаховую коммуникацию, часть собачьего языка. Да, на то место, где сильнее всего вами пахнет. Это могут быть как кровать, так и другие ваши вещи, любое место дома</p>\n<p>В её голове это звучит так</p>\n<p>\"Если человек почувствует мой запах, он вспомнит, что мы друзья, и примет обратно!\"</p>\n<h2 id=\"t2\">Что ещё бывает?</h2>\n<p>туалет дома может быть стрессовой реакцией организма на угрозу. Вспомните себя в моменты стресса. Я, например, в любой непонятной ситуации бегу в туалет (будь то важная встреча, выступление или волнительное событие).</p>\n<p>ещё собака может пойти и что-то сгрызть. Это способы справления со стрессом, а именно копинг-механизм. Грызение, вылизывание, нюхание помогают нервной системе успокоиться. Если под раздачу попали ваши вещи - это просто невезение, но никак не месть</p>\n<p>а ещё причины плохого поведения собаки могут крыться в проблемах со здоровьем. Особенно, если поведение поменялось внезапно, стоит в первую очередь сходить к врачу</p>\n<h2 id=\"t9\">Бывает ли собакам стыдно?</h2>\n<p>Собаки не испытывают вину и им не стыдно. Об этом был один из предыдущих постов.</p>\n<p>Почему тогда кажется, что собака выглядит виноватой?</p>\n<p>Однажды учёные решили это проверить. Были эксперименты, где собак оставляли в комнате наедине с запрещённым лакомством — печеньем. Хозяину говорили, что собака съела печенье, даже если на самом деле она его не трогала.</p>\n<p>(+ ещё разные вариации: съела и не говорили владельцу, не съела и не говорили и т.д)</p>\n<p>Что делала собака?</p>\n<p>Когда человек возвращался и начинал ругаться — она тут же принимала \"виноватый\" вид: опускала голову, отводила взгляд, замирала.</p>\n<p>А если хозяин был спокоен — никакого \"стыда\" собака не показывала (даже если съела запретное).</p>\n<p>То есть собака не испытывала чувство вины за поступок, а реагировала на поведение человека.</p>\n<p>Это не про совесть — это про сигналы: \"Ой-ой, хозяин зол — надо быть потише, спрятаться, не нарываться.\"</p>\n<p>Так что «виноватый вид» — это не чувство вины, а примирительная коммуникация в ответ на угрозу, как способ снизить напряжение и избежать конфликта.</p>\n<p>Собаки — мастера чтения нашего языка тела. Иногда — даже слишком хорошие мастера.</p>\n<p>Horowitz et al. Disambiguating the 'guilty look';: Salient prompts to a familiar dog behaviour. Behavioural Processes, 2009;</p>\n<p>Ljerka Ostojić et al. Are owners' reports of their dogs’ ‘guilty look’ influenced by the dogs’ action and evidence of the misdeed? Behavioural Processes, 2015</p><p class=\"src\">Источник: канал «ваш кинолог ALEYHAB», <a href=\"https://t.me/aleydog/42\" target=\"_blank\" rel=\"noopener\">t.me/aleydog/42</a></p>"
},
{
"id": "shchenok-kusaetsya",
"sec": "povedenie",
"author": "galimova",
"type": "Статья",
"img": "",
"title": "Щенок кусается — почему и что делать",
"lead": "Кусь — базовая форма общения щенка. Как наши реакции превращают это в игру и как помочь щенку научиться тормозить.",
"html": "<p>Щенок — это как маленький ребёнок. Только вместо ручек у него — зубы. Через рот он исследует мир, взаимодействует с вами и учится жизни. И кусь — одна из его базовых форм общения.</p>\n<p>Но поведение щенка напрямую связано с нашими реакциями. И вот тут начинается самое интересное</p>\n<h2 id=\"t1\">Что делает человек… и что видит щенок?</h2>\n<p>если вы:</p>\n<ul><li>гладите щенка, когда он не хочет</li><li>при покусах начинаете размахивать руками,</li><li>отталкиваете руками, ногами</li><li>дёргаете одежду из пасти,</li><li>кричите \"нельзя\" или ругаетесь…</li></ul>\n<p>...для щенка это выглядит не как запрет, а как супер-весёлая игра!</p>\n<p>Вы двигаетесь, шумите, кричите — а значит, всё правильно, надо продолжать кусаться! 😄</p>\n<h2 id=\"t2\">Вместо этого попробуйте</h2>\n<ul><li>замереть,</li><li>убрать руки, скрестить ноги</li><li>сесть повыше,</li><li>прекратить игру.</li></ul>\n<p>Меньше движения — меньше азарта. Щенки читают движения гораздо лучше слов.</p>\n<h2 id=\"t3\">Предлагать альтернативу — важно! Но…</h2>\n<p>Сделать «замену» — это не значит хватать игрушку, вкусняшку и лезть в пасть щенку, когда он уже в кураже.</p>\n<p>Гораздо эффективнее:</p>\n<p>Предлагать разрешённые предметы заранее, до того как началась игра в «отними».</p>\n<p>Оставлять в доступе безопасные и интересные игрушки/картонки, чтобы он сам мог отвлечься.</p>\n<p>Если щенок подошёл, хочет внимания, направлять его внимание на игрушку/погрызушку и повзаимодействовать через посредника (до того, как он начал кусать и \"играть в вас\").</p>\n<p>Так щенок сам учится делать выбор — и этот выбор будет вас радовать.</p>\n<h2 id=\"t4\">Регулируем возбуждение</h2>\n<p>Щенки ещё не умеют останавливаться вовремя.</p>\n<p>Если игра слишком захватывает — щенок может начать кусаться больно, возбуждаться всё сильнее и в итоге не может сам «вырулить».</p>\n<p>Ваша задача — тормозить до перевозбуждения.</p>\n<p>Идеальный финал игры — вы отдаёте щенку игрушку или погрызушку, он уходит с ней и грызёт. Это успокаивает, помогает щенку переварить эмоции и выдохнуть.</p>\n<p>Так он постепенно будет учиться тормозиться и держать себя в лапках сам!</p>\n<h2 id=\"t5\">Это нормально</h2>\n<p>Период «кусаю всех и вся» — это норма. Через это проходят все.</p>\n<p>Важно не просто переждать, а помочь щенку научиться:</p>\n<ul><li>что можно грызть,</li><li>как просить внимание,</li><li>как играть, не теряя голову.</li></ul>\n<p>💡 И запомните: щенки растут быстрее, чем кажется.</p>\n<p>Сегодня он кусается и тянет за штанину, а завтра уже будет приносить вам тапочек и ждать похвалы</p><p class=\"src\">Источник: канал «ваш кинолог ALEYHAB», <a href=\"https://t.me/aleydog/108\" target=\"_blank\" rel=\"noopener\">t.me/aleydog/108</a></p>"
},
{
"id": "trevoga-kak-raspoznat",
"sec": "povedenie",
"author": "galimova",
"type": "Карточки",
"img": "img/m/trevoga.webp",
"title": "Как распознать тревогу у собаки",
"lead": "Чем раньше замечены тревожные звоночки, тем меньше шанс столкнуться с серьёзными проблемами поведения.",
"html": "<p>Чем раньше мы замечаем первые тревожные звоночки, тем выше вероятность, что вы и ваша собака не столкнётесь с серьёзными проблемами поведения.</p>\n<p>не стоит бояться любого малейшего признака стресса, все мы сталкиваемся с ним каждый день и в этом нет большой угрозы. Важно научиться отделять, когда стресс становится патологическим, в каких ситуациях он появляется, и научиться помогать собаке справляться.</p><p>Тревожные звоночки на карточках:</p><div class=\"gallery\"><a href=\"img/a3/aleydog_119-1.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a3/aleydog_119-1.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a3/aleydog_119-2.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a3/aleydog_119-2.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a3/aleydog_119-3.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a3/aleydog_119-3.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a3/aleydog_119-4.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a3/aleydog_119-4.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a3/aleydog_119-5.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a3/aleydog_119-5.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a3/aleydog_119-6.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a3/aleydog_119-6.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a3/aleydog_119-7.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a3/aleydog_119-7.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a3/aleydog_119-8.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a3/aleydog_119-8.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a3/aleydog_119-9.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a3/aleydog_119-9.webp\" alt=\"\" loading=\"lazy\"></a></div><p class=\"src\">Источник: канал «ваш кинолог ALEYHAB», <a href=\"https://t.me/aleydog/119\" target=\"_blank\" rel=\"noopener\">t.me/aleydog/119</a></p>"

{
"id": "kopingi",
"sec": "povedenie",
"author": "galimova",
"type": "Статья",
"img": "img/m/kopingi.webp",
"title": "Антистресс-триада: как помочь собаке успокоиться",
"lead": "Грызть, вылизывать, нюхать: как копинг-механизмы включают «тормоз» нервной системы и как их правильно использовать.",
"html": "<p>Наверняка вы видели игрушки, которые предназначены для того, чтобы собака могла их погрызть.</p>\n<p>Но почему собаки вообще так часто грызут?</p>\n<p>На самом деле, грызение, вылизывание, нюхание, разрывание предметов и многие другие действия помогают собаке сбросить напряжение и успокоиться.</p>\n<h2 id=\"t1\">Почему так происходит?</h2>\n<p>В нервной системе есть два отдела симпатическая и парасимпатическая.</p>\n<p>Проще говоря, газ и тормоз.</p>\n<p>Симпатическая отвечает за возбуждение и активность, парасимпатическая за восстановление и расслабление.</p>\n<p>Когда собака переживает стресс или просто сильно возбуждена (даже от радости!), чтобы успокоиться, ей нужно переключиться с “газа” на “тормоз”.</p>\n<p>И быстрее всего сделать это помогают так называемые копинг-механизмы — действия, которые физиологически включают парасимпатику и запускают торможение.</p>\n<p>Самые эффективные копинги у собак это триада: грызть, вылизывать, нюхать.</p>\n<h2 id=\"t2\">Что можно использовать</h2>\n<h2 id=\"t3\">Грызение, разрывание</h2>\n<p>Картонки, коробочки, втулки (только убедиться, что собака не поглощает их в больших количествах)</p>\n<p>Тряпочные, резиновые игрушки</p>\n<p>Палочки из кофейного, оливкового дерева, косточки Petstages</p>\n<p>Съедобные долгоиграющие погрызушки — например, бычий корень.</p>\n<h2 id=\"t4\">Вылизывание</h2>\n<p>Игрушки с отверстиями для еды (те же конги и аналоги)</p>\n<p>Лизательные коврики на вылизывание (обязательно под присмотром, легко разгрызаются)</p>\n<h2 id=\"t5\">Нюхание, поиск</h2>\n<p>Нюхательные коврики, шары, кубики и т.д</p>\n<p>Различные поисковые игры</p>\n<p>Арсенал огромный. Главное, подобрать то, что именно вашу собаку успокаивает, ведь то, что одному помогает “выдохнуть”, другого может наоборот перевозбудить.</p>\n<p>Например, собаке, которая слишком любит еду, бычий корень может вызвать всплеск эмоций вместо расслабления.</p>\n<h2 id=\"t6\">Как, когда это использовать</h2>\n<p>Лучше всего — в моменты, когда собаке нужно сбросить возбуждение и плавно перейти в спокойствие.</p>\n<p>Отлично, если дома есть несколько таких вещей в свободном доступе — и отдельные, которые выдаются по ситуации.</p>\n<p>Важно соблюдать баланс: не нужно при каждом малейшем возбуждении сразу бежать доставать коврик или конг. Иногда полезно просто дать собаке остыть самой и самостоятельно выбрать способ справления.</p>\n<h2 id=\"t7\">Несколько правил</h2>\n<p>Начинайте учить пользоваться триадой в спокойной обстановке, когда собака слегка возбуждена, но не “в пике”.</p>\n<p>Если собака уже на сильных эмоциях, сконцентрироваться на чем-то новом для нее она не сможет, и копинг не сработает.</p>\n<p>Парасимпатическая система не включается мгновенно — для этого нужно время. Поэтому копинг должен использоваться продолжительно до наступления торможения, 5 мин будет точно мало.</p>\n<p>Собака должна заниматься копингом спокойно и методично, монотонно.</p>\n<p>Если она начинает фрустрировать и раздражаться, успокоения не произойдёт.</p>\n<p>Попробуйте понаблюдать, что именно помогает вашей собаке “сбавить газ”?</p><div class=\"gallery\"><a href=\"img/a3/aleydog_138-1.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a3/aleydog_138-1.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a3/aleydog_138-2.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a3/aleydog_138-2.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a3/aleydog_138-3.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a3/aleydog_138-3.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a3/aleydog_138-4.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a3/aleydog_138-4.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a3/aleydog_138-5.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a3/aleydog_138-5.webp\" alt=\"\" loading=\"lazy\"></a></div><p class=\"src\">Источник: канал «ваш кинолог ALEYHAB», <a href=\"https://t.me/aleydog/138\" target=\"_blank\" rel=\"noopener\">t.me/aleydog/138</a></p>"
},

"title": "Как понять собаку: цикл про язык тела",
"lead": "Учимся понимать «доггиш»: о чём машет хвост, как правильно читать сигналы и что значит приветственное потягивание.",
"html": "<p>Учимся понимать «доггиш» (так Альбина называет язык собак). Цикл постов разбирает сигналы на практике, опираясь на развороты книги Лили Чин про сигналы собак.</p><div class=\"linkset\"><a href=\"https://t.me/aleydog/12\" target=\"_blank\" rel=\"noopener\"><b>Язык тела и сигналы собак</b><i>↗</i></a><a href=\"https://t.me/aleydog/13\" target=\"_blank\" rel=\"noopener\"><b>О чём машет хвост</b><span>«Если хвостом машет, значит, добрая?»</span><i>↗</i></a><a href=\"https://t.me/aleydog/14\" target=\"_blank\" rel=\"noopener\"><b>Исследование о хвостиках</b><i>↗</i></a><a href=\"https://t.me/aleydog/112\" target=\"_blank\" rel=\"noopener\"><b>Как правильно читать язык собак</b><i>↗</i></a><a href=\"https://t.me/aleydog/115\" target=\"_blank\" rel=\"noopener\"><b>Приветственное потягивание</b><i>↗</i></a></div><p class=\"src\">Источник: канал «ваш кинолог ALEYHAB», <a href=\"https://t.me/aleydog/111\" target=\"_blank\" rel=\"noopener\">t.me/aleydog/111</a></p>"

"title": "Как пережить Новый год и салюты с собакой",
"lead": "Практический гайд по безопасности и снижению стресса: что делать дома, на прогулке и в момент испуга, как снизить риск побега.",
"html": "<p>Практический гайд по безопасности и снижению стресса. Что можно сделать прямо сейчас?</p>\n<p>Новый год — один из самых сложных периодов для собак. Громкие салюты, фейерверки и петарды звучат не только в новогоднюю ночь, но часто с начала или середины декабря и могут продолжаться до конца января, а иногда и дольше.</p>\n<p>Каждый год после праздников резко возрастает количество объявлений о потерявшихся питомцах: испугавшись громкого звука, они срываются с поводков, выворачиваются из амуниции и убегают. Возрастает и количество обращений к кинологам с проблемой шумофобии: собака в стрессе, отказывается выходить из дома, боится гулять, ломится домой.</p>\n<p>в этом гайде я разбираю:</p>\n<p>что необходимо делать дома и на прогулке</p>\n<p>как помочь справиться со стрессом</p>\n<p>что делать в момент испуга</p>\n<p>как снизить риск побега и потери</p>\n<p>что делать, если собака все же потерялась</p><div class=\"linkset\"><a href=\"https://t.me/aleydog/197\" target=\"_blank\" rel=\"noopener\"><b>Открыть гайд в Telegram</b><span>файл в посте</span><i>↗</i></a></div>"
},

"id": "trevoga-v-odinochestve",
"sec": "separaciya",
"author": "galimova",
"type": "Статья",
"img": "",
"title": "Тревога в одиночестве",
"lead": "Проблема очень распространённая и часто незаметная: она происходит, пока нас нет дома. Первый шаг к ответу — камера.",
"html": "<p>Если в будний день зайти в любой дом, на любой этаж и прислушаться, обязательно услышите, что чья-то собака лает одна дома</p>\n<p>На самом деле проблема очень и очень распространённая. Кроме того, тревога не ограничивается одним лишь симптомом в виде лая или воя.</p>\n<p>Теперь представьте, сколько собак на этом же этаже того же многоквартирного дома в одиночестве молча грызут, портят вещи, царапают двери, срывают обои, испражняются от стресса или причиняют вред себе (разлизывают лапы, кусают собственный хвост и т.д), или даже просто все это время напряженно лежат с открытыми глазами, не пьют, не едят? И все это вместо мирного сна.</p>\n<p>Почему собаки беспокоятся одни дома? Конечно, далеко не всегда тому виной страх одиночества или расстройство привязанности.</p>\n<p>От того, насколько верно определены причины, напрямую зависит эффективность работы</p>\n<p>Поэтому так важно на консультации тщательно собирать анамнез и диагностировать причины тревоги. Причин у одного и того же поведения может быть много, их может быть сразу несколько и от этого будет зависеть план решения.</p>\n<p>Кроме того, проблемы с одиночеством часто бывают не заметными, ведь происходят, пока нас нет дома. А уходя и приходя домой человеку может казаться, что стоит тишина и вроде собака сонная вылезла из дальней комнаты встречать, значит, не переживала? Не факт.</p>\n<p>Первый шаг к ответу - камера. Если всё отлично, порадуемся тому, как пес в забавных позах сладко спит дома один. А если проблема есть, будем знать о ней и сможем помочь.</p><p class=\"src\">Источник: канал «ваш кинолог ALEYHAB», <a href=\"https://t.me/aleydog/69\" target=\"_blank\" rel=\"noopener\">t.me/aleydog/69</a></p>"
},

"id": "umotat-sobaku",
"sec": "separaciya",
"also": [
"povedenie"
],
"author": "galimova",
"type": "Статья",
"img": "",
"title": "Чтобы собака была спокойной, её нужно умотать?",
"lead": "Поможет ли увеличение нагрузки спокойнее оставаться одной? Почему уматывание — ловушка и как балансировать нагрузки.",
"html": "<p>Чтобы собака была спокойнее, её нужно умотать?</p>\n<p>Поможет ли увеличение нагрузки для решения проблемы с одиночеством дома?</p>\n<p>Уматывать и выбегивать собаку не работает в перспективе. Уставшая собака может спать без задних ног, но это лишь маскирует ее неумение самой затормозиться и расслабиться!</p>\n<p>От уматывания чаще всё происходит наоборот:</p>\n<p>от перегруза нервная система возбуждена и ей тяжело затормозиться.</p>\n<p>чтобы себя успокоить, собака использует копинги (грызет, портит вещи, роет, подбирает с земли и так далее).</p>\n<p>человек думает: \"активна, значит, мало нагрузил\".</p>\n<p>даёт еще больше нагрузки!</p>\n<p>собака летит в стратосферу от возбуда  становится более нервной и проблемы в поведении усиливаются.</p>\n<p>Вот такая ловушка!</p>\n<h2 id=\"t9\">Важное про нагрузки и связь с одиночеством</h2>\n<p>Нагрузки бывают двух видов: физические и умственные (ментальные).</p>\n<p>Хорошо будет и то и другое в меру, подходящие возрасту и особенностям конкретной собаки</p>\n<p>Важно учитывать среду, где живёте и насколько собаке сложно там гулять. Насыщенность среды - это тоже нагрузка на нервную систему.</p>\n<p>В городах чаще всего собаки перегружены стимулами (много людей, собак, машин, звуков и других раздражителей, мало свободного зелёного пространства для выгула). Нужно балансировать, подбирая время выгула и маршрут</p>\n<p>Спойлер: собака может быть перегружена стимулами или вообще не вывозить долгую прогулку по городу, но при этом быть недогруженной физически, такое тоже бывает. Многим приходит идея компенсировать это играми в мяч или месиловом с другими собаками (но здесь минусов ещё больше: можно создать мячикового наркомана, очень возбужденное отношение к собакам и понабрать негативного опыта с собачьих тусовок)</p>\n<p>Уматывать собаку никак не поможет в решении проблем с одиночеством.</p>\n<p>Даже наоборот навредит. Уставшая собака = плохообучаемая собака, а еще недоспавшая, более возбудимая, нервная. Взвинченность и спокойствие в одиночестве вещи не сочетающиеся.</p>\n<p>Практика показывает, что такие собаки обучаются одиночеству и любым навыкам намного медленнее других.</p>\n<p>Хотя и недостаток физических или умственных нагрузок, обеденная среда - это другая не полезная крайность. У щенков встречается такое чаще, у взрослых реже. Но не стоит забывать, что причины тревоги в одиночестве чаще всего вообще в другом, поэтому в первую очередь надо определить, из-за чего проблема, а потом уже решать, надо ли с нагрузками что-то делать.</p>\n<p>Сначала понять, что «болит», затем прописать, как «лечить»</p>\n<p>В тему нагрузок, одиночества и проблем в поведении реальный случай из личной практики:</p>\n<p>Хаски, тогда был 1 год, ее угуливали по 5-6 часов каждый день. Она спала дома как убитая, но все равно переживала в одиночестве, выла и разрушала дом (разодрала обои до голых стен и не только). На прогулках рвалась к собакам в истерике от перевозбуда, подбирала с земли, тянула как танк, могла очень долго есть траву и копать землю. И большая часть из этих проблем уменьшились или ушли полностью, когда мы забалансили ей нагрузки!</p><p class=\"src\">Источник: канал «ваш кинолог ALEYHAB», <a href=\"https://t.me/aleydog/70\" target=\"_blank\" rel=\"noopener\">t.me/aleydog/70</a></p>"
},
{
"id": "lekciya-separacionnaya",
"sec": "separaciya",
"author": "galimova",
"type": "Тезисы",
"img": "",
"title": "Сепарационная тревога: тезисы из лекции",
"lead": "Почему уровень разрушений не говорит о причине и чем собаки с истинной сепарационной тревогой отличаются от собак со страхом одиночества.",
"html": "<p>Уровень разрушений (проявления поведения в одиночестве) не позволяет определить, есть ли у собаки истинная сепарационная тревога. То, как именно собака себя ведёт в одиночестве — это индивидуальные копинг-стратегии и копинг-механизмы, как ответ нервной системы на стресс. Кто-то использует \"бей\", а кто-то \"замри\" и это знание не позволяет определить причину проблемы.</p>\n<p>У собак с истинной СТ чаще подавленные состояния, реже деструктивные в одиночестве. Часто у них плохо развиты копинг-механизмы. Их главный копинг - это их человек. Истинники справляются с эмоциями и стрессом преимущественно об человека.</p>\n<p>Человек может сам не замечать обилие лишнего взаимодействия, отрицать гиперопеку — и это нормально. Он может искренне так считать, ведь для него это привычная жизнь с собакой, что происходит каждый день. Наша задача здесь в этот огород отношений человека с собакой аккуратно войти и постепенно прополоть сорняки. И важно именно самого владельца научить отличать сорняки от цветочков</p>\n<p>Собаки с истинной СТ, в отличие от собак со страхом одиночества, обычно вначале учатся одиночеству легче, но потом упираются в потолок и не хотят оставаться без человека несколько часов. В отличие от них, собаки со страхом одиночества больше буксуют на старте, но когда происходит инсайт, дальше они легко начинают наращивать несколько часов в одиночестве.</p><p class=\"src\">Источник: канал «ваш кинолог ALEYHAB», <a href=\"https://t.me/aleydog/62\" target=\"_blank\" rel=\"noopener\">t.me/aleydog/62</a></p>"
},

"title": "Привязанность и сепарационная тревога: исследования",
"lead": "Теория привязанности Боулби и Эйнсворт, исследования о привязанности собак и сепарационной тревоге, концепция SAFE.",
"html": "<p>Привязанность играет роль во многих аспектах жизни собаки, не только в одиночестве дома. Влияет на общее благополучие, уверенность и инициативность собаки, доверие, контакт и взаимоотношения в паре человек-собака. Кроме того, привязанность — процесс двухсторонний. Важно рассматривать обе плоскости: привязанность от человека к собаке и от собаки к человеку.</p>\n<h2 id=\"tt1\">Истоки</h2>\n<p>Привязанность — это глубокая эмоциональная связь, которая формируется между ребенком и его основным опекуном (чаще всего матерью). По определению Джона Боулби, привязанность является биологически обусловленным механизмом, необходимым для выживания и развития ребенка. Она обеспечивает безопасность, защиту и поддержку, что способствует нормальному психологическому и социальному развитию.Теория привязанности была разработана Джоном Боулби и позднее расширена Мэри Эйнсворт. Основные положения теории включают:</p>\n<p>1. Биологическая основа привязанности:</p>\n<p>Боулби утверждал, что привязанность — это эволюционный механизм, который помогает ребенку выживать. Стремление к близости с опекуном заложено в человеке на инстинктивном уровне.</p>\n<p>2. Формирование привязанности:</p>\n<p>Привязанность формируется в первые годы жизни, особенно в период младенчества. Качество привязанности зависит от чувствительности и отзывчивости опекуна к потребностям ребенка.</p>\n<p>3. Внутренняя рабочая модель:</p>\n<p>На основе раннего опыта взаимодействия с опекуном у ребенка формируется \"внутренняя рабочая модель\" — представление о себе, других и мире в целом. Эта модель влияет на будущие отношения и социальное поведение.</p>\n<p>4. Типы привязанности:</p>\n<p>Мэри Эйнсворт, развивая идеи Боулби, выделила три основных типа привязанности: безопасная, тревожно-амбивалентная и избегающая. Позднее был добавлен четвертый тип — дезорганизованная привязанность.</p>\n<p>5. Роль разлуки:</p>\n<p>Боулби изучал последствия разлуки ребенка с опекуном, особенно в раннем возрасте. Он выявил, что длительная разлука может приводить к серьезным эмоциональным и поведенческим проблемам.</p>\n<h2 id=\"tt2\">Основные исследования Боулби и Эйнсворт</h2>\n<ul><li>\"Материнская депривация\" (1951): Боулби изучал последствия разлуки детей с матерями, особенно в условиях институционализации. Он пришел к выводу, что отсутствие материнской заботы в раннем возрасте может приводить к серьезным психологическим проблемам, включая депрессию, тревожность и трудности в социальной адаптации.</li><li>\"Привязанность и утрата\" (1969-1980): В этой трилогии Боулби подробно изложил свою теорию привязанности, объединив идеи из психологии, этологии и эволюционной биологии.</li><li>\"Незнакомая ситуация\" (1978): Эйнсворт разработала экспериментальную методику для оценки типа привязанности у детей в возрасте 12-18 месяцев. В ходе эксперимента ребенок и мать находятся в комнате с незнакомыми предметами и людьми, а затем мать ненадолго уходит. На основе реакции ребенка на разлуку и воссоединение выделяются типы привязанности:</li></ul>\n<p>- Безопасная привязанность: Ребенок расстраивается при уходе матери, но быстро успокаивается после ее возвращения.</p>\n<p>- Тревожно-амбивалентная привязанность: Ребенок сильно тревожится при уходе матери, но после ее возвращения демонстрирует противоречивое поведение (например, стремится к контакту, но одновременно злится).</p>\n<p>- Избегающая привязанность: Ребенок не проявляет явного дистресса при уходе матери и избегает контакта после ее возвращения.</p>\n<p>- Дезорганизованная привязанность (добавлена позже): Ребенок демонстрирует противоречивое и дезориентированное поведение, что часто связано с травматическим опытом.Теория привязанности Боулби и Эйнсворт оказала огромное влияние на психологию развития, клиническую психологию и педагогику. Она подчеркивает важность ранних отношений для формирования личности и социальной адаптации.</p>\n<h2 id=\"tt3\">Эксперименты Гарри Харлоу с макаками-резус</h2>\n<p>Гарри Харлоу провел серию экспериментов, изучая привязанность у детенышей обезьян. Он показал, что детеныши предпочитают мягкую \"суррогатную мать\", даже если она не предоставляет пищу, жесткой, но кормящей \"матери\".</p>\n<p>Harlow, H. F. (1958). The Nature of Love. American Psychologist, 13(12), 673–685.Эти эксперименты доказали, что привязанность не сводится только к удовлетворению физиологических потребностей. А скорее к чувству безопасности и комфорту.</p>\n<h2 id=\"tt4\">Что по собакам?</h2>\n<h2 id=\"tt5\">Topál, J., et al., 1998</h2>\n<p>Attachment Behavior in Dogs (Canis familiaris): A New Application of Ainsworth’s (1969) Strange Situation Test. Journal of Comparative Psychology, 112(3), 219–229.</p>\n<p>Исследования с использованием \"Странной ситуации\" (Strange Situation Test) - методологии, разработанной Мэри Эйнсворт для изучения привязанности у детей, была адаптирована для собак. Этот тест позволяет оценить, как собаки реагируют на разлуку и воссоединение с хозяином.</p>\n<p>Выводы:</p>\n<p>В этом исследовании было показано, что собаки демонстрируют поведение, аналогичное привязанности у детей, включая поиск близости с хозяином и стресс при разлуке.</p>\n<h2 id=\"tt6\">Horn et al., 2013</h2>\n<p>The importance of the secure base effect for domestic dogs – Evidence from a manipulative problem-solving task.</p>\n<p>Исследование изучало, как присутствие хозяина влияет на поведение собаки в стрессовой ситуации (например, при решении сложной задачи).</p>\n<p>Выводы:</p>\n<p>Собаки демонстрируют \"эффект надежной базы\" (secure base effect), аналогичный тому, что наблюдается у детей. Присутствие хозяина повышает уверенность собаки и снижает уровень стресса, что позволяет ей лучше справляться с задачами.</p>\n<h2 id=\"tt7\">Wanser &amp; Udell, 2018</h2>\n<p>Does attachment security to a human handler influence the behavior of dogs who engage in animal assisted activities?</p>\n<p>Исследование изучало, как привязанность собаки к человеку влияет на ее поведение в терапевтических целях (например, в программах с участием собак-терапевтов).</p>\n<p>Выводы:</p>\n<p>Собаки с более надежной привязанностью к хозяину лучше справляются с задачами, требующими взаимодействия с незнакомыми людьми, и проявляют меньше стресса в незнакомых ситуациях.</p>\n<h2 id=\"tt8\">Wanser et al., 2020</h2>\n<p>Evaluating the importance of human attachment for dog behavior and welfare.</p>\n<p>Исследование было посвящено оценке влияния привязанности к человеку на поведение и благополучие собак.</p>\n<p>Выводы:</p>\n<p>Надежная привязанность к хозяину положительно коррелирует с более адаптивным поведением собаки и ее эмоциональным благополучием. Собаки с надежной привязанностью меньше подвержены стрессу и лучше адаптируются к новым условиям.</p>\n<h2 id=\"tt9\">Thielke &amp; Udell, 2015, 2019, 2020</h2>\n<p>Общая тема: Эти исследования сосредоточены на социальных и когнитивных способностях собак, включая их взаимодействие с людьми и другими собаками.</p>\n<p>Основные выводы:</p>\n<p>Собаки обладают уникальными социальными навыками, которые позволяют им эффективно взаимодействовать с людьми (например, следовать указаниям, понимать жесты). Социальное обучение и привязанность к человеку играют ключевую роль в развитии этих навыков. Собаки способны различать эмоции человека и адаптировать свое поведение в зависимости от контекста.</p>\n<h2 id=\"tt10\">Palestrini et al., 2010</h2>\n<p>Heart rate and behavioural responses of dogs in the Ainsworth’s Strange Situation: A pilot study.</p>\n<p>Выводы:</p>\n<p>Собаки с ненадежной привязанностью чаще демонстрировали признаки стресса и тревоги при разлучении с хозяином.Palestrini, C., et al. (2010). Applied Animal Behaviour Science, 125(3–4), 151–159.</p>\n<h2 id=\"tt11\">Storengen et al., 2014</h2>\n<p>A descriptive study of 215 dogs diagnosed with separation anxiety.</p>\n<p>Выводы:</p>\n<p>Подтверждается связь между типом привязанности и уровнем тревоги расставания.Storengen, L. M., et al. (2014). Applied Animal Behaviour Science, 159, 82–89.</p>\n<h2 id=\"tt12\">Человек → собака</h2>\n<h2 id=\"tt13\">Schöberl, Wedl, Bauer, 2012</h2>\n<p>Effects of owner-dog relationship and owner personality on cortisol modulation in human-dog dyads.</p>\n<p>В этом исследовании изучали, как качество отношений между владельцем и собакой, а также личностные черты владельца влияют на уровень кортизола (гормона стресса) у обоих участников диады – человека и собаки. Ученые стремились выяснить, существует ли синхронизация стрессовых реакций в паре \"хозяин-питомец\" и какие факторы (например, стиль взаимодействия, тревожность владельца) могут усиливать или ослаблять эту связь.</p>\n<p>Основные выводы</p>\n<p>Синхронизация уровня кортизола – у собак и их владельцев наблюдалась корреляция в уровнях кортизола, особенно в стрессовых ситуациях, что указывает на взаимное влияние эмоционального состояния.Роль личности владельца – владельцы с высоким уровнем тревожности или невротизма чаще имели собак с повышенным уровнем кортизола, что говорит о передаче стресса от человека к животному.Качество отношений – чем ближе и гармоничнее были отношения в диаде (например, больше совместных игр, ласки), тем ниже был уровень кортизола у собаки. Это подтверждает, что позитивное взаимодействие снижает стресс у питомцев.Пол владельца – интересно, что у женщин-владельцев корреляция уровня кортизола с собаками была сильнее, чем у мужчин, возможно, из-за более эмоционального стиля взаимодействия.</p>\n<h2 id=\"tt14\">Schöberl, Beetz, Solomon, 2016</h2>\n<p>Social factors influencing cortisol modulation in dogs during a strange situation procedure.</p>\n<p>Исследование изучало влияние социальных взаимодействий на уровень стресса у собак, используя модифицированную версию эксперимента \"Незнакомая ситуация\" (изначально разработанного Мэри Эйнсворт для оценки привязанности у детей). В эксперименте участвовали собаки и их владельцы, а также незнакомые люди. Основной целью было проанализировать, как присутствие или отсутствие хозяина влияет на уровень кортизола (гормона стресса) у животных.</p>\n<p>Основные выводы:</p>\n<p>Присутствие хозяина снижает стресс – уровень кортизола у собак был значительно ниже, когда рядом находился владелец, по сравнению с ситуациями, когда они оставались с незнакомым человеком или в одиночестве.Роль привязанности – собаки, демонстрировавшие более сильную привязанность к хозяину (например, активный поиск контакта после разлуки), имели более стабильный уровень кортизола, что указывает на сходство с безопасной привязанностью у детей.Социальная поддержка как буфер против стресса – исследование подтвердило, что социальные связи (в данном случае между собакой и человеком) играют ключевую роль в регуляции стресса, аналогично тому, как это происходит в человеческих отношениях.</p>\n<h2 id=\"tt15\">Schöberl et al., 2017</h2>\n<p>Physiological and behavioral effects of animal-assisted interventions on dog and child with autism spectrum disorder during animal-assisted play therapy.</p>\n<p>Выводы:</p>\n<p>Уровень стресса у собак коррелирует с уровнем стресса у их владельцев. Тревожные владельцы чаще имеют собак с повышенным уровнем кортизола (гормона стресса).Schöberl, I., et al. (2017). Frontiers in Veterinary Science, 4, 73.</p>\n<h2 id=\"tt16\">Dreschel &amp; Granger, 2005</h2>\n<p>Physiological and behavioral reactivity to stress in thunderstorm-phobic dogs and their caregivers.</p>\n<p>Выводы:</p>\n<p>Собаки, чьи владельцы проявляли тревожность во время грозы, демонстрировали более выраженные признаки страха и стресса. Это указывает на передачу эмоционального состояния от владельца к собаке.Dreschel, N. A., &amp; Granger, D. A. (2005). Applied Animal Behaviour Science, 95(3–4), 153–168.</p>\n<h2 id=\"tt17\">Sundman et al., 2019</h2>\n<p>Long-term stress levels are synchronized in dogs and their owners.</p>\n<p>Выводы:</p>\n<p>Уровень кортизола у собак и их владельцев синхронизируется в долгосрочной перспективе. Тревожные владельцы чаще имеют собак с повышенным уровнем стресса.Sundman, A.-S., et al. (2019). Scientific Reports, 9(1), 7391.</p>\n<h2 id=\"tt18\">Bennett &amp; Rohlf, 2007</h2>\n<p>Owner-companion dog interactions: Relationships between demographic variables, potentially problematic behaviours, training engagement and shared activities.</p>\n<p>Выводы:</p>\n<p>Гиперопекающие владельцы чаще сообщали о поведенческих проблемах у своих собак, таких как тревога расставания и деструктивное поведение.Bennett, P. C., &amp; Rohlf, V. I. (2007). Applied Animal Behaviour Science, 102(1–2), 65–84.</p>\n<h2 id=\"tt19\">Pirrone et al., 2017</h2>\n<p>Owner and animal factors predict the incidence of, and owner reaction towards, problem behaviours in companion dogs.</p>\n<p>Выводы:</p>\n<p>Тревожные владельцы чаще сообщали о проблемах с поведением своих собак, таких как агрессия и тревога. Это может быть связано с тем, что тревожные владельцы непреднамеренно усиливают стресс у своих питомцев.Pirrone, F., et al. (2017). Journal of Veterinary Behavior, 20, 22–29.</p>\n<h2 id=\"tt20\">Можно ли изменить уже сложившийся стиль привязанности?</h2>\n<p>Суперспектр привязанности</p>\n<p>Суперспектр привязанности выходит за рамки классической типологии и рассматривает привязанность как континуум адаптивных стратегий, которые человек использует в зависимости от контекста и опыта.Поведение привязанности может быть более гибким и изменчивым, чем предполагалось ранее. Люди могут использовать разные стратегии привязанности в зависимости от ситуации, например, в условиях стресса или безопасности.</p>\n<p>·        Например, человек может демонстрировать разные типы привязанности в разных отношениях (с партнером, друзьями, коллегами).</p>\n<p>Можно ли собаку сдвинуть по спектру к более надежному типу?</p>\n<p>Исследования, такие как Topál et al., 1998 и Wanser &amp; Udell, 2018, показывают, что поведение собак в тестах на привязанность (например, \"Странная ситуация\") может варьироваться в зависимости от контекста и индивидуальных особенностей. Это подтверждает идею привязанности как спектра.</p>\n<p>Стоит рассматривать привязанность как градиент, где поведение и эмоциональные реакции могут плавно изменяться.</p>\n<p>К разным людям, в разных условиях, в разных ситуациях собака будет плавать по спектру.</p>\n<p>Есть факторы внешние, которые будут двигать собаку в сторону более небезопасной привязанности (проблемы со здоровьем, сопутствующие проблемы в поведении - шумофобия, не закрытые базовые потребности, среда и уровень стресса по жизни, связанные с пожилым возрастом проблемы, которые влияют на уверенность в себе, сопутствующие тревожные расстройства).</p>\n<p>Основную роль будет занимать модификация и изменение отношений в паре человек-собака.</p>\n<h2 id=\"tt21\">Адаптация родительских стилей к воспитанию собак</h2>\n<p>Исследователи, такие как Arhant et al., 2010, адаптировали концепцию родительских стилей (авторитетный, авторитарный, либеральный, безразличный) к взаимодействию человека с собакой.</p>\n<p>Они обнаружили, что авторитетный стиль (четкие правила + поддержка) связан с более послушными и менее тревожными собаками, в то время как авторитарный стиль (жесткий контроль + наказания) коррелирует с повышенным уровнем стресса и агрессии.Arhant, C., et al. (2010). Behaviour of smaller and larger dogs: Effects of training methods, inconsistency of owner behaviour and level of engagement in activities with the dog. Applied Animal Behaviour Science, 123(3–4), 131–142.</p>\n<h2 id=\"tt22\">Как создать надежную привязанность?</h2>\n<p>S.A.F.E - Secure Attachment Family Education  — это программа первичной профилактики, направленная на формирование безопасной привязанности между ребёнком и родителями. Она предназначена для матерей и отцов. Одним из основоположенников является известный немецкий психиатр Карл Бриш. Программа адаптирована Гришей Стюарт для применения теории привязанности в обучении и уходе за собаками. Она направлена на улучшение жизни собак посредством понимания и укрепления их привязанности к владельцам.</p>\n<h2 id=\"tt23\">Основные компоненты SAFE-подхода</h2>\n<h2 id=\"tt24\">1. Security (Безопасность)</h2>\n<h2 id=\"tt25\">2. Attachment (Надежная привязанность)</h2>\n<ul><li>Физическая безопасность:</li><li>Обеспечение комфортной среды (уютное место для отдыха, защита от шума, перегрева, холода).</li><li>Отсутствие угроз (агрессивных животных, жестокого обращения).</li><li>Психологическая безопасность:</li><li>Предсказуемость действий владельца (четкие правила, последовательность в дрессировке).</li><li>Избегание наказаний, вызывающих страх (крик, физическое воздействие).</li></ul>\n<h2 id=\"tt26\">3. Freedom (Свобода выбора и контроля)</h2>\n<ul><li>Формирование доверия:</li><li>Чуткое реагирование на потребности собаки (прогулки, кормление, ласка).</li><li>Положительное подкрепление (похвала, лакомства за желаемое поведение).</li><li>Эмоциональная синхронизация:</li><li>Исследования (например, Schöberl et al., 2012) показывают, что собаки \"зеркалят\" стресс владельца – потому важно сохранять спокойствие.</li></ul>\n<h2 id=\"tt27\">4. Emotional Balance (Эмоциональный баланс)</h2>\n<ul><li>Возможность принимать решения:</li><li>Собака должна иметь право на отказ (например, не играть, если не хочет).</li><li>Использование методов добровольного взаимодействия (cooperative care).</li><li>Контроль над средой:</li><li>Доступ к укрытию (например, домику или лежанке, где можно спрятаться).</li><li>Возможность избегать неприятных ситуаций (знакомство с новыми людьми/животными только по желанию собаки).</li></ul>\n<ul><li>Снижение стресса:</li><li>Регулярные ритуалы (прогулки в одно и то же время) повышают предсказуемость.</li><li>Использование феромонов, массажа или музыки для релаксации.</li><li>Развитие устойчивости:</li><li>Постепенная социализация без принуждения.</li><li>Игры и обучение, укрепляющие уверенность.</li></ul><p class=\"src\">Источник: Teletype, Альбина Галимова, <a href=\"https://teletype.in/@aleydog/privyazannost\" target=\"_blank\" rel=\"noopener\">teletype.in/@aleydog/privyazannost</a></p>"
},

"id": "nevidimaya-nit",
"sec": "separaciya",
"author": "galimova",
"type": "Статья",
"img": "",
"title": "Невидимая нить: о привязанности людей и собак",
"lead": "Привязанность — это не слабость. Как бережно учить собаку справляться с разлукой, не обрывая связь.",
"html": "<p>Психоаналитик Джон Боулби называл привязанность \"невидимой эмоциональной нитью\", которая как бы изнутри соединяет двух существ  — во времени, в пространстве.</p>\n<p>Эти нити рождаются из раннего детства, ежедневного опыта с фигурой привязанности: из прикосновений, взглядов, голоса, заботы. И с каждым днём становятся крепче.</p>\n<p>Когда наступает разлука, эти нити не исчезают. Они натягиваются.</p>\n<p>Иногда до волнения, а порой нить натянута так сильно, что становится невыносимо. Мы чувствуем это на себе, когда скучаем по любимым. И собаки — тоже. Это не каприз и не поведение \"на зло\". Это крик привязанности: \"Без тебя — никак.\"</p>\n<p>Наша цель - не разорвать нити, а научиться натягивать их бережно и постепенно ослаблять напряжение, не обрывая.</p>\n<p>Это путь, который требует времени, терпения и чуткости. Мы учим собаку справляться с разлукой не потому, что хотим отдалиться, а потому, что хотим, чтобы она чувствовала себя в безопасности — даже тогда, когда нас нет рядом.</p>\n<p>Уверенность в том, что человек вернётся, рождается из опыта: ушёл на мгновение — и вернулся. Снова и снова. Так постепенно тревога сменяется доверием. Собаки не считают часы, но они читают обстановку, усваивают ритуалы прощания, впитывают изменения в отношениях, становятся более уверенными и самостоятельными. И всё это вплетается в ту самую нить. И постепенно нить становится тёплой, гибкой и надёжной.</p>\n<p>Привязанность — это не слабость. Это сила, с которой можно идти через любые перемены. Вместе.</p><p class=\"src\">Источник: канал «ваш кинолог ALEYHAB», <a href=\"https://t.me/aleydog/73\" target=\"_blank\" rel=\"noopener\">t.me/aleydog/73</a></p>"
},

"id": "brish-privyazannost",
"sec": "separaciya",
"author": "galimova",
"type": "Тезисы",
"img": "",
"title": "Тезисы из книги Карла Бриша о привязанности",
"lead": "Три части тезисов из книги «Теория привязанности и воспитание счастливых людей. Программа SAFE» и что они значат для жизни с собакой.",
"html": "<h2 id=\"b1\">Часть 1</h2>\n<p>О природе привязанности:</p>\n<p>«Мы можем смело утверждать, что ребёнок рождается с генетически обусловленной потребностью в привязанности...Потребность в привязанности прослеживается и в животном мире... как очевидная гарантия выживания.»</p>\n<p>«Человеком, к которому всей душой привяжется грудной ребёнок, может стать не только родитель, но и любой взрослый, способный защитить и успокоить.»</p>\n<p>О базовых потребностях и привязанности:</p>\n<p>«Физиологические потребности — еда, сон, воздух, крыша над головой — столь фундаментальны, что ни одна из них не может быть оставлена без внимания.»</p>\n<p>«Без разнообразия ощущений развивается атрофия чувствительности и замедление формирования нейронных связей.»</p>\n<p>Так же важна «Потребность в личной эффективности — \"я способен что-то изменить!\". Это означает, что им необходимо действовать самостоятельно, без чьей либо помощи.»</p>\n<p>О связи привязанности и поведения:</p>\n<p>«Если у ребёнка нет опыта надёжной привязанности, способности к исследовательской деятельности выражены слабо или не проявляются вовсе.»</p>\n<p>«Когда фигура привязанности уходит, система привязанности активируется — и всё остальное перестаёт быть значимым.»</p>\n<p>Карл Бриш “Теория привязанности и воспитание счастливых людей. Программа SAFE\"</p>\n<h2 id=\"b2\">Часть 2</h2>\n<p>Когда потребность в близости особенно нужна?</p>\n<p>«Грудной ребёнок не каждую секунду нуждается в участии взрослого. Но всё это может внезапно понадобиться, если он заметит, что разлучён с близким человеком, или если вдруг испугается.»</p>\n<p>Важно учитывать два направления привязанности</p>\n<p>\"Привязанность родителей к ребёнку (bonding) — это готовность эмоционально настроиться на него и обеспечивать защиту.</p>\n<p>Привязанность ребёнка (attachment) — стремление искать близость и утешение у надёжного взрослого.»</p>\n<p>Пирамида привязанности</p>\n<p>«Эмоциональные связи с взрослыми выстраиваются по типу пирамиды.</p>\n<p>На вершине — самый близкий, часто это мама. Именно её ребёнок зовёт, когда страшно или больно.</p>\n<p>Остальные взрослые важны, но их помощь работает лишь в ситуациях меньшего стресса.»</p>\n<p>Игра, исследование возможны только в покое</p>\n<p>«Потребность в привязанности и исследовательская активность не работают одновременно.</p>\n<p>Ребёнок играет, исследует и сосредоточен только тогда, когда его система привязанности в пассивном состоянии — когда он чувствует себя в безопасности.»</p>\n<p>Привязанность — прежде обучения</p>\n<p>«Дети, нуждающиеся в эмоциональной поддержке, не могут сосредоточиться на задании и воспринимать информацию.</p>\n<p>Привязанность всегда предшествует обучению — на любом возрастном этапе и в любой среде.»</p>\n<h2 id=\"b3\">Часть 3</h2>\n<p>Прочная привязанность не случайна</p>\n<p>«Вполне предсказуемо и не случайно то, кого именно выберет ребёнок в качестве самого близкого человека…»</p>\n<p>Ребёнок выбирает того, кто чутко откликается и чаще всего рядом.</p>\n<p>Чуткость — это действие, а не абстрактное качество</p>\n<p>«Чуткое поведение по отношению к ребёнку — это способность внимательно отнестись к сообщениям ребёнка, понять их и действовать в интересах ребёнка.»</p>\n<p>Один плач — много смыслов</p>\n<p>«Младенцы могут плакать от голода или жажды, от скуки или страха, от боли или неприятных ощущений…»</p>\n<p>Чуткий взрослый различает и выбирает нужный отклик</p>\n<p>Слова тоже строят связь</p>\n<p>«Для формирования прочных эмоциональных связей необходимо речевое общение родителей с младенцем…»</p>\n<p>Разговаривая с ребёнком о нём самом, взрослый даёт чувство: «Я тебя вижу и понимаю»</p>\n<p>Зрительный контакт — первый язык общения</p>\n<p>«Смотреть друг на друга — значит общаться.»</p>\n<p>Глаза, мимика — главный инструмент понимания до слов</p>\n<p>Прикосновения — язык тела и гормон доверия</p>\n<p>«Чуткие прикосновения мамы к малышу способствуют установлению между ними надёжной эмоциональной привязанности.»</p>\n<p>Телесная близость, массаж и объятия запускают «гормон любви» — окситоцин</p>\n<p>Главное: сначала внешняя регуляция — потом внутренняя</p>\n<p>«Организм младенцев не приспособлен к тому, чтобы они самостоятельно справлялись со значительным по силе стрессом…»</p>\n<p>«Сначала нужен как минимум один человек, который, чутко взаимодействуя… поможет справиться с потоком отрицательных переживаний…»</p>\n<p>«Только благодаря этому опыту младенец узнаёт, что избавиться от неприятных эмоций и стресса в принципе возможно.»</p>\n<p>Только многократный опыт «кто-то помогает» даёт ребёнку опору научиться «я справлюсь сам».</p>\n<p>ИТОГ</p>\n<p>Чуткий взрослый — это тот, кто становится для ребёнка внешней опорой и источником спокойствия, когда тот ещё не может удержать его внутри себя.</p>\n<p>Так шаг за шагом закладывается способность справляться самостоятельно тревогой и стрессом, но всегда сначала через надёжную фигуру привязанности</p>\n<p>«Шаг за шагом у ребёнка появляются собственные ресурсы для восстановления внутреннего равновесия…»</p><p class=\"src\">Источник: канал «ваш кинолог ALEYHAB», <a href=\"https://t.me/aleydog/75\" target=\"_blank\" rel=\"noopener\">t.me/aleydog/75</a></p>"
},

"id": "osnovnoy-i-zapasnoy",

"title": "«Основной» и «запасной» хозяин: миф или правда?",
"lead": "Бывают ли у собаки главные и второстепенные люди? Пирамида привязанности и как выстроить своё место в ней.",
"html": "<p>У многих они вызывают смех,</p>\n<p>но для кого-то это по-настоящему обидно — ведь кажется, что питомец «любит» кого-то больше</p>\n<p>Так ли это на самом деле?</p><p>Бывают ли основные и второстепенные фигуры для собаки?</p>\n<p>Ответ — да. И психология это хорошо объясняет.</p>\n<h2 id=\"t1\">Пирамида привязанности</h2>\n<p>Привязанность ребёнка к взрослым — не равномерная. Это иерархия, где на вершине находится тот, кто обеспечивает наибольшую стабильность и помощь в трудные моменты.</p>\n<p>Обычно это мама. Остальные — папа, бабушка, няня — тоже значимы, но в меньшей степени. Их забота и утешение тоже ценны, но тогда, когда стресс не зашкаливает.</p>\n<h2 id=\"t2\">Что это значит для нас?</h2>\n<p>У каждого ребёнка (и не только ребёнка) есть свой «главный человек».</p>\n<p>Остальные могут быть в «запасе» — не потому что хуже, а потому что просто занимают другое место в системе привязанности</p>\n<p>Значит ли это, что собака не любит остальных? Конечно же нет! На практике мы часто сталкиваемся с тем, что собака одинаково привязана к нескольким членам семьи</p>\n<h2 id=\"t3\">Хорошая новость</h2>\n<p>своё место в этой системе можно выстроить — через повторяющийся опыт заботы, спокойствия и предсказуемости. Не за один день, но это вполне реально</p><p class=\"src\">Источник: канал «ваш кинолог ALEYHAB», <a href=\"https://t.me/aleydog/81\" target=\"_blank\" rel=\"noopener\">t.me/aleydog/81</a></p>"
},

"title": "Как выбрать передержку или ситтера для собаки",
"lead": "Родственники, ситтинг, домашняя передержка или отель: как выбрать формат под конкретную собаку и на что обратить внимание.",
"html": "<p>Когда нужно уехать в отпуск, командировку или даже просто на несколько часов, встаёт вопрос: кому доверить собаку. Вариантов несколько.</p>\n<ul><li>Можно оставить её с родственниками/друзьями у себя дома или отправить к ним домой.</li><li>Есть ситтинг — когда человек приходит к вам и остаётся на вашей территории, у вас дома с собакой: от пары часов и до нескольких недель или целого месяца.</li><li>Есть домашняя передержка, когда собаку забирают к себе. Иногда туда берут сразу несколько собак из разных семей, также у самой передержки может быть своя собака.</li><li>Есть гостиницы и отели для животных. В некоторых из них собаки находятся вместе, а где-то раздельно по комнатам \"номерам\", а в некоторых из них практикуют уличные вольеры и клетки.</li></ul>\n<p>##</p>\n<p>Эта статья о том, как выбрать формат под конкретную собаку, на что обращать внимание и чего точно не делать.</p>\n<h2 id=\"tt1\">Как понять, какой формат подходит именно вашей собаке</h2>\n<p>Отталкиваемся от адаптивности, уровня тревожности и наличия проблем поведения. Чем тревожнее собака и чем сложнее она привыкает к новым местам и новым людям, тем спокойнее должен быть вариант проживания. Самый щадящий формат — ситтинг у вас дома: привычные запахи, свои безопасные уголки, привычные предметы, знакомые места для выгула. Если собака легко осваивает новые пространства, нормально относится к незнакомцам, уже бывала в гостях и быстро расслабляется, подойдёт и домашняя передержка на территории ситтера.</p>\n<p>С отелями нужно быть особенно осторожными. Не каждой собаке комфортно постоянно находиться среди многих животных. Некоторых это перегружает: им сложно расслабиться, спать и чувствовать себя спокойно в такой среде. Также не каждая собака сможет находиться изолированно в отдельной комнате. Помните, что находиться в одиночестве в своем доме и находиться одной в новом месте — это совершенно разные по уровню сложности навыки.</p>\n<h2 id=\"tt2\">Родственники и друзья: за и против</h2>\n<p>Для собак спокойных без особых проблем поведения — прекрасный вариант! Главное, чтобы человек умел взаимодейтсвовать с собакой и знал, как за ней ухаживать. Для тревожной собаки остаться со знакомым человеком бывает проще, ведь доверие уже есть.</p>\n<p>Но важно учитывать множество деталей. Есть ли у этого человека опыт проживания с собаками? Понимает ли он, как вести себя в сложных ситуациях? Какая у него семья: живёт один или с большим количеством людей? Какой у него ритм жизни и график работы: нужно ли уходить на долгие часы каждый день? Часто ли приходят гости? Работает ли он из дома или наоборот много времени проводит вне дома? Всё это сильно влияет на то, как будет чувствовать себя собака.</p>\n<p>Поэтому для многих сложных собак безопаснее и комфортнее, если с ними работает профессионал — ситтер с большим опытом или даже специалист по поведению, который умеет действовать в разных ситуациях.</p>\n<h2 id=\"tt3\">Предварительное знакомство — обязательно</h2>\n<p>Какой бы вариант вы ни выбрали, нужна встреча заранее. Идеально — «пробный день», чтобы собака побыла с человеком или в новом месте в спокойной обстановке и без спешки. Это снижает уровень стресса собаки и помогает понять, подходит ли формат в реальности, а не на словах. Также помогает вам познакомиться лично с человеком, понять, доверяете ли вы ему, как он взаимодействует с собакой, увидеть условия, в которых собака будет содержаться.</p>\n<h2 id=\"tt4\">Договор — ваш базовый уровень безопасности</h2>\n<p>У профессионалов всегда есть договор. В нём прописывают обязанности сторон и важные бытовые детали: можно ли уходить из дома и на сколько, допускаются ли гости, можно ли брать собаку с собой, как решаются медвопросы и внештатные ситуации. Если ситтинг проходит у вас дома, отдельно оговаривайте сохранность имущества. От договора не отказываемся: это защита и вам, и специалисту. Если договор не предлагают или от него отговаривают, это уже тревожный сигнал.</p>\n<h2 id=\"tt5\">Доверие и личное посещение</h2>\n<p>Очень важно, чтобы у вас было доверие к выбранному человеку. Коннект между вами и ситтером или передержкой должен чувствоваться. Если внутри появляется сомнение — доверьтесь интуиции. Даже если у места десятки положительных отзывов, приезжайте лично. Смотрите на чистоту, безопасность, наличие зон для отдыха и то, насколько это место реально подходит именно вашей собаке.</p>\n<p>Хороший специалист всегда задаёт много вопросов о поведении, здоровье и привычках — это отличный признак внимательности и чуткого, индивидуального подхода.</p>\n<h2 id=\"tt6\">Обучение на передержке: когда можно, а когда лучше не надо</h2>\n<p>Учить чему-то во время передержки можно только после того, как собака адаптировалась и не испытывает стресс. Речь именно о простых базовых навыках, командах, трюках и бытовых вещах. Все занятия должны фиксироваться на видео и отправляться владельцу. Важно видеть не «магическое до-после», а весь процесс постепенных шагов. Отказ показывать процесс или демонстрация только «идеального результата» — повод насторожиться: высок риск, что на собаку давили, и она просто боится проявлять своё обычное поведение.</p>\n<p>Работа со сложным поведением всегда ведётся вместе с владельцем в том месте, где вы проживаете с собакой. Страхи, фобии, реактивное поведение, гиперактивность, агрессия, проблемы с одиночеством — это не то, что можно отдать на аутсорс. Собака не механизм, не машина, которую можно починить, сдав в автосервис. Именно человек учится видеть состояние собаки, работать над балансом возбуждения и торможения, учится как вести себя и что делать в разных ситуациях, как работать с триггерами, выстраивать менеджмент среды, как и когда можно постепенно усложнять задачи. Это не то, что «сделают с вашей собакой где-то без вас».</p>\n<h2 id=\"tt7\">Чего лучше избегать</h2>\n<h2 id=\"tt8\">Итог</h2>\n<ul><li>Клетки. Это слишком ограниченное пространство, нарушающее базовую потребность собаки свободно перемещаться.</li><li>Уличные вольеры. Для домашних собак это почти всегда сильный стресс, перепады температуры, изоляция, высокая стимульность среды и небезопасность.</li><li>Аверсивные методы и амуниция. Если видите, что человек применяет удавки, строгие ошейники, электрические ошейники, делает рывки поводком, обращается грубо или использует давление — это точно не ваш вариант. Даже если вас убеждают, что \"с этой собакой нельзя по-другому или \"ей это необходимо\", \"ей не больно\", \"она не боится\" — не верьте.</li></ul>\n<p>Нет одного «правильного» решения для всех. Для тревожных и чувствительных собак чаще всего оптимален ситтинг на вашей территории. Для адаптивных подойдёт и домашняя передержка у проверенного человека. Гостиницы — история очень индивидуальная и требующая внимательной проверки условий. В любом случае встречайтесь заранее, устраивайте пробный день, заключайте договор, лично проверяйте место и прислушивайтесь к себе. Тогда шансы на спокойную поездку и спокойную собаку будут максимальными.</p><p class=\"src\">Источник: Teletype, Альбина Галимова, <a href=\"https://teletype.in/@aleydog/perederjka\" target=\"_blank\" rel=\"noopener\">teletype.in/@aleydog/perederjka</a></p>"

"id": "sezonnaya-linka",
"sec": "uhod",
"author": "terenteva",
"type": "Статья",
"img": "img/a4/linka-4.webp",
"title": "Как пережить сезонную линьку: спрей от колтунов",
"lead": "Почему во время линьки появляются колтуны, зачем нужен спрей, как читать состав и можно ли пользоваться им постоянно. В конце сравнение популярных спреев.",
"html": "<p>Каждую весну и осень владельцы собак сталкиваются с одной и той же проблемой: шерсть буквально повсюду. На диване, одежде, коврах и даже в чашке с любимым кофе. И даже твой свитер как будто бы уже и не целиком твой, он стал почти живой.</p>\n<p>Сезонная линька у собак – это естественный физиологический процесс обновления шерстного покрова. Но именно в этот период уход за шерстью становится особенно важным. Если пустить все на самотек, это может обернуться проблемой для животного и его хозяина.</p>\n<p>Спреи для облегчения расчесывания и вычесывания шерсти – лишь один из инструментов, помогающих в этот непростой период.</p>\n<p>Разберемся, действительно ли они нужны, как работают и почему далеко не каждый спрей подходит для регулярного применения.</p>\n<h2 id=\"l1\">Почему во время линьки у собаки образуются колтуны?</h2>\n<p>Шерстный покров собак состоит из волос разных типов. У многих пород есть остевые волосы и мягкий, густой подшерсток.</p>\n<p>Во время линьки часть волос завершает свой цикл роста и выпадает. Однако далеко не все отмершие волосы сразу покидают шерстный покров. Некоторые задерживаются среди растущих волос, переплетаются между собой и постепенно образуют плотные скопления.</p>\n<p>Особенно часто это происходит у длинношерстных животных и пород с густым подшерстком.</p>\n<p>Важно понимать, что колтуны – это не просто эстетическая проблема. Плотно спутанная шерсть может натягивать кожу животного, причиняя ему дискомфорт, затруднять осмотр кожного покрова и создавать условия для накопления влаги и загрязнений.</p>\n<p>Поэтому во время линьки регулярное вычесывание – это важная часть гигиенического ухода и заботы о питомце.</p>\n<h2 id=\"l2\">Зачем нужен спрей от колтунов во время линьки?</h2>\n<p>Представьте, что вы пытаетесь расчесать сильно спутанные волосы без кондиционера. Расческа застревает, волосы растягиваются, а процедура становится неприятной. Это очень больно, неправда ли? С шерстью собак происходит нечто похожее.</p>\n<p>Поверхность волоса у собак покрыта кутикулой – наружным слоем из перекрывающихся чешуек. При повреждении и повышенном трении волосы легче цепляются друг за друга, особенно если шерсть сухая и спутанная, причиняя животному боль и вызывая раздражение кожи.</p>\n<p>Основная задача спрея – уменьшить трение между волосами и облегчить их разделение при расчесывании.</p>\n<p>В зависимости от состава такие средства могут:</p>\n<ul><li>Облегчать скольжение расчески и уменьшать механическое повреждение шерсти.</li><li>Снижать статическое электричество, из-за которого волосы сильнее притягиваются друг к другу.</li><li>Образовывать тонкую кондиционирующую пленку на поверхности волоса.</li><li>Помогать распутывать небольшие спутанные участки и предупреждать образование новых колтунов.</li></ul>\n<p>Но есть важный нюанс: спрей не останавливает сезонную линьку и не удаляет отмерший подшерсток самостоятельно. Он лишь делает вычесывание шерсти более комфортным и эффективным.</p>\n<h2 id=\"l3\">Что искать в составе хорошего спрея от колтунов?</h2>\n<p>Не нужно быть химиком, чтобы научиться читать этикетку. Достаточно понимать, какие группы компонентов отвечают за действие продукта.</p>\n<ul><li>Кондиционирующие компоненты, такие как Polyquaternium-7, Polyquaternium-10, Cetrimonium Chloride, Guar Hydroxypropyltrimonium Chloride, Behentrimonium Chloride. Они способны адсорбироваться на поверхности волоса, уменьшать статическое электричество и облегчать расчесывание шерсти.</li><li>Силиконы. Например, Dimethicone, Amodimethicone, Cyclopentasiloxane. Они могут создавать на поверхности волоса тонкую пленку, снижать трение и улучшать скольжение.</li></ul>\n<p>Вопреки распространенному мифу, силиконы сами по себе не являются признаком плохого состава. Важнее их тип, концентрация и особенности готовой формулы.</p>\n<ul><li>Увлажняющие компоненты, такие как Glycerin, Panthenol и некоторые другие вещества помогают регулировать содержание влаги и улучшать свойства шерсти. Однако наличие увлажняющих компонентов еще не означает, что средство эффективно распутывает колтуны. Для этого особенно важны кондиционирующие свойства всей рецептуры.</li></ul>\n<h2 id=\"l4\">Как самостоятельно проверить состав?</h2>\n<p>Прежде всего ищите полный перечень ингредиентов, а не только рекламные надписи на упаковке. Фразы «натуральный», «гипоаллергенный», «без химии» или «подходит для ежедневного использования» сами по себе ничего не доказывают.</p>\n<p>Если производитель не раскрывает состав, оценить безопасность средства значительно сложнее. Нужен ли Вам такой спрей? Если производитель не готов честно раскрыть состав, ему есть что скрывать?</p>\n<p>Обращайте внимание на назначение продукта: спрей должен быть предназначен именно для собак. Собаки имеют рН кожи, отличный от человеческого, для несмываемых средств это очень важно учитывать.</p>\n<h2 id=\"l5\">Можно ли использовать спрей постоянно?</h2>\n<p>Да, но с оговорками. Если средство разработано как несмываемый продукт для собак, имеет подходящий состав и хорошо переносится питомцем, его можно использовать регулярно в соответствии с инструкцией производителя.</p>\n<p>Однако здесь важно различать два понятия: регулярный уход и ежедневное нанесение. Во время активной линьки вычесывание может требоваться чаще обычного. Но это не означает, что перед каждым движением расчески необходимо наносить спрей. Частота применения зависит от типа шерсти, ее состояния и свойств конкретного средства.</p>\n<p>При чрезмерном использовании некоторые кондиционирующие компоненты могут накапливаться на поверхности волос, утяжелять шерсть, изменять ее текстуру и способствовать накоплению загрязнений. Поэтому больше – не всегда лучше.</p>\n<p>Наблюдайте за своим питомцев в такой непростой переходный период. Регулярное и правильное вычесывание позволяет удалять выпавшие волосы, предупреждать образование колтунов и контролировать состояние кожи. А качественный спрей становится полезным помощником: уменьшает трение, облегчает расчесывание и делает уход менее травматичным.</p>\n<p>Но даже самый дорогой спрей не заменит правильно подобранную расческу, регулярный уход и внимательное отношение к состоянию шерсти в течение всего года.</p>\n<h2 id=\"l9\">Сравнение спреев от колтунов</h2>\n<p>Популярные спреи разделены на пять групп по составу.</p>\n<div class=\"tblw\"><table><thead><tr><th>Группа</th><th>Почему</th><th>Спреи</th><th>Что это значит</th></tr></thead><tbody><tr><td><b>1. «Таинственные ребята»</b></td><td>Состав не раскрыт полностью</td><td>Spets, Харли, Woolly pets, WG Equestrian, Wellroom, I love my pet</td><td>На карточках товаров нет полной информации о составе или указаны только отдельные компоненты. Оценить безопасность сложно.</td></tr><tr><td><b>2. «Опасные ребята»</b></td><td>В составе запрещённый консервант</td><td>Amigo, Muzzle, Komondor, NipponPet, MILV, Pchelodar (увлажняющий спрей-кондиционер и спрей-антиколтун), Гаврила, Canapa Milord, Echepa Milord, AuraPet, GOODr</td><td>Консервант запрещён для несмываемых средств, к которым относится спрей. Для людей он под запретом, а животным можно то, что нельзя человеку?</td></tr><tr><td><b>3. «Привет, дерматит»</b></td><td>В составе хлоргексидин</td><td>Ecolatier lovely pets</td><td>Антисептик допустим для лечебных средств, но не для регулярного ухода и несмываемых продуктов. Производитель советует наносить каждые 2–3 дня: это может нарушить микрофлору кожи и привести к сухости, зуду, шелушению и дерматиту.</td></tr><tr><td><b>4. «Хорошие ребята»</b></td><td>Современный и безопасный состав</td><td>Astati pamilee, Zoorik, Ionvet Spa, Beauty Pet, Grodo</td><td>Консерванты в соответствии с современными требованиями, есть ухаживающие и кондиционирующие компоненты. Подходят для регулярного использования.</td></tr><tr><td><b>5. «Да, но…»</b></td><td>Ничего критичного, но есть аллергены</td><td>Milord Spray conditioner Numero uno</td><td>В составе отдушка (Parfum), лимонен, линалоол и другие ароматические компоненты. Подходит не всем: перед первым применением стоит проверить чувствительность.</td></tr></tbody></table></div><div class=\"gallery\"><a href=\"img/a4/linka-1.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a4/linka-1.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a4/linka-2.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a4/linka-2.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a4/linka-3.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a4/linka-3.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a4/linka-4.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a4/linka-4.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a4/linka-5.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a4/linka-5.webp\" alt=\"\" loading=\"lazy\"></a></div>"

"id": "shampun-gladkosherstnye",
"sec": "uhod",
"author": "terenteva",
"type": "Гайд",
"img": "",
"pdf": "pdf/shampun-gladkosherstnye.pdf",
"title": "Шампунь для гладкошёрстной собаки: на что смотреть",
"lead": "Каким породам нужен такой уход, чем особенная их шерсть и кожа и какие компоненты в шампуне помогают.",
"html": "<h2 id=\"g1\">Кто такие гладкошёрстные</h2>\n<ul><li>доберман</li><li>немецкий дог</li><li>гладкошёрстная такса</li><li>американский стаффордширский терьер</li><li>французский бульдог</li><li>джек-рассел-терьер</li><li>многие метисы с короткой плотно прилегающей шерстью</li></ul>\n<h2 id=\"g2\">Чем особенная их шерсть</h2>\n<p>Шерсть плотно прилегает к коже: по направлению роста она кажется гладкой и «лаковой», а против шерсти отдельные волоски довольно жёсткие и колючие.</p>\n<p>У гладкошёрстных пород нет выраженного рыхлого подшёрстка, который удерживает вылинявший волос, а цикл роста короткого волоса короче, чем у длинношёрстных собак. Старые волоски быстрее сменяются и активно выпадают. Поэтому такие собаки линяют не меньше, а субъективно даже больше: короткие жёсткие «иголочки» пробиваются через ткань и плотно в неё вцепляются.</p>\n<blockquote>Кожа у многих гладкошёрстных собак более открыта и чувствительна, поэтому важно подбирать мягкие шампуни и не пересушивать её частыми купаниями.</blockquote>\n<h2 id=\"g3\">Какие компоненты помогают</h2>\n<ul><li><b>Аллантоин</b> увлажняет, успокаивает кожу и помогает ей быстрее восстановиться после микроповреждений. Выручает при чувствительной коже.</li><li><b>Глицерин</b> притягивает и удерживает влагу, чтобы кожа не пересыхала.</li><li><b>Пантенол</b> увлажняет кожу и поддерживает её защитный барьер.</li><li><b>Протеины шёлка</b> делают шерсть более гладкой, ухоженной и блестящей.</li><li><b>Экстракт ромашки</b> мягко заботится о коже, природный антисептик.</li><li><b>Экстракт розмарина</b> добавляет антиоксидантные свойства, улучшает кровообращение и стимулирует рост шерсти.</li><li><b>Масло арганы</b> делает шерсть мягкой, гладкой и ухоженной.</li></ul>\n<h2 id=\"g4\">Каким должен быть шампунь</h2>\n<p>Хороший шампунь для собаки бережно очищает и не оставляет ощущения сухости. После купания шерсть мягкая, гладкая и блестящая, а коже комфортно. Сильная пена и мытьё «до скрипа» не нужны.</p><p class=\"src\">Источник: канал Оксаны Терентьевой, <a href=\"https://t.me/dr_tekhnolog/26\" target=\"_blank\" rel=\"noopener\">t.me/dr_tekhnolog/26</a></p>"
},

"id": "oshibki-vybora-shampunya",
"sec": "uhod",
"author": "terenteva",
"type": "Пост",
"img": "",
"title": "5 ошибок при выборе шампуня для собаки",
"lead": "«Чем натуральнее, тем лучше», выбор по запаху и пене и другие ошибки, которые совершают даже очень любящие владельцы.",
"html": "<p>🐶Владельцы любят своих питомцев, но часто совершают одни и те же ошибки при выборе шампуней.</p>\n<h2 id=\"s1\">1. Выбирают шампунь по принципу «чем натуральнее — тем лучше»</h2>\n<p>🌱 Натуральный состав сам по себе не гарантирует, что средство подойдёт собаке. Важны вся формула, концентрации ингредиентов и задача продукта.</p>\n<p>❗️Кстати, чем больше шампунь содержит натуральных компонентов с тем выше риск аллергических реакций.</p>\n<h2 id=\"s2\">2. Смотрят только на pH</h2>\n<p>🧼 Подходящий pH — важно, но это лишь один параметр. Мягкость очищающей системы ПАВ, увлажняющие компоненты и совместимость всей формулы имеют не меньшее значение.</p>\n<h2 id=\"s3\">3. Покупают шампунь по запаху</h2>\n<p>👃🏻 Аромат — критерий для человека, а не показатель качества продукта.</p>\n<p>❗️Сильная отдушка не делает шампунь лучше, а наоборот, сильно вредит собаке и тем более кошке.</p>\n<h2 id=\"s4\">4. Выбирают шампунь по типу шерсти, забывая о коже</h2>\n<p>🐩Шерсть может выглядеть прекрасно, пока кожа при этом пересушивается или раздражается. При выборе важно учитывать исходное состояние кожи питомца и частоту купания.</p>\n<h2 id=\"s5\">5. Считают, что шампунь должен отмывать «до скрипа» и хорошо пениться</h2>\n<p>🫧 Это одна из самых распространённых ошибок. Слишком агрессивное очищение может нарушать защитный барьер кожи. Хороший шампунь должен очищать эффективно, но при этом не превращать кожу в «чистый лист». А пена не является показателем очищения.</p>\n<p>Сколько из этих ошибок совершали вы? Признавайтесь))</p><p class=\"src\">Источник: канал Оксаны Терентьевой, <a href=\"https://t.me/dr_tekhnolog/31\" target=\"_blank\" rel=\"noopener\">t.me/dr_tekhnolog/31</a></p>"
},

"id": "10-opor-povedenie",
"sec": "povedenie",
"author": "fedorchuk",
"type": "Статья",
"img": "",
"title": "10 шагов, если с поведением собаки трудно",
"lead": "Ресурс владельца, здоровье, сон, баланс активности, амуниция и ещё пять опор, с которых стоит начать до занятий с кинологом.",
"html": "<h2 id=\"f1\">1. Ресурсное состояние</h2>\n<p>Прежде, чем помочь кому-либо, заниматься кем-либо, надо позаботиться о себе. Если вы не в ресурсном состоянии, то не справитесь с задачами, требующими достаточно много сил. Кроме того, собаки хорошо чувствуют состояние своего человека и откликаются на него. Бесполезно поощрять собаку, если вы злитесь. Ругать бесполезно в принципе. Поэтому, если вы сильно устали от собаки, имеет смысл подумать про передержку, либо делегировать часть своих задач, либо снизить требования.</p>\n<h2 id=\"f2\">2. Снизить требования</h2>\n<p>Вспомнить, это всего лишь собака, животное, интеллект которого не выше, чем у 3-летнего ребенка. Вы завели себе питомца, он привязан к вам, но многого не понимает к сожалению. Собака никогда не станет человеком. И ещё они живут так недолго, что имеет смысл ценить каждый момент радости, пока ваш питомец с Вами.</p>\n<h2 id=\"f3\">3. Здоровье</h2>\n<p>Очень часто проблемы с поведением собак возникают по причине болезней. Поэтому рекомендую, если собака проявляет нечистоплотность, агрессию, стала плохо реагировать на команды, беспокойна, обратиться в ветеринарную клинику.</p>\n<h2 id=\"f4\">4. Баланс отдыха и активности</h2>\n<p>Баланс отдыха-активности очень сильно влияет на обучаемость и в целом на их поведение. Прогулки менее часа в день как правило, недостаточны для взрослой собаки. Такой режим может приводить к тому, что собака лает, бесится дома. Но и слишком длинные прогулки каждый день, особенно если собака активно двигается (играет на площадке, бегает за мячом, за палкой и тд.) - приводят к перевозбуждению. Собака устаёт, но не может успокоиться, становится неуправляемой.</p>\n<p>Оптимальный режим - 2-3 прогулки общей продолжительностью 1,5-2 часа. Во время прогулок важно предоставить возможность собаке нюхать - это самое видотипичное поведение. Активные игры - не более часа подряд, 2-3 раза в неделю. Длительные прогулки, поездки в новые места - не чаще 1 раза в неделю.</p>\n<h2 id=\"f5\">5. Сон</h2>\n<p>Для того, чтобы собака была спокойной, хорошо обучалась командам, очень важно, чтобы она спала 10-12 часов в сутки. Щенкам надо спать по 14-16 часов. Поэтому важно обеспечить питомцу безопасное спокойное место для отдыха. Без экстренной необходимости не следует будить спящую собаку. Особенно, если она дёргается или лает во сне - это фаза активного сна, она очень важна для освоения нового опыта, успешного обучения.</p>\n<p>Поэтому, если у вас собака на цепи - рекомендую построить вольер. Если собака дома, есть маленькие дети - объяснить, что нельзя трогать спящую собаку.</p>\n<h2 id=\"f6\">6. Амуниция</h2>\n<p>Шлейка и поводок не менее 5 метров. Собака - друг человека. На прогулке вы держите поводок как страховочный трос, потому что у вашего друга нет рук. К страховочному тросу не прикрепляют ни удавку (даже если она называется ринговка, контроллер), ни рывковую цепочку, ни ошейник с шипами, впивающимися в кожу. Вот и к поводку надо прикрепить мягкую и удобную шлейку.</p>\n<h2 id=\"f7\">7. Менеджмент среды</h2>\n<p>Устранение возможности контакта с тем, что собаку пугает или вызывает агрессию. Например, изменение времени прогулок, изменение маршрута прогулки, разделение собак в разных комнатах. Ещё помогает справиться с рядом проблем такой способ, как альтернативное поведение.</p>\n<h2 id=\"f8\">8. Альтернативное поведение</h2>\n<p>Научили команде сидеть, хорошо поощряем ее выполнение, затем применяем, например когда собака прыгает. Конечно, обучение командам не решает проблемы со страхами и агрессией. Это способ управления поведением без запретов и негатива, разрушающего контакт.</p>\n<h2 id=\"f9\">9. Последовательность</h2>\n<p>Для собак очень важны четко установленные правила - если на кровать нельзя - значит, нельзя никогда; если еду со стола не даём - значит никто ничего не даёт и тд.</p>\n<h2 id=\"f10\">10. Три попытки</h2>\n<p>Если вы учите собаку чему-то чуть более сложному, чем команда Сидеть, и она не понимает - прекращаем после третьей неудачной попытки. Отдыхаем, упрощаем задачу, разбиваем обучение на этапы.</p>\n<blockquote>Если проблема, с которой вы столкнулись, слишком сложна, не стесняйтесь обращаться к специалистам по поведению собак. Знаний о собаках достаточно, чтобы решить любую, абсолютно любую проблему поведения, не используя при этом насильственные методы.</blockquote>\n<p>И обращаться к кинологу, если Вы не сумели справиться сами, так же естественно, как обращаться к любым другим специалистам по ремонту.</p>"
},
