"id": "kak-vybrat-misku",
"sec": "amuniciya",
"author": "shmakova",
"type": "Статья",
"img": "img/m/shm-178.webp",
"title": "Как правильно выбрать миску для собаки",
"lead": "Материал, высота, форма и место: миска влияет на положение тела, нагрузку на суставы и даже на пищевое поведение.",
"html": "<p>Для собаки миска это и про положение тела, нагрузку на суставы, удобство приёма пищи и даже про пищевое поведение.</p>\n<p>Разбираем по полочкам</p>\n<h2 id=\"t1\">Материал</h2>\n<ul><li>Пластик — самый плохой вариант. Со временем появляются царапины, в которых живут бактерии. У некоторых собак вызывает акне на мордочке</li><li>Керамика — тяжелая, не сильно скользит, легко моется. Но глазурь может содержать небезопасные красители, а при сколах трещины становятся рассадником бактерий.</li><li>Нержавейка — золотой стандарт. Не бьётся, не царапается, не впитывает запахи, моется в посудомойке, гигиенично. Из минусов: лёгкая, скользит.</li></ul>\n<p>Лично мой выбор - керамическая миска.</p>\n<h2 id=\"t2\">📏 Высота</h2>\n<p>Нет единой «правильной» высоты для всех. Всё зависит от породы собаки, привычек, состояния здоровья.</p>\n<h2 id=\"t3\">Миска на полу</h2>\n<p>Классический вариант. Подходит не всем собакам, в частности \"высокие\" собаки испытывают чаще дискомфорт при таком виде потребления пищи, а \"низким\" - удобно и это для них наилучший выбор.</p>\n<h2 id=\"t4\">Миска на подставке</h2>\n<p>Позволяет \"высоким\" собачкам сохранять спину ровной, шею слегка опущенной, локти — чуть согнутыми.</p>\n<p>Важно понимать, что все индивидуально! Высоту подставки важно выбирать не абы какую, а именно под вашего питомца. Об этом далее..</p>\n<h2 id=\"t5\">🔍 Как подобрать высоту под конкретную собаку</h2>\n<ul><li>Попробуйте уровни: середина предплечья, 2/3 предплечья, уровень локтя.</li><li>Смотрите на осанку во время еды — спина прямая, передние лапы без сильного сгиба.</li><li>Фотографируйте. Сравнивайте. Правда очень важно смотреть наглядно: где есть мышечные зажимы, где тело явно напрягается, а где максимально расслабленное</li><li>Важно: пол не должен быть скользким. Коврик под миски — хорошо, но если собака стоит на плитке, нагрузка на стабилизацию всё равно растёт. Некоторые собаки предпочитают есть с пола, даже если есть подставка. Это нормально. Ориентир — на конкретное животное.</li></ul>\n<p>И раз пошло такое дело, не могу не сказать про:</p>\n<h2 id=\"t6\">🧼 Гигиена</h2>\n<p>Мойте миски после каждого кормления горячей водой и средством для мытья посуды [ну или хотя бы раз в день]. Сухой корм оставляет жировую плёнку — она быстро окисляется.</p>\n<p>Чем чревато отсутствие гигиены:</p>\n<ul><li>Налёт из слюны и остатков корма — идеальная среда для бактерий</li><li>Регулярное попадание бактерий в миску → хронические расстройства ЖКТ, диарея, рвота</li><li>У собак со слабым иммунитетом или склонностью к аллергии — риск системных воспалений</li><li>Жировой налёт на миске из сухого корма провоцирует акне на подбородке и вокруг пасти</li></ul>\n<p>Раз в неделю — глубокая чистка и ошпаривание.</p>\n<p>Если собака не доедает сухой или влажный корм, надо убрать его через 15–20 минут, в ином случае есть риск того, что он испортится.</p>\n<p>Зависимость от рациона — важный момент</p>\n<h2 id=\"t7\">Сухой корм</h2>\n<p>Собакам приходится его «всасывать». Удобно закреплять миску на обобщённо оптимальном уровне (чуть ниже локтя для собак среднего формата). Это помогает избежать лишнего заглатывания воздуха и нагрузок на шею.</p>\n<h2 id=\"t8\">Мясо кусками</h2>\n<p>Собака почти наверняка вытащит кусок из миски и будет есть с \"земли\", периодически поднимая голову. Это естественно. Подставка здесь по сути теряет смысл — комфортный уровень собака создаст себе сама.</p>\n<p>Как итог: все очень индивидуально, но все же критерии выбора есть,  а значит есть и возможность сделать приём пищи собакена максимально комфортным!</p>\n<p>Всем хвостикам красивых, а главное удобных мисок!</p><p class=\"src\">Источник: канал «Пёсика: заметки зоопсихолога», <a href=\"https://t.me/psypesika/178\" target=\"_blank\" rel=\"noopener\">t.me/psypesika/178</a></p>"
},

"id": "ne-pishchevik",
"sec": "povedenie",
"author": "shmakova",
"type": "Статья",
"img": "img/m/shm-179.webp",
"title": "Моя собака не пищевик!",
"lead": "Малоежка: приговор или повод к глубокой диагностике? Почему собака не ест и что может мешать естественному желанию поесть.",
"html": "<p>Моя собака не пищевик!</p>\n<p>Часто можно услышать от владельцев, что питомец малоежка, корм из миски стоит сутками, а он не притрагивается.. И здесь от многих \"специалистов\" звучит вердикт: «у собакена просто низкая пищевая мотивация».</p>\n<p>Но давайте честно..и возможно, для кого-то шокирующе, но на физиологическом уровне не существует никакой пищевой мотивации. Есть норма пищевого поведения — и её нарушение. И именно с этим нам приходится работать.</p>\n<p>Главная ошибка  — относиться к отказу от еды как к капризу или невоспитанности.</p>\n<p>Правильный подход — диагностический, а не дрессировочный.</p>\n<p>Отказ от еды — это медицинский симптом, пока не доказано обратное!</p>\n<p>Прежде чем \"воспитывать интерес к корму\", исключите причины, которые могут вызывать у собаки боль или дискомфорт:</p>\n<ul><li>заболевания ЖКТ</li><li>хроническая боль</li><li>стоматологические проблемы</li><li>тошнота</li><li>негативная ассоциация еды с болью</li></ul>\n<p>Лечение основного заболевания часто само по себе возвращает аппетит. Игнорирование симптомов — путь к хронической проблеме.</p>\n<p>Если здоровье в порядке — проверьте среду и ритуал кормления. Тестируем по одному фактору за раз:</p>\n<ul><li>вкус / запах / текстура еды</li><li>материал, форма и устойчивость миски</li><li>нескользкий ли пол под миской</li><li>место кормления (не страшно ли или шумно)</li><li>высота миски (тестим от пола до уровня грудины)</li><li>присутствие людей или других животных</li><li>сам ритуал: убрать уговоры, пляски с бубном и лишнее внимание к пищевому поведению</li></ul>\n<h2 id=\"t1\">Временная норма или тревожный сигнал?</h2>\n<p>Снижение аппетита может быть условной нормой при:</p>\n<ul><li>жаре</li><li>половом влечении</li><li>приеме лекарств</li><li>реальном переедании</li></ul>\n<p>А так же снижение аппетита может быть вызвано:</p>\n<ul><li>хроническим или ситуационным стрессом</li><li>любым дискомфортом по здоровью (в том числе и вне жкт)</li><li>отсутствием безопасной среды</li></ul>\n<p>Чего точно НЕ стоит делать:</p>\n<ul><li>нарушать диету в поисках супервкусняшки</li><li>использовать голод как дрессировку</li><li>навязывать игру, если собаке не до игры</li><li>устраивать спектакль вокруг еды</li><li>считать отказ от еды упрямством</li><li>требовать команды за кусок, когда собаке физически плохо</li></ul>\n<h2 id=\"t2\">Что радует: еда — не единственная валюта общения</h2>\n<p>Хороший вопрос звучит не «чем наградить?», а «что сейчас для этой собаки действительно ценно?»</p>\n<p>Виды мотивационного подкрепления:</p>\n<ul><li>пищевая (быстрая, но недоступна при диетах и тошноте)</li><li>игровая (энергичная, но может перевозбуждать)</li><li>социальная (доступна всегда, но ценна не для всех)</li><li>средовая (запахи, прогулка, маршрут)</li><li>функциональная (доступ, дистанция, облегчение, контроль)</li></ul>\n<p>Развивать отклик питомца на непищевое подкрепление — это навык. И работа не одного дня. Поэтому если не получается сразу - это не значит, что что-то с вами не так.</p>\n<p>Итак, если собака не ест — сначала к врачу (начать с гастроэнтеролога/диетолога), потом к специалисту по поведению. Помните, что хороший кинолог и так направит за обследованием к ветеринару, поэтому лучше сделать это заранее. Задача — не «заставить хотеть есть», а понять, что мешает этому естественному желанию. Берегите своих хвостиков</p><p class=\"src\">Источник: канал «Пёсика: заметки зоопсихолога», <a href=\"https://t.me/psypesika/179\" target=\"_blank\" rel=\"noopener\">t.me/psypesika/179</a></p>"
},

"id": "sobaka-pylesos",
"sec": "povedenie",
"author": "shmakova",
"type": "Статья",
"img": "img/m/shm-180.webp",
"title": "Моя собака пылесос!",
"lead": "Полифагия, или повышенный аппетит, такой же симптом, как отказ от еды. Где искать причину: в теле или в голове.",
"html": "<p>Моя собака пылесос!</p>\n<p>Как легко догадаться: это тоже нарушение пищевого поведения.</p>\n<p>Полифагия (повышенный аппетит) — это такой же симптом, как и отказ от еды. И у него всегда есть причина. Либо в теле, либо в голове. Чаще — и там, и там.</p>\n<h2 id=\"t1\">Что такое полифагия?</h2>\n<p>Это далеко не «хороший аппетит», скорее ненасытное, постоянное чувство голода, которое не проходит даже после еды. Собака выпрашивает, скулит, обыскивает всё вокруг, иногда даже ест несъедобное (землю, фекалии, камни) — и всё равно остаётся голодной.</p>\n<p>И прежде чем списывать это на поведенческие нюансы и работать с неподбором, например, — нужно проверить здоровье (физическое и психическое).</p>\n<h2 id=\"t2\">🩺 Шаг 1. Исключаем соматику (телесные болезни)</h2>\n<p>В первую очередь рассматриваем рацион с гастроэнтерологом и ветдиетологом. Во-вторую, исключаем болячки.</p>\n<p>Полифагия — частый симптом конкретных заболеваний. Особенно если к ней добавляется что-то ещё:</p>\n<ul><li>повышенная жажда и частое мочеиспускание</li><li>рвота или диарея после еды</li><li>⚖️ набор или потеря веса при том же рационе</li><li>«растущее пузо» на фоне худых спины и таза</li><li>поедание несъедобного (пикацизм)</li></ul>\n<p>Какие болезни проверять в первую очередь:</p>\n<ul><li>Сахарный диабет</li><li>Болезнь Кушинга</li><li>Эндокринная недостаточность поджелудочной</li><li>Гипогликемия</li><li>Воспалительные болезни кишечника, паразиты</li><li>Онкология (редко, но бывает и такое)</li><li>Побочное действие лекарств (например, кортикостероиды)</li></ul>\n<p>Минимум диагностики:</p>\n<p>ОАК, биохимия (глюкоза, холестерин, печёночные ферменты), общий анализ мочи, Т4 общий, кортизол, УЗИ брюшной полости</p>\n<p>Если анализы в норме — переходим к поведению.</p>\n<h2 id=\"t3\">Шаг 2. Психогенная полифагия — когда еда заменяет расслабление</h2>\n<p>Это эмоциональное «заедание» стресса. Механизм такой же, как у людей, которые тянутся к холодильнику в тревоге. Со временем это становится единственной доступной стратегией саморегуляции, особенно у животных в обеднённой среде, где еда — единственный источник положительных эмоций.</p>\n<p>Породы в зоне риска:</p>\n<p>Лабрадоры, ретриверы, бигли (генетически высокая мотивация поиска пищи + склонность к таким паттернам).</p>\n<h2 id=\"t4\">Чего делать НЕ стоит</h2>\n<ul><li>Умиляться и докармливать</li><li>Сажать на жёсткую диету без работы с эмоциями (это усилит фрустрацию и пищевую \"озабоченность\")</li><li>Считать попрошайничество только дрессировочной проблемой</li><li>Надеяться, что само пройдёт</li></ul>\n<h2 id=\"t5\">Шаг 3. Коррекция</h2>\n<p>Если с лечением соматических заболеваний всё понятно, то вот лечение психогенной полифагии — это разрыв порочного круга «стресс → еда → временное облегчение». Нельзя просто убрать миску. Нужно предложить альтернативу.</p>\n<p>Диетологическая стратегия:</p>\n<ul><li>Составить грамотный рацион вместе с ветдиетологом, в некоторых случаях увеличивают кол-во кормлений, чтобы собаке было проще.</li></ul>\n<p>Реформатирование способа кормления:</p>\n<ul><li>Медленное кормление — специальные миски</li><li>Лизательные коврики — вылизывание стимулирует блуждающий нерв и успокаивает</li><li>Разнообразие форм — миска, коврик, нюхательные прибамбасы</li></ul>\n<p>Обогащение среды (без этого ничего не работает!):</p>\n<ul><li>Регулярные ритуалы и предсказуемость</li><li>Прогулки с поиском</li><li>Обучение трюкам и играм</li></ul>\n<p>Модификация ритуалов:</p>\n<ul><li>Разорвать связь между стрессом и едой</li><li>Не подкреплять попрошайничество, вызванное тревогой. Находить альтернативу</li><li>Протоколы расслабления</li></ul>\n<p>В некоторых случаях:</p>\n<p>Требуется подключение врача поведенческой медицины и, возможно, фармподдержка.</p>\n<p>Берегите своих пылесосиков и всегда смотрите глубже, ведь поведение - это только верхушка айсберга</p><p class=\"src\">Источник: канал «Пёсика: заметки зоопсихолога», <a href=\"https://t.me/psypesika/180\" target=\"_blank\" rel=\"noopener\">t.me/psypesika/180</a></p>"
},

"id": "aysberg-povedeniya",
"sec": "povedenie",
"author": "shmakova",
"type": "Статья",
"img": "img/m/shm-182.webp",
"title": "Айсберг поведения собаки",
"lead": "Лай, грызение, тянет поводок, рычит: почему поведение только верхушка айсберга и что скрыто под водой.",
"html": "<figure><img src=\"img/m/shm-182.webp\" alt=\"\" loading=\"lazy\"></figure>\n<p>Хочу, чтобы собака перестала лаять / грызть / тянуть / рычать</p>\n<p>И я понимаю это желание, искренне и честно! Но вот в чём дело: поведение — это лишь верхушка айсберга.</p>\n<p>Когда мы реагируем только на видимое поведение, мы упускаем из виду скрытую часть — а именно она содержит всю ценную информацию о том, почему собака делает то, что делает (как бы это ни звучало)</p>\n<p>Давайте нырнём под воду и посмотрим, что же там скрывается!</p>\n<h2 id=\"t1\">1. ПОВЕДЕНИЕ</h2>\n<p>Лай, агрессия, порча вещей, апатия, тянущийся поводок. Это сигнал из внутреннего мира собаки. По сути это не проблема сама по себе, как кажется сначала, а подсказка. Собака не делает назло, она делает то, что может, исходя из того, что у неё есть внутри. Именно поэтому всякие штуки по типу напугать собаку в моменте, отругать и прочие - не работают! Поведение — своего рода способ справиться с ситуацией прямо сейчас. Чтобы коррекция сработала не на сутки, а пролонгированно, важно учитывать то, что скрывается за поведением</p>\n<h2 id=\"t2\">2. ПРОЦЕСС ПРИНЯТИЯ РЕШЕНИЙ</h2>\n<p>В каждой ситуации собака мгновенно оценивает: а что я могу сделать прямо сейчас? Она выбирает из доступных ей стратегий. Этот выбор зависит от прошлого опыта, навыков и текущего состояния нервной системы. Если собака умеет только лаять, чтобы сбросить напряжение — она будет лаять. Не потому что вреднючка или злая, а потому что других инструментов у неё попросту и нет в арсенале.</p>\n<h2 id=\"t3\">3. ЭМОЦИИ И МОТИВАЦИИ</h2>\n<p>За каждым решением стоят эмоции: страх, тревога, фрустрация, скука, интерес, радость, отвращение. Эмоции запускают мотивацию: хочу избавиться от этого или хочу получить это. Мотивация направляет выбор поведения.</p>\n<p>Собака, которая грызёт диван - снимает тревогу. Собака, которая лает на гостей, может быть вовсе и не агрессивна,  а пытается увеличить дистанцию от источника страха.</p>\n<h2 id=\"t4\">4. ПОТРЕБНОСТИ</h2>\n<p>Это корень всего. Безопасность и предсказуемость среды, социальный контакт, физическая активность, возможность исследовать мир через нос, отдых. Неудовлетворённая потребность — эмоция — мотивация — решение — поведение. Цепочка всегда начинается здесь. Замечали, что после запрета одного поведения появлялось другое? Это значит, что потребность осталась неудовлетворённой — и собака просто сменила стратегию.</p>\n<p>Если потребность удовлетворяется через поведение (грызть приятно = стресс уходит) — поведение закрепляется. Если нет — собака найдёт другой способ. Запрет одного поведения без работы с потребностью = появление нового проблемного поведения.</p>\n<h2 id=\"t5\">5. ИНДИВИДУАЛЬНЫЕ ОСОБЕННОСТИ</h2>\n<p>Самый глубокий уровень, который определяет всё остальное:</p>\n<ul><li>Генетика и порода — одни собаки от природы более реактивны, другие более устойчивы</li><li>Состояние нервной системы: насколько собака способна справляться со стрессом, переключаться, адаптироваться</li><li>Прошлый опыт — травмы, социализация, история обучения формируют картину мира собаки</li><li>Текущая ситуация — погодные условия, состояние владельца, средовые факторы</li><li>Физиология и здоровье — боль, гормональный дисбаланс, дефициты меняют восприятие реальности</li><li>Темперамент — чувствительность, скорость реакции, порог возбуждения</li></ul>\n<p>Две собаки в одинаковой ситуации могут вести себя совершенно по-разному — не потому что одна хорошая, а другая плохая, а потому что у них разный фундамент.</p>\n<h2 id=\"t6\">ЧТО ЭТО ЗНАЧИТ НА ПРАКТИКЕ?</h2>\n<p>Подумайте, что это поведение сообщает мне о внутреннем мире моей собаки прямо сейчас? Именно такой вопрос поможет реально решить проблему. Что еще важно сделать:</p>\n<p>Укрепите платформу — помогите собаке чувствовать себя в безопасности</p>\n<h2 id=\"t7\">Удовлетворите потребность безопасным способом</h2>\n<h2 id=\"t8\">Дайте новые инструменты (навыки) для принятия решений</h2>\n<p>Учитывайте индивидуальность — не существует универсального подхода</p>\n<p>В целом это ответ на вопрос, почему волшебной таблетки не бывает. В коррекции поведения мы учимся понимать язык собаки и помогаем ей найти лучший способ жить в нашем мире</p><p class=\"src\">Источник: канал «Пёсика: заметки зоопсихолога», <a href=\"https://t.me/psypesika/182\" target=\"_blank\" rel=\"noopener\">t.me/psypesika/182</a></p>"

"id": "kommunikaciya-sobak",
"sec": "povedenie",
"author": "shmakova",
"type": "Статья",
"img": "img/m/shm-183.webp",
"title": "О коммуникации собак",
"lead": "Визуальные, звуковые и запаховые сигналы: как собаки общаются на дистанции и почему отказ от приветствия тоже общение.",
"html": "<p>Думаете, собаки общаются только через прямой контакт? А вот и нет!</p>\n<p>Их коммуникативный репертуар включает ещё и визуальные, акустические и ольфакторные сигналы, причём многие из них работают на дистанции и остаются незамеченными для невооружённого глаза, ведь мы привыкли ждать очевидного: лая, прыжков или возни.</p>\n<p>На этот пост меня натолкнул вопрос клиентки:</p>\n<p>После года моя собака перестала общаться с сородичами, даже практически не нюхает, проходит мимо. Это нормально или надо работать с социализацией?</p>\n<p>Давайте разбираться, как же наши собаки коммуницируют с сородичами:</p>\n<p>Запахи — метки это полноценный химический дневник, ведь феромоны, выделяемые с мочой, фекалиями и секретами желёз (те самые параанальные железы), позволяют передавать информацию о поле, репродуктивном статусе и эмоциональном состоянии без прямого контакта. Недавние исследования показали, что собаки различают эмоциональные запахи сородичей, связанные с радостью и стрессом, и демонстрируют специфические поведенческие реакции в зависимости от их содержания. Причём уровень дофамина и норадреналина в моче влияет на тип меток, + маркировка на расстоянии более двух метров от источника ассоциируется с более высокими показателями дофамина. Вот так вот там все интересно!</p>\n<p>Взгляд, визуал — главный дипломатический инструмент. У взрослых собак пристальный взгляд может служить сигналом вызова или просьбы, отведённые глаза и моргание, напротив, означают мирные намерения. Язык тела тоже в свою очередь решает очень многое, собака на дистанции уже способна показать: хочет она общения или нет. Этот немой диалог разворачивается за доли секунды, позволяя животным решать, сближаться или расходиться, даже не приближаясь друг к другу.</p>\n<p>Вокализация — это не только лай, ведь домашние собаки используют обширный набор звуков, включая вой, рычание, скулёж и множество других (взять, например, бассенджи, там далеко не привычные нашим ушам звуки собаки). При этом, в отличие от волков, которые вокализируют в основном только при угрозе или для сближения, собаки реагируют на самые разные триггеры, а их лай имеет разную высоту и ритм в зависимости от контекста. Причём вой служит для коммуникации на дальние расстояния, тогда как лай обычно направлен на конкретную цель.</p>\n<p>Надеюсь, теперь стало чуточку яснее, как именно коммуницируют собаки. Они делают это постоянно(!), даже если вблизи нет вообще никого. И, конечно, исходя из всего этого, на прогулке не торопитесь подтаскивать пса к сородичам, а позвольте ему сначала обменяться дистанционными сигналами: посмотреть, принюхаться, прислушаться, — и если он отвернулся и ушёл, он уже всё сказал, и не стоит заставлять его поздороваться, когда он выбрал молчание, ведь это и есть в том числе настоящее общение!</p>\n<p>Всем приятных летних коммуникаций!</p><p class=\"src\">Источник: канал «Пёсика: заметки зоопсихолога», <a href=\"https://t.me/psypesika/183\" target=\"_blank\" rel=\"noopener\">t.me/psypesika/183</a></p>"
},

"id": "bol-upravlyaet-povedeniem",
"sec": "povedenie",
"author": "shmakova",
"type": "Статья",
"img": "img/m/shm-185.webp",
"title": "Как боль управляет поведением собаки",
"lead": "Первая часть серии о боли: почему мы пропускаем дискомфорт в теле и как он проявляется в поведении.",
"html": "<p>Как дискомфорт в теле управляет поведением вашей собаки и почему мы, люди, часто пропускаем этот сигнал</p>\n<p>Ответ прост: мы привыкли думать, что боль у собаки это что-то явное: хромота, скулеж или отказ от еды. Потому что раньше, ну как-то не принято было \"таскать в ветеринарку по каждой фигне\". Однако доказательная ветеринарная медицина последних лет, опираясь на масштабные выборки в исследованиях, говорит об обратном: в 87% случаев хронического болевого синдрома первыми симптомами становятся не физические маркеры, а поведенческие изменения, которые владельцы списывают на вредность, упрямство или возрастные странности. Можете себе представить?</p>\n<p>Собака, которая внезапно перестала оставаться дома одна, которая раздраженно щелкает зубами, когда вы пытаетесь ее причесать, или которая с агрессией общается с сородичами, вероятнее всего уже давно живет в состоянии компенсированного дискомфорта, где мозг ежесекундно тратит колоссальные ресурсы на подавление болевого сигнала, а не на обучение и взаимодействие с вами.</p>\n<p>И здесь, на стыке психологии человека и зоопсихологии, кроется главная ловушка: мы, владельцы, неосознанно проецируем на собак свою модель поведения, мы сами привыкли терпеть боль , заглушая ее быстрым дофамином, таблетками или работой, и бессознательно ждем от питомца той же терпеливости, даже не догадываясь, что его отказ от команды может быть криком о помощи, который он не может озвучить иначе как через избегание. О чем я: часто, даже при выявленном деструктиве или проблемах со здоровьем, мы требуем от собак многого. Но реально наша задача как ответственных владельцев — научиться читать язык тела раньше, чем рентген покажет артроз, потому что на уровне психики разрушения начинаются за полгода (!) до уже сильно явных и в какой-то степени \"критических\" физических проявлений.</p>\n<p>Исследование Malkani и коллег (2024), проведенное с Animal Welfare Assessment Grid на 46 собаках с хронической болью и 143 здоровых собаках, показало: все психологические факторы — страхи, тревожность, реакции на стресс, социальные взаимодействия и вовлеченность в сенсорное обогащение среды — были значимо хуже у собак с хронической болью, в то время как физические признаки (изменения походки, скованность, хромота) проявлялись уже после поведенческих изменений. То есть собака сначала становится тревожной, замкнутой и раздражительной — и только потом начинает прихрамывать (далее перевод с исследования):</p>\n<p>типичные признаки заболеваний опорно-двигательного аппарата, такие как изменения походки, скованность движений, хромота, могут проявляться после изменений в поведении, таких как повышенная пугливость, затянувшееся восстановление после стрессового события, снижение интереса к социальному взаимодействию, игрушкам или играм с сородичами. Обращение владельцев к ветеринару только при наличии явных физических признаков заболевания может привести к задержке обращения и, как следствие, к ухудшению благополучия животного</p>\n<p>Немного из моей практики: практически каждая 3я взрослая собака с проблемным поведением - это собака с болями того или иного характера (чаще всего жкт, ода). Выводы можно сделать самостоятельно</p><p class=\"src\">Источник: канал «Пёсика: заметки зоопсихолога», <a href=\"https://t.me/psypesika/185\" target=\"_blank\" rel=\"noopener\">t.me/psypesika/185</a></p>"
},

"id": "pochemu-pryachut-bol",
"sec": "povedenie",
"author": "shmakova",
"type": "Статья",
"img": "img/m/shm-186.webp",
"title": "Почему собаки прячут боль",
"lead": "Эволюционный механизм, из-за которого собака скрывает боль до последнего, и на что смотреть владельцу.",
"html": "<p>Почему собака прячет боль до последнего и как этот эволюционный механизм резонирует с нашей собственной привычкой носить маску благополучия?</p>\n<p>В дикой природе, которую мы так часто любим идеализировать, не существовало понятия ветклиник — больное животное автоматически становилось мишенью для хищников, и сородичи, повинуясь жесткому закону выживания, скорее отгоняли его от стаи, чем поддерживали, потому что ослабленный член группы привлекал опасность и ставил под угрозу существование всех остальных</p>\n<p>Именно этот глубинный, прописанный в генах на протяжении миллионов лет эволюционный сценарий заставляет вашу собаку, даже оказавшись в безопасной квартире с миской корма и любящим хозяином, скрывать болевые ощущения с таким упорством, что владельцы часто узнают о серьезных патологиях только тогда, когда боль становится уже запредельной и маскировка невозможна.</p>\n<p>Но вот о чём я подумала, самое для меня интересное заключается в том, что мы, люди, демонстрируем абсолютно ту же модель поведения, когда приходим на работу с температурой, или когда мы рассказываем друзьям, что у нас всё прекрасно, в то время как внутри нас разрывает тревога.. Примерно та же история, наш \"древний\" мозг до сих пор убежден, что признание слабости приведет к социальному исключению, а социальное исключение чревато последствиями. Вот этот общий знаменатель между вами и вашей собакой является тем самым мостиком, который при должном понимании соединяет вас в здоровую эмпатичную связь!</p>\n<h2 id=\"t1\">Как же заприметить боль?</h2>\n<p>На самом деле здесь важно только одно: наблюдательность. Отслеживать поведение питомца, при резких изменениях чаще всего мы можем подозревать боль. А о конкретных признаках - поговорим в следующем посте</p><p class=\"src\">Источник: канал «Пёсика: заметки зоопсихолога», <a href=\"https://t.me/psypesika/186\" target=\"_blank\" rel=\"noopener\">t.me/psypesika/186</a></p>"
},

"img": "img/m/shm-191.webp",
"title": "Как распознать боль у собаки",
"lead": "Тонкие, скрытые признаки дискомфорта, которые владельцы чаще всего не замечают. Памятка, которую стоит сохранить.",
"html": "<p>Исследования показывают, что владельцы обычно замечают достаточно громкие и явные сигналы, например, хромоту или скулеж,  тогда как тонкие, скрытые признаки дискомфорта зачастую остаются незамеченными, хотя именно они могут быть первыми звоночками о том, что с питомцем что-то не так.</p>\n<p>Как же понять, что у собаки, возможно, есть болевой дискомфорт?</p>\n<p>Выделим два больших блока показателей: поведенческие маркеры и физические признаки. Ниже — памятка, по которой вы можете ориентироваться. Однако важно, что проявление боли это индивидуальный процесс(!). Если вам кажется, что с собакой что-то не так - важно это проверить.</p>\n<p>Поведенческие маркеры боли:</p>\n<ul><li>Изменение отношения к обеденным вещами: амуниция, одежда, вещи бытового пользования (лежанка, миски)</li><li>Изменение отношения к ритуалам: например, к мытью</li><li>Изменение активности и настроения. Снижение подвижности, нежелание играть, трудности при подъеме по лестнице или спуске с нее; при этом возможна и противоположная реакция — беспокойство, неспособность найти место, метание по дому.</li><li>Социальное поведение. Собака может стать замкнутой, уединяться, отворачиваться, когда вы ее зовете, перестать взаимодействовать с хозяином или, наоборот, требовать к себе больше внимания; нередко появляется раздражительность или агрессия при попытке взять питомца на руки или погладить.</li><li>Вокализация и стресс-маркеры. Скулеж, вой, рычание; частая зевота (не связанная с усталостью), облизывание губ, прижатые уши, отведенный взгляд.</li><li>Изменение пищевого поведения. Отказ от еды и воды или, напротив, поедание несъедобных предметов, полифагия.</li><li>Навязчивое внимание к телу. Собака может вылизывать, грызть или покусывать определенные участки — например, лапы, бок или хвост.</li></ul>\n<p>Физические и физиологические маркеры:</p>\n<ul><li>Изменение позы и походки. Сгорбленная спина, опущенный между лап хвост на постоянной основе, необычная поза при стоянии или лежании — например, поза молящейся собаки (собака стоит, вытянув лапы вперед и наклонив голову) может указывать на боль в животе; прихрамывание, скованность движений, трудности с подъемом.</li><li>Изменение дыхания, одышка Учащенное или затрудненное дыхание.</li><li>Дрожь. Питомец может дрожать, даже если ему не холодно.</li><li>Внешние повреждения. Раны, ссадины, проблемы с ушами, глазами или пастью — их сложно не заметить даже невооруженным взглядом, но не уточнить нельзя.</li></ul>\n<p>Если вы заметили один или несколько из перечисленных признаков, не откладывайте визит к ветеринарному врачу - только специалист сможет определить истинную причину дискомфорта и подобрать правильное лечение!</p>\n<p>Что для одного норма - для другой собаки может быть критичное состояние. Помните об этом! Наблюдательность - главный фактор успеха.</p>\n<p>Для более системной оценки боли существуют специальные шкалы, которые помогут вам и вашему ветеринару объективно оценить состояние питомца:</p>\n<ul><li>Глазговская составная шкала боли (GCPS / CMPS-SF) — используется для оценки острой боли у собак.</li><li>Хельсинский индекс хронической боли (HCPI) — опросник для владельцев, предназначенный для оценки хронической боли, например при остеоартрите. Он основан на изменениях поведения и настроения собаки.</li></ul>\n<p>Сохраните эту памятку! Она поможет вам вовремя заметить даже самые тонкие сигналы вашего питомца и своевременно обратиться за помощью</p><p class=\"src\">Источник: канал «Пёсика: заметки зоопсихолога», <a href=\"https://t.me/psypesika/191\" target=\"_blank\" rel=\"noopener\">t.me/psypesika/191</a></p>"
},

"id": "sovmestnyy-son",
"sec": "adaptaciya",
"author": "shmakova",
"type": "Статья",
"img": "img/m/shm-195.webp",
"title": "Совместный сон с собакой",
"lead": "Спать ли со щенком в одной кровати: откуда желание быть рядом, плюсы, минусы и как выбрать свой вариант.",
"html": "<h2 id=\"t1\">Польза совместного сна</h2>\n<p>♡ Огромный плюс совместного сна — психологический комфорт и снижение тревожности у обоих. Исследования подтверждают, что общение с собаками снижает кровяное давление и уровень стресса. Атмосфера безопасности и близости перед сном помогает снизить ночное когнитивное возбуждение, что теоретически способствует лучшему засыпанию.</p>\n<p>Многие владельцы спят с собаками именно ради этого чувства защищённости. В опросах люди субъективно сообщают, что их сон улучшается. Для людей с тревожностью или ПТСР присутствие собаки может быть настоящим спасением.</p>\n<p>Минусы совместного сна кроются в возможном снижении его качества.</p>\n<p>Крупное исследование 2024 года с участием 1591 человека показало: совместный сон с питомцами связан с ухудшением воспринимаемого качества сна и большей тяжестью бессонницы. Причём этот негативный эффект был связан именно с владельцами собак (а не кошек).</p>\n<h2 id=\"t2\">Почему так происходит?</h2>\n<p>Исследование с актиграфией (объективным отслеживанием движений) показало, что собаки влияют на наши движения во сне больше, чем мы на их. Движение собаки утраивало вероятность того, что человек перейдёт из состояния покоя в движение, при этом сами владельцы редко осознавали, что их разбудил питомец. Более того, качество сна человека было ниже, если собака спала на кровати, а не просто в комнате. Эффективность сна человека была выше, а невысыпаемость ниже, когда собака находилась в спальне, но не в кровати. Если собака на кровати — эффективность сна падает примерно до 80%, что означает потерю около 14 минут сна за ночь. Казалось бы, мелочь, но из таких мелочей бывает и складывается хронический недосып.</p>\n<h2 id=\"t3\">🛌 Так что же выбрать?</h2>\n<p>Ответ зависит только от вас и вашей собаки. Если вы оба высыпаетесь, никто никому не мешает, настроение и самочувствие отличное — продолжайте спать вместе! Это классно, видотипично и снижает уровень тревоги! Научные данные подтверждают: главное — это комфорт и безопасность.</p>\n<p>Но если вы замечаете, что:</p>\n<ul><li>постоянно просыпаетесь ночью;</li><li>чувствуете разбитость утром;</li><li>собака ворочается от ваших движений и тоже не высыпается;</li><li>лучше выбрать раздельный сон ночью. Хронический недосып портит эмоциональное состояние, снижает продуктивность и вредит здоровью. Сон — это основа всего, и иногда лучший способ заботы о питомце — это забота о собственном здоровье и бодрости.</li></ul><p class=\"src\">Источник: канал «Пёсика: заметки зоопсихолога», <a href=\"https://t.me/psypesika/195\" target=\"_blank\" rel=\"noopener\">t.me/psypesika/195</a></p>"
},

"id": "lezhanka",
"sec": "amuniciya",
"author": "shmakova",
"type": "Серия",
"img": "",
"title": "Лежанка: какую выбрать и где поставить",
"lead": "Типы лежанок под разных собак и четыре правила, где расположить место отдыха.",
"html": "<p>Не секрет, что каждая собака — уникальна. То, что обожает один пёпс, другому может совершенно не подойти, и дело не только в форме или наполнителе, но и в том, где эта лежанка стоит. Сегодня разберём типы лежаков и как сделать место для отдыха по-настоящему комфортным и безопасным. В один пост не влезло, так что читаем сразу 2</p>\n<p>Какие лежанки вообще бывают и кому они подходят</p>\n<h2 id=\"t1\">Лежанки-норки</h2>\n<p>Таксы просто фанатеют от них. Это обусловлено инстинктом, зарыться, спрятаться, чувствовать себя в полной безопасности. Отличный вариант для тревожных собак и тех, кто любит уединение. Вот правда. Просто попробуйте!</p>\n<h2 id=\"t2\">Лежанки-убежища</h2>\n<p>Это уже не просто лежанка, а целый личный бункер. Сверху крыша, боковые стенки — собака чувствует себя как в норе, но при этом пространства побольше. Построить можно самостоятельно, вспоминаем детские \"шалашики\" из одеял. Идеально для пугливых собак, для тех, кто боится громких звуков (всем шумофобушкам привет), или просто для любителей поспать в темноте.</p>\n<h2 id=\"t3\">Ортопедические лежанки</h2>\n<p>С жёстким, но упругим матрасом. Рекомендованы собакам с больными суставами (артрит, дисплазия). Исследования подтверждают: такая поверхность реально является более предпочтительной для старичков, 80% пожилых собак выбирали именно их, так что порой это не роскошь, а необходимость для возрастных питомцев.</p>\n<h2 id=\"t4\">☁️ Мягкие пухлые лежанки</h2>\n<p>Идеальны для здоровых молодых собак, которые любят утопать в облачке. Научные наблюдения показали: собаки явно предпочитают мягкое жёсткому и проводят на таких лежанках до 83% времени сна!! Что неудивительно, в целом..</p>\n<h2 id=\"t5\">🛡 Антивандальные лежанки</h2>\n<p>Из очень прочной ткани, часто более жёсткие. Спасение, если ваша собака любит копать лежанку. Для копателей, кстати, в целом на любую лежанку можно добавлять пледы, поверьте, это позволит собаке намного быстрее \"заютиться\" и расслабиться.</p>\n<h2 id=\"t6\">С высоким бортиком</h2>\n<p>Позволяют упереться головой или спиной. Это особенно удобно для собак с проблемами ода или для тех, кто любит опираться на что-то твёрдое.</p>\n<p>На возвышенности (диванчики, высокие матрасы)</p>\n<p>Некоторые собаки любят спать повыше, чтобы видеть всё, что происходит вокруг. И знаете, ваш обычный диван — это уже отличная лежанка на возвышенности! Главное, чтобы собаке было легко запрыгивать и спрыгивать — подстелите коврик или приставьте лесенку.</p>\n<p>Помимо этого лежанки бывают разной формы: круглые, овальные, прямоугольные. В общем, на любой собачий вкус! Но часто это не влияет так сильно как факторы, описанные выше.</p>\n<p>Про щенков: до полугода не торопитесь. До 6 месяцев щенки могут путать лежанку с пелёнкой — это нормально, режим выгула ещё не стабилен. Не покупайте дорогую лежанку раньше времени. После полугода — смело выбирайте вариант на вырост.</p>\n<h2 id=\"t7\">Выбор важен</h2>\n<p>В идеале у вашего питомца должны быть доступны разные варианты места сна:</p>\n<ul><li>мягкая лежанка;</li><li>твёрдая поверхность;</li><li>укрытие;</li><li>возвышенность</li></ul>\n<p>Собакам видотипично мигрировать во сне, когда есть выбор куда можно перелечь — качество жизни значительно увеличивается.</p>\n<p>И главное: большинство этих вариантов можно сделать из подручных средств! Твердой поверхностью может выступать просто пол, возвышенностью - старый матрас, мягкой - свёрнутое одеяло, укрытием - плед под столом, всё это может стать по сути лежанкой. Не обязательно тратить огромные деньги, ведь важно внимание к потребностям собаки, а не цена аксессуара.</p><h2 id=\"t1\">Где расположить лежанку? 4 важных правила</h2>\n<p>Место отдыха — может успокаивать или, наоборот, постоянно тревожить, особенно если у собаки есть страхи или повышенная чувствительность.</p>\n<h2 id=\"t2\">Свет</h2>\n<p>Резкий, яркий свет, от которого некуда деться — это стресс. Что делать: обеспечьте затенённый уголок, шторы, жалюзи или просто место в тени. Летом так же помним о прохладе (!)</p>\n<h2 id=\"t3\">Пол</h2>\n<p>Скользкий ламинат или плитка — это всегда риск. Собака напрягается, поскальзывается, а если лежанка ещё и ездит постоянно.. Что делать: постелите ковры, дорожки, специальные нескользящие покрытия. Можно даже обработать пол специальным составом (как в спортзалах), чтобы он стал менее скользким.</p>\n<h2 id=\"t4\">Пространство</h2>\n<p>Когда негде спрятаться, собака всегда на взводе, ей нужно укрытие, чтобы выключиться и по-настоящему расслабиться. Что делать: поставьте лежанку под стол, в угол, за кресло. Собака не обязана быть у вас на виду постоянно. Так же важно помнить, что дополнительно мы уберегаем собаку от лишних шумов: не ставим лежанку у розеток, электроприборов.</p>\n<p>Но есть нюанс: если у собаки тревога разлуки, лежанка у входной двери наоборот помогает ей заземлиться и спокойно ждать вашего возвращения. Опять приходим к тому, что все индивидуально!</p>\n<h2 id=\"t5\">Запахи</h2>\n<p>Нюх у собак — главное чувство. Резкие химические запахи (духи, аэрозоли, дым, моющие средства) могут вызывать тревогу без видимой причины. Что делать: уберите подальше от лежанки всё сильно пахнущее.</p>\n<p>Итак, наблюдайте за своей собакой, она сама подскажет, что ей нравится. Ваша задача — предложить разные варианты (и по типам лежанок, и по местам), сделать среду безопасной и предсказуемой. Первое время приучения к лежанке можно посидеть рядом, погладить, порасслаблять собаку. Важно помнить, что это вовсе не прихоть, а реальная потребность, основанная на природе собак и подтверждённая наукой!</p>\n<p>Если из подручных средств вы можете соорудить уютное убежище — прекрасно! Если диван стал любимым местом — замечательно! Главное, чтобы собака чувствовала себя в безопасности и высыпалась</p><p class=\"src\">Источник: канал «Пёсика: заметки зоопсихолога», <a href=\"https://t.me/psypesika/196\" target=\"_blank\" rel=\"noopener\">t.me/psypesika/196</a></p>",
"also": [
"adaptaciya"
]

"id": "neuverennost",

"title": "Неуверенность у собак",
"lead": "Из чего складывается неуверенность, что в ней можно изменить через среду и наше поведение и как на неё влияет здоровье.",
"html": "\n<h2 id=\"n0\">Часть 1</h2>\n<p>Неуверенность — не единичный дефект характера и не результат одного неудачного дня, а сложный многокомпонентный конструкт, складывающийся из генетической предрасположенности, пренатального опыта, условий раннего развития и, что самое важное для нас, текущей среды обитания и стиля взаимодействия с владельцем. Понимание природы этой неуверенности критически важно, поскольку она напрямую определяет качество жизни питомца и его способность адаптироваться к постоянно меняющимся условиям внешнего мира.</p>\n<p>Прежде чем говорить о воспитании, важно признать, что часть предпосылок к неуверенности закладывается задолго до того, как щенок попадает в наш дом, и эти факторы находятся вне зоны нашего контроля.</p>\n<p>Давайте разберем ключевые моменты:</p>\n<p>Некоторые собаки рождаются с более чувствительной нервной системой, которая реагирует на стрессоры быстрее и дольше восстанавливается после их воздействия, и это не является патологией, а представляет собой один из допустимых вариантов нормы, сформированный в ходе селекции. Например, рабочие линии пастушьих и служебных пород исторически отбирались за скорость реакции и высокий уровень возбудимости, и побочным эффектом такой селекции стала повышенная реактивность гипоталамо-гипофизарно-надпочечниковой оси, что делает этих собак более чувствительными к стрессу, чем их собратья из выставочных или диванных линий.</p>\n<p>Однако генетика — это лишь стартовая точка, а не приговор, и хотя мы не можем изменить тип нервной системы, мы обязаны учитывать его при выстраивании режима и нагрузок, чтобы не провоцировать хроническое перенапряжение.</p>\n<p>Если сука во время беременности подвергалась хроническому стрессу — будь то плохие условия содержания, нехватка ресурсов или постоянный страх — её повышенный уровень кортизола напрямую влиял на формирование стрессовой системы плодов. Исследования показывают, что у таких щенков гипоталамо-гипофизарно-надпочечниковая ось изначально настраивается на режим повышенной боевой готовности: они рождаются более пугливыми, хуже переносят новизну и дольше восстанавливаются после незначительных потрясений. Мы не можем отменить этот пренатальный опыт, однако можем компенсировать его, создавая максимально предсказуемую и безопасную среду на протяжении всей последующей жизни собаки.</p>\n<p>Наиболее интенсивно мозг формирует нейронные связи, определяющие отношение к миру, в так называемый критический период социализации, который длится примерно с третьей по двенадцатую неделю жизни, и именно в это время закладывается фундаментальное доверие к окружающей среде. Если в этот период щенок сталкивается с хронической изоляцией, голодом, грубым обращением или отсутствием контакта с людьми, его мозг фиксирует картину мира как непредсказуемую и враждебную, причем на физиологическом уровне это выражается в увеличении миндалевидного тела, отвечающего за страх, и ослаблении связей с префронтальной корой, контролирующей импульсы.</p>\n<p>Важно понимать, что мозг сохраняет нейропластичность на протяжении всей жизни, поэтому эти ранние изменения не являются окончательным приговором, но они создают тот самый фундамент, надстройка над которым потребует от владельца значительно больше терпения и времени, чем в случае с собакой, имеющей благополучный старт!</p>\n<p>В следующем посте обсудим средовые факторы, влияющие на феномен неуверенности</p>\n<h2 id=\"n1\">Часть 2</h2>\n<h2 id=\"t1\">Что мы можем изменить: среда и наше поведение</h2>\n<p>Именно здесь находится поле для нашей работы, и именно здесь мы чаще всего совершаем ошибки, усиливая неуверенность вместо того, чтобы её уменьшать. Три ключевых направления, в которых владелец может кардинально повлиять на уверенность собаки — это стиль воспитания, повседневные паттерны взаимодействия и организация текущей среды обитания.</p>\n<p>Разберёмся во взаимодействии</p>\n<h2 id=\"t2\">Ошибки воспитания</h2>\n<p>Первая и самая распространенная ошибка — это тактика оставления собаки один на один с её страхом в надежде, что она привыкнет и перестанет бояться. Когда собака демонстрирует явные признаки испуга, а владелец не вмешивается, не создает дистанцию и не предлагает пути к отступлению, мозг питомца фиксирует не только наличие угрозы, но и сигнал о том, что социальный партнер не может или не хочет защитить. Иллюстрацией может служить ситуация, когда собака пугается неожиданного резкого звука, исходящего от нового объекта, а владелец, вместо того чтобы убрать источник дискомфорта, продолжает взаимодействие с этим объектом, возможно, даже пытаясь подбодрить собаку голосом или лакомством.</p>\n<p>В этом случае собака оказывается в ловушке: она напугана, но не может уйти, потому что привязана к владельцу, а владелец не считывает её сигналы и не дает разрешения на отступление. В результате стресс не снижается, а закрепляется, формируя устойчивую ассоциацию: определенная ситуация не только страшна сама по себе, но ещё и не предполагает возможности спасения.</p>\n<p>Вторая критическая ошибка — это авторитарный стиль общения, при котором от собаки требуют беспрекословного подчинения в любых обстоятельствах, подкрепляя требования наказаниями за невыполнение. В такой парадигме у собаки не остается пространства для собственных решений: она учится не исследовать мир и не выбирать безопасные стратегии, а лишь избегать наказания, что формирует состояние, удивительно напоминающее выученную беспомощность. Это не делает собаку уверенной, а лишь создает видимость послушания на фоне хронического подавления инициативы.</p>\n<p>Третья ошибка связана с игнорированием сигналов примирения и дискомфорта, которые собака демонстрирует задолго до того, как перейдет к активной защите или панике. Когда владелец продолжает гладить собаку, которая отворачивается и облизывается, или настаивает на контакте с сородичем, когда собака замирает и прижимает уши, он обучает её тому, что её коммуникация неэффективна, и следующий шаг — либо полное отключение, либо резкая агрессивная реакция.</p>\n<h2 id=\"t3\">Повседневные паттерны: фоновая тревожность</h2>\n<p>Самые сильные воздействия часто бывают незаметными, и неуверенность может подтачиваться теми мелочами, которые владелец не считает значимыми. Главный враг уверенности — это непредсказуемость, проявляющаяся в хаотичном расписании, когда сегодня разрешено то, что вчера было под запретом, или когда прогулки и кормления происходят в случайное время без какой-либо системы. Собаки, являясь существами, для которых предсказуемость является базовой потребностью, в такой среде живут в состоянии перманентного ожидания неопределенности, что само по себе является мощным хроническим стрессором.</p>\n<p>К этой же категории относится отсутствие защиты со стороны владельца в повседневных ситуациях, например, когда чужие люди или дети игнорируют сигналы собаки и вторгаются в её личное пространство, а владелец не вмешивается, боясь показаться невежливым. В таких эпизодах собака усваивает болезненный урок: её безопасность никого не волнует, и она вынуждена полагаться только на собственные, часто дезадаптивные, способы защиты</p>\n<p>Продолжим в следующем посте этого блока</p>\n<h2 id=\"n2\">Часть 3</h2>\n<p>Нельзя не упомянуть о состоянии здоровья. Физическое состояние безусловно влияет на уверенность собаки в своих возможностях. О боли я писала отдельные посты, можно найти их в навигации! Игнорирование физического состояния собаки неизбежно ведёт к проблемам поведения.</p>\n<p>Выбор собственного поведения (понюхать метку, подойти к собаке, обойти человека) для собак так же важен. Но здесь нужно понимать, что не каждая собака страдает от отсутствия выбора, и многие домашние питомцы чувствуют себя вполне комфортно в роли ведомых, полагаясь на решения владельца. Проблема возникает тогда, когда собака пытается проявить инициативу, а её попытки систематически пресекаются, и в этом случае мозг действительно фиксирует паттерн \"мои действия не имеют значения\", что ведет либо к апатичной покорности, либо, в качестве протеста, к внезапным вспышкам агрессии или побегам. Как пример: собака хочет понюхать метку, а её вечно оттаскивают.</p>\n<h2 id=\"t1\">Теперь самое интересное</h2>\n<h2 id=\"t2\">Организация среды и доступ к ресурсам</h2>\n<p>Среда, в которой живет собака, может быть как источником постоянного стресса, так и убежищем, способствующим восстановлению. Постоянный шум, хаотичное движение, присутствие пугающих объектов в непосредственной близости от дома — все это держит нервную систему в режиме боевой готовности, снижая порог реактивности и делая собаку более уязвимой для любых, даже незначительных, раздражителей.</p>\n<p>Кроме того, серьезным фактором неуверенности является ограничение доступа к исследовательскому поведению: когда каждая прогулка представляет собой короткий марш-бросок на коротком поводке без возможности остановиться и понюхать, собака лишается важнейшего канала сбора информации о мире. Этот постоянный дефицит сенсорной нагрузки накапливается и выливается либо в гипервозбуждение, либо в апатию, а мир за пределами привычного маршрута становится все более пугающим именно потому, что остается неизведанным.</p>\n<p>Особенно ярко это проявляется в ситуациях, когда собака долгое время живет в ограниченном пространстве — например, на огороженной территории частного дома — и владелец считает, что этого достаточно, не выводя питомца за пределы привычной зоны. В таком случае комфортная среда постепенно превращается в ловушку: все, что находится за пределами двора, перестает быть частью мира собаки и становится источником угрозы, и, когда возникает необходимость выйти за границы, собака демонстрирует классические признаки панического страха, от замирания до отчаянных попыток вернуться назад.</p>\n<p>Понимание природы неуверенности было бы неполным без знания о том, как собака пытается справляться со стрессом самостоятельно, поскольку эти попытки часто воспринимаются владельцами как непослушание, хотя на самом деле являются единственным доступным инструментом восстановления равновесия. Так что в следующий раз поговорим именно об этом! А я искренне уверена, что эта информация поможет вам лучше понимать питомца</p><p class=\"src\">Источник: канал «Пёсика: заметки зоопсихолога», <a href=\"https://t.me/psypesika/199\" target=\"_blank\" rel=\"noopener\">t.me/psypesika/199</a></p>"

"title": "Где брать ресурс, когда состояние на нуле",
"lead": "Эмоциональное выгорание владельца собаки с проблемным поведением: что происходит и как себя поддержать.",
"html": "<p>Друзья, давайте сегодня честно поговорим о том, о чём молчат красивые видео идеальных послушаний. О том, что происходит внутри, когда за спиной уже третий месяц коррекции поведения, а к этому \"бонусом\" прилетают проблемы со здоровьем питомца</p>\n<p>В психологии есть термин \"эмоциональное истощение\" — центральная составляющая синдрома выгорания. Это когда усталость копится снежным комом, а ресурсы организма заканчиваются быстрее, чем появляются новые задачи. Мозг постоянно находится в режиме гиперконтроля (а что сейчас сделает собака?), что ведёт к когнитивной перегрузке. Когда мы решаем поведенческие проблемы, мы ежесекундно сканируем среду, считываем собаку, думаем о протоколах.. Это требует колоссальных энергозатрат, и важно признать: чувствовать себя опустошенным — нормально.</p>\n<p>Но оставаться в этом состоянии долго нельзя. Своим клиентам всегда стараюсь давать максимум эмоциональной поддержки. А здесь хочу поделиться тремя рабочими стратегиями, как сохранить себя в этом марафоне:</p>\n<h2 id=\"t1\">Делегирование и границы</h2>\n<p>Если есть хоть малейшая возможность переложить часть забот на партнёра, родных или передержку на пару часов — делайте это! Даже если процесс не идеальный, позвольте себе передышку. Отдых психики порой важнее, чем \"правильность\" каждого момента выгула.</p>\n<h2 id=\"t2\">Сообщество как терапия</h2>\n<p>Не замыкайтесь в себе, групповая поддержка снижает уровень кортизола! Заходите в чаты собачников, пишите о своих трудностях. Когда вы выговариваетесь и слышите: \"у меня было так же!\", включается эффект нормализации (я не один, это не катастрофа). Часто мы живём реакциями \"из будущего\", ощущение, что та проблема, что есть у собаки, останется навсегда, это очень удручает. Обмен историями дарит ощущение, что вы не на необитаемом острове и проблема решаема(!)</p>\n<h2 id=\"t3\">Ленивые полезные упражнения</h2>\n<p>На выгуле разрешаем себе не быть дрессировщиком-роботом. Гуляем маршрутами, где меньше раздражителей, выбираем более удобное время. Даём собаке задания, которые тренируют её мозг, но при этом сохраняют ваш ресурс:</p>\n<p>Вот два моих любимых упражнения на развитие самоконтроля, которые не требуют от вас беготни и сильной длительной вовлеченности:</p>\n<h2 id=\"t4\">Кукурузное поле</h2>\n<p>Усаживаем собаку на выдержку (или просто просим подождать), отходим на пару метров и кидаем горсть вкусняшек в высокую траву. По разрешающей команде запускаем поисковую миссию. Собака нюхает и успокаивается, а вы просто стоите и отдыхаете.</p>\n<h2 id=\"t5\">Хочуха</h2>\n<p>Идём по улице на провисшем поводке и шлейке (это важно, чтобы рывком не навредить). Внезапно, молча, без всяких жестов, кидаем кусочек вперёд так, чтобы собака не могла его взять. Собака видит падающее лакомство. Задача: терпеть и не бежать за ним, пока не последует разрешение. Как только пёс переводит взгляд на вас (ждёт отмашку) — говорите разрешающую команду и идёте за куском вдвоём. Делается легко и быстро, прямо на ходу.</p>\n<p>В заключение, хочу сказать, что горжусь каждым из вас! Каждым ответственным владельцем, изучающим информацию о психологии питомца, внедряющим новые упражнения, каждым чутким и эмпатичным, коими и являются мои дорогие читатели!</p>\n<p>Ваша устойчивость и спокойствие — это фундамент здоровья и поведения вашей собаки. Отдыхайте без чувства вины! Вы имеете на это право!</p><p class=\"src\">Источник: канал «Пёсика: заметки зоопсихолога», <a href=\"https://t.me/psypesika/201\" target=\"_blank\" rel=\"noopener\">t.me/psypesika/201</a></p>",

"title": "Как оставить собаку на передержке без стресса",
"lead": "Специалист, друзья или родители: как выбрать вариант и подготовить собаку к расставанию на время отпуска.",
"html": "<p>Я знаю, что в первую очередь это тревожно для владельца: решиться, выбрать место, в тысячный раз задаться вопросом — оставить у специалиста, с друзьями или с родителями?</p>\n<h2 id=\"t1\">Давайте посмотрим, какие варианты вообще есть</h2>\n<p>Вариант 1. Мой любимый Оставить питомца в максимально привычной среде, то есть дома, и пригласить родственника или дог-ситтера пожить у вас. Плюсы: собака остаётся в привычном месте, у вас есть возможность создать максимально идентичный ритм жизни, а тревога от отсутствия владельца снижается за счёт его вещей дома. Минусы: сложности с поиском того, кто захочет пожить у вас дома, или того, кому вы действительно доверитесь.</p>\n<p>Вариант 2. Отдать собаку родственникам или друзьям в их дом или квартиру. Здесь я рекомендую заранее протестировать такой вариант и посмотреть, как справляется питомец и как тот человек, на которого вы возлагаете ответственность. Плюсы: удобно и часто недорого. Минусы: человек может быть неопытен в общении с собаками, а если к этому плюсуется чужая среда — песику может быть непросто адаптироваться сразу.</p>\n<p>Вариант 3. Передержка.  Я рекомендую передержки домашнего формата, у специалиста с кинологическим или зоопсихологическим образованием, и советую съездить на тестовые сутки. Обязательно важно проверить условия содержания! Плюсы: человек точно знает подводные камни вашей собаки и сможет воссоздать грамотный режим. Минусы: часто это дорого, далеко от дома и совершенно новый человек.</p>\n<p>Важно для всех случаев:</p>\n<p>создайте документ, где опишете все нюансы жизни вашей собаки: кормление, режим дня, алгоритм выгула, какую амуницию брать на какой выгул и как ей пользоваться, на что есть реакция на улице, возможные маршруты выгула (если оставляете собаку дома). Это поможет человеку, который будет ситтером, максимально снизить тревогу и у себя, и у собаки. Из этого вытекает следующее: сохраняйте привычный ритм для собаки! Дополнительно, если отправляете песика куда-то, дайте с собой лежанку из дома, пару игрушек и пледик</p>\n<p>Итак, какой бы вариант вы ни выбрали, главное — это ваше спокойствие и подготовка. Собака считывает вашу тревогу, поэтому, когда вы действуете уверенно и по плану, питомец чувствует, что все ок. Идеальной передержки не существует, но есть ответственный подход. Сделайте инструкцию, проведите тестовый день, дайте собаке кусочек дома — и вы сможете наслаждаться отпуском без чувства вины. Это очень важно! Особенно для тех владельцев, кто постоянно в состоянии усталости. А ваш хвост вас дождётся, поскучает, конечно, но ведь и такое иногда полезно, согласитесь</p><p class=\"src\">Источник: канал «Пёсика: заметки зоопсихолога», <a href=\"https://t.me/psypesika/174\" target=\"_blank\" rel=\"noopener\">t.me/psypesika/174</a></p>"
},

"id": "perevozbuzhdenie-shchenka",
"sec": "povedenie",
"author": "shmakova",
"type": "Статья",
"img": "",
"title": "Перевозбуждение у щенка",
"lead": "Щенок носится с лаем, кусает штанины и ничего не слышит: что такое перевозбуждение и как помочь ему успокоиться.",
"html": "<p>Сразу успокою: перевозбуждение условно нормально для щенков, поскольку им объективно сложно сдерживать свои импульсы в силу незрелой нервной системы, и полностью избежать этого невозможно — особенно в возрасте от 5 до 9 месяцев, когда к первичной «щенячьей истеричности» добавляется гормональная перестройка подросткового периода. Именно поэтому владельцу нужна не борьба с неизбежным, а система профилактики и грамотного переключения.</p>\n<p>Как предотвратить взрыв, если вы замечаете первые признаки (учащенное дыхание, суетливость)?</p>\n<p>Самая работающая стратегия — не запрещать, а перенаправлять. Представьте себя в состоянии истерики, когда вам кричат: «Прекрати истерить!» — ноль пользы, верно? А вот если бы вам четко сказали рабочую схему, как решить причину дискомфорта — это было бы руководством к действию. Та же логика у собаки. После любого «нельзя» должно следовать «можно»: нельзя грызть ножку дивана, но можно вылизывать конг с паштетом; нельзя хватать вас за лодыжку, но можно рвать удочку с шерстяным ухватом.</p>\n<p>Заметили, что хвостик целенаправленно движется к мебели, чтобы оставить автограф зубами? Щелкните, пискните, позовите, вызывая ориентировочную реакцию (паузу), и тут же переключите на эмоциональном подъеме: «А смотри, что у меня есть!» — и предлагаете легальный вариант.</p>\n<p>Однако локальные техники не работают без комплексной гармонизации режима. Три кита профилактики перевозбуждения:</p>\n<p>Сон - основа основ! Малыш должен спать не менее 16-18 часов в сутки. После кормления учим расслаблению и самозасыпанию: включаем специальную музыку для собак (есть на «Яндекс Музыке» или RuTube), перед отходом ко сну говорим команду «Спи» или «Отдыхай» и в часы сна не беспокоим хвостика.</p>\n<p>Очень важен баланс нагрузки! Соотношение интеллекта к физике — 75 на 25. Ищем носом, разбираем головоломки, отрабатываем выдержку.</p>\n<p>Контакт с питомцем! Многие опускают этот нюанс при работе с перевозбуждением. Но ведь согласитесь, без хорошего контакта между владельцем и собакой, нельзя выстроить ни грамотного режима, ни качественного взаимодействия, что безусловно влияет на контроль эмоций.</p>\n<p>В моменте «здесь и сейчас», когда перевозбуждение уже накрыло — замедляйтесь сами, говорите тише, не кричите и не отталкивайте собаку руками. Переключите на спокойный поиск носом или на расслабление на коврике.</p>\n<p>Помните, что все проблемы временны, если грамотно подходить к их решению</p><p class=\"src\">Источник: канал «Пёсика: заметки зоопсихолога», <a href=\"https://t.me/psypesika/175\" target=\"_blank\" rel=\"noopener\">t.me/psypesika/175</a></p>"
},

"id": "banany-v-ushah",
"sec": "vospitanie",
"author": "shmakova",
"type": "Статья",
"img": "img/m/shm-176.webp",
"title": "Что делать, если у собаки «бананы в ушах»",
"lead": "Собака не слышит на улице: какие стимулы сильнее владельца и как вернуть контакт на прогулке.",
"html": "<p>Как многие верно замечают, раз есть \"игнорирование\" владельца — значит, существует более сильный стимул. Давайте разберем, что это может быть:</p>\n<p>Перегрузка средой — много запахов, меток, шумных машин или собак.</p>\n<p>Высокая тревожность — собаке страшно или небезопасно на улице; а ещё иногда бывает так, что хозяин небезопасен,  поэтому собака принимает решение действовать самостоятельно.</p>\n<p>Скука — ваши игры и команды стали для нее слишком предсказуемыми и неинтересными.</p>\n<p>Физиология — хочет в туалет и терпит, все мысли только об этом.</p>\n<p>Нулевая \"мотивация\" — еда и игрушки проигрывают «интересностям» окружающего мира. Здесь важно понять причину такого поведения: состояние здоровья? незакрытые другие потребности?</p>\n<p>Я не зря внесла игнорирование в кавычки. Дело в том, что такой игнор - это очень яркий сигнал для хозяина обратить внимание, почему есть отсутствие коммуникации на улице. Собака буквально всем своим видом показывает, что что-то не так.</p>\n<p>Что делать? Вынимаем бананы из ушек по шагам:</p>\n<p>Нулевой шаг. Проанализировать и понять причину такого поведения -&gt; решить причину.</p>\n<h2 id=\"t1\">Шаг 1. Ищем «чистый лист»</h2>\n<p>Начинайте любые занятия (даже просто оклик) в максимально спокойном месте. Без собак, детей, машин и кучи меток. Идеально — спортивное поле или тихий дворик.</p>\n<p>Шаг 2. Соблюдаем алгоритм прогулки. Сначала даем собаке спокойно облегчиться. Только после этого — идем в \"подготовленное\" место для занятий.</p>\n<h2 id=\"t2\">Шаг 3. Раззадориваем, а потом требуем</h2>\n<p>Не кидайтесь сразу с командами. Поделайте что-то легкое, похвалите. Разогрейте интерес. А когда контакт поймали — вводите упражнения и новое.</p>\n<h2 id=\"t3\">Шаг 4. Режим дня — наше всё</h2>\n<p>Переутомленная или, наоборот, недогруженная собака — магнит для деструктива. Сбалансируйте сон, прогулки и ментальную нагрузку.</p>\n<h2 id=\"t4\">Шаг 5. Обязательная работа над построением контакта и взаимопонимания.</h2>\n<p>Бананы в ушах — это не \"пожизненный диагноз\", а маркер. Маркер того, что условия прогулки или ваша коммуникация требуют тонкой настройки. Начните с анализа, будьте наблюдательны — и собака включится снова</p>\n<p>Вы удивитесь, как меняется поведение, когда перестаешь соревноваться с миром, а начинаешь работать в комфортном для собаки и себя темпе</p><p class=\"src\">Источник: канал «Пёсика: заметки зоопсихолога», <a href=\"https://t.me/psypesika/176\" target=\"_blank\" rel=\"noopener\">t.me/psypesika/176</a></p>",
"sub": "Обучение и команды"
},

"id": "leto-s-hvostikom",
"sec": "vospitanie",
"author": "shmakova",
"type": "Статья",
"img": "img/m/shm-177.webp",
"title": "Лето с хвостиком: 5 занятий на улице",
"lead": "Пикник-антистресс и ещё четыре летних занятия, которые сближают с собакой.",
"html": "<p>Лето – это маленькая жизнь! Предлагаю топ классных и наполняющих позитивом занятий с сомбачкой в летний период. Составляйте свои планы на это лето!</p>\n<h2 id=\"t1\">Пикник-антистресс</h2>\n<p>Да-да, не беготня, а покой. Берём плед, интересную книгу (ну или планшет) и садимся в тенистой аллее. С собой в маленькой термосумке — конг, лизательный коврик или грызло (бычий корень, свиные ушки). Это учит собаку самоконтролю и расслаблению в общественных местах (парк, сквер, городской пляж). Пока вы читаете, собака спокойно лижет/жуёт, и тем самым расслабляется. Это инстинктивный механизм, ведущий к заземлению. Главное — не забыть миску с водой для питомца.</p>\n<h2 id=\"t2\">Поисковые игры в траве и деревьях</h2>\n<p>Нюх — суперсила собаки. Используйте её! Засунуть кусочки лакомств в расщелины коры деревьев, спрятать в высокой траве или под камнями.. А если вы на даче — можно устроить целый квест: разложите вкусняшки по разным зонам участка. Фантазировать можно сколько угодно! 10 минут такого поиска утомят покруче забега: это и умственная нагрузка, и физическая (если прятать на высоте - песеля ожидает настоящая растяжка).</p>\n<p>Весёлые трюки (особенно парные)</p>\n<p>Лето — пора трюков. «Вольт» (прыжок от проводника), «Домик» (пролезание между ног), «Змейка», «Восьмёрка».</p>\n<p>Совместные трюки +100500 к контакту и доверию. Это весело, эффектно и очень укрепляет связь! Маленькие победы в изучении +1 трюка - позитивно сказываются на самооценке (что питомца, что хозяина )</p>\n<h2 id=\"t3\">Водные игры</h2>\n<p>Мелкий брод, лужа из шланга, надувной бассейн во дворе. Учите собаку заходить за игрушкой, искать предмет на мелководье.</p>\n<p>Важно: никакого насилия! Кто боится — сначала просто ходим как \"босячком\" по водичке,  мочим только лапки.</p>\n<h2 id=\"t4\">Аджилити из подручных материалов</h2>\n<p>Бревна, поваленные деревья, бордюры, скамейки. Учите соблюдать равновесие, прыгать через бревна. Это тренирует тело и голову одновременно. Про приоцепцию у меня, кстати, есть отдельный пост</p>\n<p>Всем своим читателям желаю яркого и насыщенного лета!</p><p class=\"src\">Источник: канал «Пёсика: заметки зоопсихолога», <a href=\"https://t.me/psypesika/177\" target=\"_blank\" rel=\"noopener\">t.me/psypesika/177</a></p>",
"sub": "Игры и игрушки"
},

"title": "Проблема в поведении? Посмотрите на всю собаку",
"lead": "Как собака ест, пьёт, спит и двигается: реальный кейс, где неочевидные проблемы с опорно-двигательным аппаратом мешали общению с сородичами.",
"html": "<figure class=\"vid\"><video src=\"video/redhusky-vsya-sobaka.mp4\" poster=\"video/redhusky-vsya-sobaka.jpg\" controls playsinline preload=\"metadata\"></video></figure><p>Друзья, если вы видите проблему в поведении своей собаки, в первую очередь смотрите на всю собаку в комплексе, как она:</p>\n<ul><li>ест;</li><li>пьет;</li><li>ходит в туалет;</li><li>в каких позах, где и сколько предпочитает спать;</li><li>есть ли у собаки проблемы с ЖКТ;</li><li>избегает ли каких-то движений;</li><li>на сколько активна или уровень ее активности изменился.</li></ul>\n<p>На реальном кейсе совместно с Анной Канис <a href=\"https://t.me/Anna_Keni\" target=\"_blank\" rel=\"noopener\">@Anna_Keni</a>  разбираем, как проблемы с опорно-двигательным аппаратом, которые проявлялись не очевидно - вызывали сложности в общении с сородичами</p><p class=\"src\">Источник: канал Follow Red Husky, Ксения Золотова, <a href=\"https://t.me/follow_red_husky/74\" target=\"_blank\" rel=\"noopener\">t.me/follow_red_husky/74</a></p>"

"id": "medvedica-dobrovolnoe-soglasie",
"sec": "vospitanie",
"sub": "Обучение и команды",
"author": "redhusky",
"type": "Видео",
"img": "",
"title": "Как белую медведицу приучают к процедурам",
"lead": "Добровольное согласие, десенситизация и маленькие шаги на примере из Ленинградского зоопарка. И что это значит для собак.",
"html": "<figure class=\"vid\"><video src=\"video/redhusky-medvedica.mp4\" poster=\"video/redhusky-medvedica.jpg\" controls playsinline preload=\"metadata\"></video></figure><p>Ещё одно видео из Ленинградского зоопарка, где мы учились вместе с <a href=\"https://t.me/Anna_Keni\" target=\"_blank\" rel=\"noopener\">@Anna_Keni</a> . Давайте посмотрим, как белую медведицу Хаарчаану приучают к забриванию лапы, чтобы потом можно было брать кровь.</p>\n<p>Здесь работают три вещи сразу.</p>\n<p>Добровольное согласие. Хаарчаана сама подходит и сама даёт лапу — и может её убрать или отойти. Авторы теории «выученной беспомощности» Майер и Селигман в 2016 году развернули идею: пассивность и тревога — реакция по умолчанию на стресс, на который животное никак не может повлиять, а учится оно как раз контролю (Psychological Review, 2016; механизм изучали в основном на крысах). Поэтому мало дать возможность сказать «стоп» — важно, чтобы этот «стоп» каждый раз срабатывал. И ещё одна деталь из той же работы: предупредить о касании и дать остановить — два разных инструмента, а здесь есть оба.</p>\n<p>Десенситизация — постепенное привыкание к тому, что напрягает или пугает, такими маленькими порциями, чтобы животное оставалось спокойным. Не «побреем разом, потерпит», а звук, касание, касание подольше — и каждый раз ровно настолько, насколько животное готово.</p>\n<p>Маленькие шаги. Каждый шаг — отдельная маленькая задача с наградой, а если шаг оказался великоват, возвращаемся на предыдущий, а не давим дальше.</p>\n<p>Мы смотрим и думаем о собаках, которым машинку включают над ухом без предупреждения, держат вдвоём и приговаривают «потерпи, ещё чуть-чуть». Если медведице можно дать время подумать, то собаке — тем более 🐾</p><p class=\"src\">Источник: канал Follow Red Husky, Ксения Золотова, <a href=\"https://t.me/follow_red_husky/157\" target=\"_blank\" rel=\"noopener\">t.me/follow_red_husky/157</a></p>"
},
{
"id": "procedury-bez-fiksacii",

"sub": "Обучение и команды",
"author": "redhusky",
"type": "Карточки",
"img": "img/a4/redhusky-soglasie-1.webp",
"title": "Процедуры без фиксации: как спросить собаку",
"lead": "Стрижка когтей, капли в уши, уколы: как договориться с собакой о сигнале согласия и почему «стоп» должен срабатывать каждый раз.",
"html": "<p>После лечения уха собака стала бояться капель так, что вставала и уходила, стоило человеку взять в руки любой тюбик. Мы часто встречаем таких собак: они не кусаются и не вырываются, просто встают и уходят, а мы идём следом, берём покрепче и говорим себе, что так быстрее и что потом она привыкнет (и следующий раз начинается уже с побега).</p>\n<p>Можно по-другому — договориться с собакой о сигнале, который значит согласие:</p>\n<p>смотрит на ведёрко с лакомством;</p>\n<p>кладёт лапу на подушку;</p>\n<p>кладёт подбородок на ладонь или на стул;</p>\n<p>ложится на бок;</p>\n<p>касается носом стикера.</p>\n<p>Пока собака держит этот сигнал, мы продолжаем. Убрала лапу, подняла голову, встала, отвела взгляд — сразу стоп, без «ну ещё чуть-чуть».</p>\n<p>Самый известный вариант — Bucket Game тренера Чирага Пателя, и держится вся игра на одном: «стоп» срабатывает каждый раз.</p>\n<p>Почему это так важно, хорошо видно из работы Стивена Майера и Мартина Селигмана (Psychological Review, 2016): пассивность и тревога — реакция по умолчанию на то, на что нельзя повлиять, а учиться приходится как раз контролю, и именно контроль защищает от последствий стресса — даже того, который ещё впереди. Механизм изучали на крысах, но логика понятна: собака, у которой есть возможность отказа, может позволить себе остаться — на стрижку когтей, на капли в уши и глаза, на укол.</p>\n<p>Предупредить о действии и услышать «стоп» — два разных инструмента, и нужны оба.</p>\n<p>А вы уже пробовали спрашивать собаку?</p><div class=\"gallery\"><a href=\"img/a4/redhusky-soglasie-1.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a4/redhusky-soglasie-1.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a4/redhusky-soglasie-2.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a4/redhusky-soglasie-2.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a4/redhusky-soglasie-3.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a4/redhusky-soglasie-3.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a4/redhusky-soglasie-4.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a4/redhusky-soglasie-4.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a4/redhusky-soglasie-5.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a4/redhusky-soglasie-5.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a4/redhusky-soglasie-6.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a4/redhusky-soglasie-6.webp\" alt=\"\" loading=\"lazy\"></a></div><p class=\"src\">Источник: канал Follow Red Husky, Ксения Золотова, <a href=\"https://t.me/follow_red_husky/160\" target=\"_blank\" rel=\"noopener\">t.me/follow_red_husky/160</a></p>"

"sec": "pervaya-pomosh",

"type": "Видео",

"title": "Три симптома, которые нельзя игнорировать",
"lead": "Затруднённое дыхание, потеря веса без изменений в рационе и повторяющиеся изменения поведения, даже если питомец выглядит нормально.",
"html": "<figure class=\"vid\"><video src=\"video/tri-simptoma.mp4\" poster=\"video/tri-simptoma.jpg\" controls playsinline preload=\"metadata\"></video></figure><p>Три симптома, которые нельзя игнорировать, даже если питомец выглядит нормально‼️</p>\n<p>1. Любое затруднение дыхания.</p>\n<p>Я помню, как привезла в клинику собаку со словами «мне кажется, он как-то не так дышит». Других симптомов не было! Оказалось, пневмония🤯</p>\n<p>Если питомец начал тяжело дышать, часто дышит в покое, втягивает живот при дыхании, вытягивает шею; если кошка дышит с открытым ртом — в общем, всё это повод как можно скорее обратиться в клинику!</p>\n<p>2. Потеря веса без изменений в рационе.</p>\n<p>Если животное худеет, хотя ест столько же или даже больше обычного, это никогда не должно оставаться без внимания.</p>\n<p>Обязательно взвешивайте своих животных раз в полгода (особенно возрастных и особенно кошек, по которым визуально потеря 200г может вообще быть незаметна, но такая потеря клинически очень важна)!</p>\n<p>3. Любое повторяющееся изменение поведения.</p>\n<p>Стала меньше прыгать на диван. Начал дольше вставать после сна. Перестала играть. Стал чаще прятаться.</p>\n<p>Каждое из этих изменений само по себе может показаться мелочью, но именно так нередко проявляются хроническая боль, заболевания суставов, проблемы с позвоночником, и многие другие патологии.</p>\n<p>Иногда самые серьёзные заболевания начинаются с едва заметных изменений, и вот задача владельца научиться их замечать‼️❤️</p><p class=\"src\">Источник: канал Dog’n’Fox, <a href=\"https://t.me/dognfox/17464\" target=\"_blank\" rel=\"noopener\">t.me/dognfox/17464</a></p>"
},
