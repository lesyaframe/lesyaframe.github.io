"id": "igrushki",
"sec": "vospitanie",
"sub": "Игры и игрушки",
"author": "shmakova",
"type": "Статья",
"img": "",
"title": "Игрушки и их неизбежная гибель",
"lead": "Что делать с собаками-«вандалами» и с теми, кто вообще не играет. Две стратегические категории игрушек: долгожители и расходники.",
"html": "<p>Какой же сейчас гигантский, не побоюсь этого слова, выбор игрушек для собак! Он настолько широкий, что глаза разбегаются и порой, действительно,  выбрать очень сложно. Бывает купишь классную и дорогую игрушку,  думаешь, ну вот наконец, крутая вещь! Выдаешь собаке, а там либо 0 эмоций и игрушка пылится вечность на полке, либо от игрушки не остаётся и следа буквально через несколько дней (иногда часов). Обидненько.</p>\n<p>Чаще всего от владельцев собак я слышу два вопроса, касаемо игрушек:</p>\n<p>Какие игрушки выбрать собакам-вандалам, собака игрушку просто разбирает на запчасти?</p>\n<p>Собака вообще в игрушки не играет, реакции нет, что делать?</p>\n<h2 id=\"t1\">Разберемся, для чего вообще необходимы игрушки собакам</h2>\n<p>Собакам видотипично снимать стресс и разгружаться через пасть: поэтому у собачек-тревоженечек мы можем часто видеть такую симптоматику как разрушение дома в отсутствие хозяина.</p>\n<p>Собакам важно двигаться и выплёскивать свою энергию, в том числе и через видотипичные паттерны: догнать объект, поймать, разгрызть</p>\n<p>Игра носит в себе когнитивную нагрузку: иногда нужно подумать как справиться с игрушкой или отобрать ее у хозяина</p>\n<p>И вот тут ключевой момент:</p>\n<p>Игрушка должна закрывать мотивацию собаки! Если она слишком скучная - она этого не делает и собаке она не интересна. Если игрушка перекрывает текущую потребность + собака сама по себе так называемый \"игровик\", восторг от победы и разрушения - это нормально! Точно так же, как и успокоение через погрызушки (главное, чтобы это были легальные и безопасные грызаки). Это не плохая привычка, которую нужно искоренять, а глубокая природная потребность.</p>\n<p>Так что же делать с убийцами игрушек? Мой главный совет: перестать бороться с природой и возглавить этот процесс! С \"ненавистниками\" игрушек - тоже самое!</p>\n<h2 id=\"t2\">Разделим все игрушки на две стратегические категории</h2>\n<p>Игрушки для совместной игры (живчики-долгожители).</p>\n<p>Это инвестиции в отношения и контроль. Собаки, которые самостоятельно не играют - чаще всего могут хорошо играть с хозяином в веселую игру, именно через такие игрушки мы и приучаем собаньку играть.</p>\n<p>Сюда относятся:</p>\n<ul><li>Пулеры и канаты, ухваты для перетягивания.</li><li>Апортировочные мячи.</li><li>Любые тактильные игрушки, с которыми играют именно проводник-собака, а также игрушки-головоломки и нюхательные штуки</li></ul>\n<p>Правило: эти игрушки появляются только на время совместной игры под вашим присмотром. Побегал, потянул, принес — игрушка убирается наверх. Так мой пулер, например, служит верой и правдой уже 3 года! Но, оставь я его с собакой на 10 минут, от него бы и мокрого места не осталось.</p>\n<p>Игрушки на уничтожение (расходники).</p>\n<p>Вот здесь и лежит ответ для всех собак-разборщиков! Заводим в арсенал игрушки, которые и выдаются собаке для уничтожения:</p>\n<ul><li>Каучуковые, резиновые</li><li>Мягкие игрушки-шкурки</li><li>Специальные грызаки</li></ul>\n<p>Правило: выдаем их спокойно, позволяем собаке получить свой законный восторг от расправы, а остатки через какое-то время (день, неделю, месяц) просто утилизируем без сожаления. Их задача  быть искусанными и разорванными, дав собаке нужную разрядку.</p>\n<p>Итак, мой главный лайфхак, игрушка должна перекрывать потребности определенной собаки (все очень индивидуально, посмотрите, что нравится пёселю и только потом внедряйте), не покупайте дорогих игрушек, которые жалко. Позвольте собаке быть собакой с помощью расходников, а совместные эмоции и тренировки оставьте для долгожителей. Игрушки можно менять местами, что-то прятать, что-то доставать. Это спасет и бюджет, и нервы, и подарит питомцу ту самую, здоровую, собачью радость!</p><p class=\"src\">Источник: канал «Пёсика: заметки зоопсихолога», <a href=\"https://t.me/psypesika/113\" target=\"_blank\" rel=\"noopener\">t.me/psypesika/113</a></p>"
},

"id": "priznaki-bezopasnosti",
"sec": "povedenie",
"author": "pushkareva",
"type": "Шпаргалка",
"img": "img/m/bezopasnost.webp",
"title": "5 признаков, что собака чувствует себя в безопасности",
"lead": "Сон, взгляд, интерес к миру, умение отойти и быстрое восстановление после стресса: как понять, что собаке рядом с вами спокойно.",
"html": "<ol class=\"steps\"><li><b>Свободные позы сна</b>Сон — самый честный индикатор безопасности. Когда собака спит, вытянув лапы, на боку или с открытым животом, у неё нет внутреннего ожидания угрозы, нет необходимости быть собранной в комок (конечно, при условии комфортной температуры — если холодно, собака не будет спать кверху пузом).</li><li><b>Мягкий взгляд и расслабленное тело</b>У спокойной собаки тело не зажато и нет ощущения, что мышцы постоянно напряжены, а собака на стрёме. Есть тревожные собаки, которые могут дремать… сидя, потому что среда вокруг них их беспокоит настолько, что они не могут лечь и расслабиться. А уж если легли, то подскакивают по каждому незначительному поводу.</li><li><b>Интерес к миру</b>Любопытство — это роскошь, доступная только при базовом спокойствии. Если собака нюхает, выбирает, залипает в запахах, исследует маршруты, значит, её мозг не занят выживанием. В состоянии хронической тревоги исследовательского поведения не бывает или оно сильно снижено — там только сканирование угроз.</li><li><b>Умение отойти и вернуться</b>Собака, чувствующая себя в безопасности, не прилипает к вашим ногам. Она может уйти полежать в другую комнату и спокойно вернуться. Может не следовать за вами по пятам и при этом не выпадать из контакта. Это говорит о том, что связь не держится на страхе потерять, а опирается на стабильность отношений с вами и окружающей собаку среды.</li><li><b>Быстрое восстановление после стресса</b>Испуг — это совершенно нормально. Разница в том, что дальше: в норме собака встревожилась, отреагировала, а потом возвращается в уравновешенное состояние. Стресс не разрушает её собачий мир. Для собаки важно не отсутствие триггеров (мы же не в вакууме живём), а способность собаки жить и восстанавливаться в том мире, который у неё есть.</li></ol><p class=\"src\">Источник: канал Dog’n’Fox, <a href=\"https://t.me/dognfox/14620\" target=\"_blank\" rel=\"noopener\">t.me/dognfox/14620</a></p>"
},

"id": "prichiny-agressii",
"sec": "povedenie",
"author": "shmakova",
"type": "Статья",
"img": "",
"title": "Какие бывают причины агрессии",
"lead": "Естественная, выученная и псевдоагрессия. Почему за одним и тем же рыком могут стоять совершенно разные причины.",
"html": "<p>Дорогие друзья, поздравляю, мы справились! Вчера был первый день весны Можно было бы провести его иначе, но я выбрала отметить его вот так: с тетрадкой, ручкой и полной головой мыслей на 6 [на самом деле 7] часовом семинаре Юлии Исламовой на тему агрессии</p>\n<p>Для меня быть специалистом - это бесконечное счастье постоянно учиться тому, что действительно интересно и вызывает восхищение. Сидеть в кругу таких же увлеченных профессионалов, кивать, с чем-то спорить, записывать, выдыхать и снова записывать. Атмосфера была просто невероятная, тёплая, живая, своя</p>\n<p>И сегодня мне очень хочется немножко открыть закулисье и поделиться полезностями на тему того, какие вообще причины могут быть у агрессии. Потому что тема агрессии — одна из самых пугающих для владельцев [для специалистов тоже]  и одновременно самая запутанная и будоражащая.</p>\n<p>Давайте по полочкам. Агрессия бывает разной. И это важно понимать</p>\n<p>Естественная агрессия. Собака проявляет агрессию, потому что испытывает какую-то эмоцию, либо осуществляет потребность. Например:</p>\n<p>страх - собака боится и говорит «отстань, а то укушу»; отвращение - да-да, бывает и такое, в этих случаях пёс всячески пытается дистанцировать от себя неприятный объект (как пример, другую собаку); другие эмоции, которые переполняют собаку.</p>\n<p>Выученная агрессия. Проявляется когда агрессивное поведение когда-то сработало и закрепилось. Классика: собака рыкнула на другую собаку - та отстала. Сработало! В следующий раз можно сразу рычать. Или владелец (не специально, конечно) закрепил такое поведение. Например, когда собака рычит на чужих, а вы её успокаиваете, гладите, даёте вкусняшку, чтобы не нервничала. Собака делает вывод: рычу - получаю плюшки. И понеслось.</p>\n<p>И отдельно — псевдоагрессия. И вот здесь я хочу остановиться чуть подробнее, потому что это то, что пугает владельцев чаще всего. Выглядит страшно. А по факту агрессией то и не является.</p>\n<p>Псевдоагрессия — состояние, когда собака рычит, хватает зубами, может довольно сильно кусать, но на самом деле она не хочет никого обидеть или прогнать. Она просто:</p>\n<p>Перевозбудилась в игре. Особенно если у вас амстафф или любая собака с сильным хватом. Она ловит кураж, глаза горят, она хватает вас за руку, рычит, трясёт - выглядит устрашающе! Но это просто игра, которая вышла из-под контроля. Собака не хочет вас убить, она хочет побеждать! Просто не умеет вовремя тормозить.</p>\n<p>Находится в состоянии фрустрации. Ох уж это \"хочу, но нельзя\". Собака видит другую собаку, но поводок короткий. Мячик укатился, а достать не может. Вкусняшка упала в траву и потерялась. Напряжение копится, и бах - рык, бросок, лай. Истерика от невозможности получить желаемое, переходящая в ярость. Помните трёхлетних детей в магазине, которые падают на пол и орут? Очень похоже.</p>\n<p>Включила охотничье поведение. Мелькнула кошка, птица, белка — и собака \"выключила голову\". Может рычать, рваться. Тут мы видим древний инстинкт, который сильнее любых запретов.</p>\n<p>Важно: все эти виды могут быть переплетены между собой, за одним может скрываться другое, сочетания безграничны</p>\n<p>Представляете, какое многообразие причин может быть у с виду одного и того же поведения? Поэтому я так люблю такие семинары. Мы разбирали реальные кейсы от диагностики до результата, учились отличать настоящие причины от ложных, смотрели, как одно и то же поведение может быть вызвано совершенно разными причинами.</p>\n<p>А вам, мои любимые читатели, хочу сказать: если ваша собака когда-то напугала вас или чужих людей/собак своим рыком, не спешите ставить крест на ней или на себе. Не спешите думать, что у вас \"злая собака\". Приходите разбираться - вместе всегда легче.</p>\n<p>Весна началась  и это не может не радовать! Даже с питерским дождём..Будем и дальше разбираться в \"собачьих приколах\" и делать жизнь чуточку счастливее</p><p class=\"src\">Источник: канал «Пёсика: заметки зоопсихолога», <a href=\"https://t.me/psypesika/129\" target=\"_blank\" rel=\"noopener\">t.me/psypesika/129</a></p>"
},
{
"id": "podrostki",
"sec": "povedenie",
"author": "lychko",
"type": "Статья",
"img": "img/m/podrostki.webp",
"title": "Ох уж эти подростки!",
"lead": "Подростковый возраст собаки: когда начинается, что происходит с телом и мозгом, типичные ошибки владельцев и что делать.",
"html": "<p>Пожалуй, самый наводящий страх и ужас на владельцев период в жизни каждой собаки - подростковый возраст. Видели эти картинки с динозаврами?) Именно об этом возрасте сегодня и поговорим подробнее, чтобы было не так страшно</p>\n<h2 id=\"t1\">Подростковый возраст</h2>\n<ul><li>Начинается в среднем с 5-6 месяцев и заканчивается в среднем к 1,5 годам (у разных пород по-разному, у крупных - этот период может длиться до двух лет)</li><li>Происходит активация полового созревания в связи с изменениями в половых органах. Под воздействием половых гормонов происходит перестройка всего организма, растут все ткани организма (собака растет, набирает вес, мышечную массу, меняются пропорции тела)</li><li>Происходят серьезные изменения в мозге. Причем наиболее сильные изменения происходят в тех отделах, что отвечают за самоконтроль, эмоции и половое поведение</li><li>Поэтому для этого возраста характерны: реактивность, гиперактивность, быстрая смена настроений, повышенное возбуждение, подверженность стрессам</li></ul>\n<h2 id=\"t2\">Чем нам это всё грозит?</h2>\n<ul><li>Ухудшается поведение</li><li>Снижается концентрация внимания</li><li>Собаке становится сложнее слушаться буквально физически</li><li>Снижается стабильность выполнения навыков</li><li>Ухудшается способность к самоконтролю</li><li>Изменяется структура потребностей: возрастает потребность в самостоятельности, контактах с незнакомыми собаками</li><li>Щенок начинает всё дальше отходить от нас, уже не держится так робко у ноги, фокус внимания смещается на интересный мир вокруг</li></ul>\n<h2 id=\"t3\">Что важно понимать</h2>\n<p>Все эти моменты не связаны ни с контактом, ни с воспитанием, ни с особенностями конкретной собаки. Это всё естественные процессы, и нет смысла обижаться и сердиться на свою собаку.</p>\n<h2 id=\"t4\">Типичные ошибки, которые допускают владельцы в этот период</h2>\n<ul><li>Усиление строгости, резкая смена стиля воспитания</li><li>Повышение требований, резкое повышение нагрузок</li></ul>\n<p>Всё это может только ухудшить ситуацию и подорвать наши отношения с собакой, которой и так сейчас не просто 💔</p>\n<h2 id=\"t5\">Что же делать?</h2>\n<ul><li>Запастись терпением! А ещё - пониманием и сочувствием. Крайне важно не испортить отношения в этот непростой период и не подрывать доверие собаки</li><li>Обеспечивать подростку безопасность</li><li>Быть последовательным и предсказуемым</li><li>Давать возможности для развития и удовлетворения потребностей - социальные прогулки, обогащённая среда, развивающие игры и т.д.</li><li>Добавить упражнения на самоконтроль и расслабление - жевание, грызение, успокаивающая музыка и т.д.</li></ul>\n<p>💡 Также в этом возрасте могут ярко проявляться периоды пугливости. Важно поддерживать собаку в моменте, обеспечивать аккуратное взаимодействие с пугающими стимулами (не погружать собаку насильно в пугающую обстановку).</p>\n<p>💬 Кто уже проходил подростковый возраст со своей собакой - поделитесь вашим опытом, как это было? Что бы вы посоветовали тем, кому только предстоит столкнуться с этим периодом?)</p><p class=\"src\">Источник: канал Doggy Brain, <a href=\"https://t.me/doggybrain/1948\" target=\"_blank\" rel=\"noopener\">t.me/doggybrain/1948</a></p>"
},
{
"id": "sobaka-podrostok",
"sec": "povedenie",
"author": "pushkareva",
"type": "Видео",
"img": "img/m/podrostok-video.webp",
"title": "Собака-подросток: движение, свобода и фрустрация",
"lead": "Три коротких видео о том, что подростку нужно на самом деле: правильная активность, право решать и возможность легко получать желаемое.",
"html": "<h2 id=\"p1\">Не «гиперактивная», а нормальная</h2>\n<figure class=\"vid\"><video src=\"video/podrostok-aktivnost.mp4\" poster=\"video/podrostok-aktivnost.jpg\" controls playsinline preload=\"metadata\"></video></figure><p>Собака-подросток — не “гиперактивная”, она нормальная. Гиперактивность это вообще медицинский диагноз, и мы его просто так, без дела, не упоминаем всуе)))</p>\n<p>В подростковый период у организма максимальная потребность в движении, но не любое движение идёт на пользу!</p>\n<p>Повторяющиеся быстрые нагрузки, бесконечные броски мячика, затяжные пробежки могут перегружать развивающийся организм.</p>\n<p>Это даже взрослой собаке не полезно :(</p>\n<p>А вот, что действительно помогает подростку развиваться гармонично⬇️</p>\n<ul><li class=\"em\">✅ чередование активности и отдыха</li><li class=\"em\">✅ социальная игра с подходящими партнёрами</li><li class=\"em\">✅ маршруты по пересечённой местности, где мозг работает вместе с телом</li></ul>\n<h2 id=\"p2\">«Я хочу сам решать»</h2>\n<figure class=\"vid\"><video src=\"video/podrostok-svoboda.mp4\" poster=\"video/podrostok-svoboda.jpg\" controls playsinline preload=\"metadata\"></video></figure><p>А я продолжаю рассказывать про подростков :)</p>\n<p>У собаки-подростка есть не только энергия, но и позиция «я хочу сам решать» (как и у человеческих подростков, вообще-то)))  Такой этап развития!</p>\n<p>А ограничения, постоянный короткий поводок, “сюда, туда, быстрее” создают напряжение. Чем меньше свободы, тем сильнее желание её вернуть, да ведь? Если мне всё запрещают, я буду бороться)))</p>\n<p>Что можно сделать⬇️</p>\n<ul><li class=\"em\">✅ длинный поводок (5+ метров)</li><li class=\"em\">✅ дать собаке нюхать столько, сколько ей нужно</li><li class=\"em\">✅ позволять выбирать маршрут</li><li class=\"em\">✅ давать право отказаться от общения с другими собаками и право общаться с теми, кто нравится</li></ul>\n<p>Мы помогаем ей взрослеть, а не устраиваем строевую подготовку, которая, на самом деле, домашним собакам вообще не нужна, они же не в армии 😅</p>\n<h2 id=\"p3\">Фрустрация</h2>\n<figure class=\"vid\"><video src=\"video/podrostok-frustraciya.mp4\" poster=\"video/podrostok-frustraciya.jpg\" controls playsinline preload=\"metadata\"></video></figure><p>Продолжаю рассказывать о подростках :)</p>\n<p>Молодые собаки имеют повышенный уровень импульсивности и они более заинтересованы в исследовательской деятельности.</p>\n<p>Если их ограничивать — приветики,  фрустрация. Фрустрация это раздражительность от невозможности получить желаемое (то есть ожидание не совпало с реальностью), и за ней потянется клубок проблем.</p>\n<p>Хотела дотянуться до игрушки — не дали. Хотела подойти к собаке — не разрешили.</p>\n<p>Что делает мозг подростка? ВЫХОДИТ ИЗ ЧАТА🫠🫠🫠</p>\n<p>Дальше может включиться агрессия, переадресация, и собака начнёт грызть лапы, стены… вас.</p>\n<p>Так что у собаки-подростка должна быть возможность легко получать вознаграждение😍</p><p class=\"src\">Источник: канал Dog’n’Fox, <a href=\"https://t.me/dognfox/13913\" target=\"_blank\" rel=\"noopener\">t.me/dognfox/13913</a></p>"
},
{
"id": "pochemu-vmeste-opg",
"sec": "dve-sobaki",
"author": "pushkareva",
"type": "Видео",
"img": "img/m/dve-opg.webp",
"title": "Почему две собаки по отдельности милые, а вместе — ОПГ?",
"lead": "Социальная фасилитация, общие паттерны, перевозбуждение и роли в паре: почему вдвоём собаки ведут себя иначе.",
"html": "<figure class=\"vid\"><video src=\"video/dve-sobaki.mp4\" poster=\"video/dve-sobaki.jpg\" controls playsinline preload=\"metadata\"></video></figure>\n<p>Причин несколько.</p>\n<p>Во-первых, мы можем иметь дело с социальной фасилитацией — это когда поведение одного животного усиливается или провоцируется присутствием другого. 📚 Нам даже исследования (например, Milliken et al., 2002) показывают, что в группе животные могут возбуждаться быстрее и реагировать более резко, чем в одиночку. Особенно это актуально для видов с высоким уровнем социальной передачи эмоций — а собаки наши как раз такие.</p>\n<p>Например, одна собака залаяла — вторая тут же подхватила, даже если изначально не чувствовала угрозы или стимула.</p>\n<p>Во-вторых, собаки, живущие вместе, формируют общие паттерны поведения. Если в прошлый раз они вместе тянули поводок на кошку или творили какую-то дичь (и ничего плохого не произошло, зато все кайфанули) — поведение усиливается и закрепляется.</p>\n<p>В-третьих, когда две собаки вместе, уровень возбуждения часто повышается. В этом состоянии префронтальная кора (отвечающая за контроль поведения) работает хуже (по аналогии с людьми в толпе, когда случается коллективный угар на концертах)))). По отдельности собаки могут тормозить себя, а вместе уже нет 🫠</p>\n<p>Иногда распределение ролей в группе выходит на передний план: если в паре формируется лидер и к нему примыкает последователь, то есть более уверенная собака задаёт тон, а вторая втягивается в поведение («Что мы будем делать сегодня вечером, Брейн?»)))).</p>\n<p>Есть ещё ситуации, например, когда собаки вдвоём, они могут воспринимать других собак или людей как внешнюю группу, то есть потенциальную угрозу. Это усиливает охранное, территориальное и демонстративное поведение.</p>"
},
{
"id": "vozrast-i-kommunikaciya",
"sec": "dve-sobaki",
"author": "lychko",
"type": "Статья",
"img": "",
"title": "Как возраст собак влияет на общение внутри группы",
"lead": "Щенки, молодые и пожилые собаки общаются по-разному. Но темперамент и прошлый опыт важнее возраста.",
"html": "<p>На коммуникацию собак внутри мультисобачьей семьи, как и внутри свободно живущей группы, влияет множество факторов. Один из них - возраст. У разных возрастных категорий есть свои особенности, которые отражаются на взаимодействии с другими собаками.</p>\n<h2 id=\"t1\">Щенки</h2>\n<p>Щенки отличаются высокой потребностью в движении, играх и исследовании окружающего мира. Именно у них и молодых собак игровое поведение с сородичами выражено наиболее ярко. С возрастом оно часто становится менее интенсивным, поэтому взрослые собаки обычно реже нуждаются в активных совместных играх.</p>\n<p>Также существует понятие \"puppy license\" - негласное правило, согласно которому взрослые собаки прощают маленьким щенкам грубость, навязчивость и ошибки в общении. Благодаря этому в уже сложившуюся группу зачастую проще ввести щенка младше 6 месяцев, так как взрослые собаки могут отнестись к нему терпимее.</p>\n<p>! Однако это не универсальный закон, и некоторые собаки не следуют этому правилу, поэтому всегда важно учитывать индивидуальные особенности.</p>\n<h2 id=\"t2\">Молодые собаки</h2>\n<p>Как правило, молодые животные нуждаются в большей физической активности, чаще стремятся к коммуникации и совместным играм с сородичами. Если у них нет тяжёлого прошлого опыта, им обычно проще заводить новые знакомства и выстраивать дружеские отношения с другими собаками.</p>\n<p>Но и здесь нельзя говорить о жёстких правилах. Молодой возраст сам по себе не гарантирует общительность или любовь к играм.</p>\n<p>Интересный факт: молодые собаки и маленькие щенки легче учатся друг у друга, чем пожилые. Например, если мы вводим в стаю молодую активную шкодливую собаку с активным живым умом, то благодаря социальному подражанию она запросто может научить других молодых собак стаи новому поведению (особенно условно плохому)). В то время как пожилые и взрослые реже поддаются подобному социальному обучению и реже вовлекаются в какие-то авантюры, опираясь на свой прошлый опыт и на правила, которые они усвоили проживая на данной территории.</p>\n<h2 id=\"t3\">Пожилые собаки</h2>\n<p>Пожилым собакам бывает сложнее принимать новичков и выстраивать отношения с новыми членами группы. Они больше нуждаются в отдыхе и спокойствии, а потому могут меньше взаимодействовать с другими собаками.</p>\n<p>Кроме того, с возрастом нередко появляются заболевания или хроническая боль, которые делают активные игры некомфортными даже для тех собак, которым они по темпераменту нравились бы. За долгую жизнь накапливается и богатый опыт общения: формируются привычки, ожидания и собственные правила. Поэтому некоторые пожилые собаки становятся более требовательными к поведению окружающих, могут чаще делать замечания или пресекать нежелательные действия.</p>\n<p>Особенно сложным бывает взаимодействие между щенками и пожилыми собаками. Щенок хочет играть и ещё только учится принимать отказ, а пожилой собаке может быть тяжело выдерживать такую активность и напор. Поэтому важно контролировать подобные контакты и следить, чтобы у старшей собаки всегда была возможность отдыха.</p>\n<h2 id=\"t4\">Что важнее?</h2>\n<p>Возраст действительно накладывает отпечаток на коммуникацию, влияя на интенсивность общения, предпочтительные совместные активности и особенности построения отношений. Но гораздо важнее другие факторы.</p>\n<ul><li>Темперамент</li></ul>\n<p>Даже внутри одной возрастной группы собаки сильно отличаются друг от друга. Для одной лучшим досугом будут активные догонялки, а для другой - спокойная параллельная прогулка с обнюхиванием территории.</p>\n<ul><li>Индивидуальные особенности и прошлый опыт</li></ul>\n<p>Огромную роль играет накопленный опыт. У взрослой собаки со временем формируются предпочтения в общении, привычные сценарии поведения, а также моменты, которые она не готова терпеть. Чем старше собака, тем больше этот багаж может влиять на её взаимодействие с окружающими, и тем менее гибкой и адаптивной она может быть.</p>\n<h2 id=\"t9\">P.S.</h2>\n<ul><li>Мы не можем заставить собак дружить. Но - в большинстве случаев можем помочь им мирно сосуществовать</li></ul>\n<ul><li>Коммуникация и дружба - это не игры 24/7. Способность спокойно отдыхать рядом, полностью расслабляться в присутствии друг друга, уступать и не эскалировать конфликты из-за мелочей - гораздо более важные показатели здоровых отношений между собаками внутри семьи или стаи ❤️</li></ul><p class=\"src\">Источник: канал Doggy Brain, <a href=\"https://t.me/doggybrain/2657\" target=\"_blank\" rel=\"noopener\">t.me/doggybrain/2657</a></p>"
},
{
"id": "vzroslaya-i-shchenok",
"sec": "dve-sobaki",
"author": "lychko",
"type": "Статья",
"img": "img/m/vzroslaya-shchenok.webp",
"title": "Как помочь взрослой собаке принять 3-месячного щенка",
"lead": "Рутина, раздельное кормление, свои места, индивидуальное внимание и совместные прогулки: лайфхаки для спокойной адаптации.",
"html": "<p class=\"lbl\" style=\"color:var(--caramel)\">Вопрос</p>\n<blockquote>“Как помочь взрослой собаке принять совсем мелкого 3-х месячного щенка?”</blockquote>\n<p>Поздравляю вас с новым членом семьи! И хотя милый 3-х месячный щеночек это всегда взрыв окситоцина для нас, для взрослых собак, которые уже живут в нашей семье, это может быть далеко не всегда радостным событием) Наша цель – помочь взрослой собаке принять малыша, не чувствуя угрозы своей территории и вашему вниманию. Опишу основные моменты, которые могут в этом помочь.</p>\n<h2 id=\"v1\">Лайфхаки по успешной адаптации</h2>\n<ol class=\"steps\"><li><b>Рутина</b>Сохраняйте прежнюю рутину максимально, где это возможно. Пусть в графике и жизни взрослой собаки сохраняется прежняя рутина. Происходит большая перемена в жизни, это волнительно и тревожно. Пусть всё остальное остаётся прежним – прогулки, кормления, почесушки перед сном, вылазки в парк и другие любимые ритуалы. Рутина и предсказуемость – важный фундамент в процессе адаптации</li><li><b>Разделение</b>Маленькие щенки могут быть очень навязчивы, поэтому наша задача следить, чтобы у взрослой собаки была возможность отдыхать от щенка. Детские ворота безопасности – идеальный вариант, чтобы собаки видели друг друга, но имели возможность не контактировать</li><li><b>Раздельное кормление</b>Щенка можно кормить в отдельной комнате, в том числе при необходимости за закрытой дверью. Это поможет избежать конкуренции за ресурсы и позволит обоим собакам чувствовать себя расслабленно во время приёма пищи</li><li><b>Места</b>Место (любимое место для сна и отдыха) взрослой собаки должно оставаться прежним. У щенка также должно быть своё место, которое важно разместить так, чтобы он не мешал взрослой собаке</li><li><b>Внимание</b>Обязательно уделяйте индивидуальное внимание взрослой собаке. Лучше всего для этого подходят индивидуальные прогулки, на которых можно выбирать любимые маршруты, предлагать любимые занятия и не стесняться в выражении любви и словах похвалы</li><li><b>Совместные прогулки</b>Совместные прогулки помогают собакам привыкнуть друг к другу, создавать совместный позитивный опыт и положительные ассоциации – когда собаки идут рядом, что-то параллельно обнюхивают и изучают. Для таких прогулок на первое время идеально подойдут знакомые спокойные маршруты</li><li><b>Короткие сессии совместных занятий</b>В три месяца щенок уже может научиться простым навыкам – например, сидеть или давать лапу. Можно просить собак сесть рядом, лечь или выполнить другие известные им задания. Важно – выдавать поощрение одновременно и не допускать ситуаций конкуренции за ресурсы и ваше внимание. Вкусное лакомство и активная похвала также лягут в копилку совместного позитивного опыта</li><li><b>Подсластить новый жизненный этап</b>Закупитесь любимыми вкусняшками, которые давно не покупали. Пусть появление щенка ассоциируется у взрослой собаки с ростом количества ресурсов и с изобилием. Появился щенок – а жизнь стала лучше!</li></ol>\n<h2 id=\"v2\">Другие не менее важные моменты</h2>\n<ol class=\"steps\"><li><b>Всего должно быть в изобилии</b>Мисок с водой, мест для сна, лежанок, укромных уголков, чтобы спрятаться, игрушек, вкусняшек</li><li><b>Сокровища</b>Если вдруг у вашей старшей собаки есть какие-то очень любимые игрушки – лучше на первые дни их убрать из общего пространства, а для щенка выбрать нейтральные для старшей собаки игрушки. Так мы избежим не нужного напряжения и возможных конфликтов</li><li><b>Модерируем общение</b>Помогаем собакам в напряженных ситуациях, переключаем их внимание в случае каких-то конфликтов, помогаем вовремя остановиться и не перебеситься в игре</li><li><b>Отбор поведения</b>Хвалите взрослую собаку, когда она ведёт себя спокойно, нейтрально или доброжелательно в отношении щенка</li><li><b>Практики расслабления</b>После каких-то напряженных ситуаций, конфликтов или просто чрезмерного возбуждения, мы также можем более активно, чем (возможно) делали это раньше, предлагать взрослой собаке успокаивающие занятия. Поиск лакомств, долгоиграющее лакомство, социальный сон, расслабление на коврике – что угодно, что уже было в вашем обиходе</li></ol>\n<h2 id=\"v3\">Важно</h2>\n<ol class=\"steps\"><li><b>Запаситесь терпением</b>Чтобы привыкнуть к новому жителю, нужно время. Первые неделя-две – самые сложные. Дальше будет легче</li><li><b>Помните о возможных вариантах развития событий</b>Стоит принять тот факт, что взрослая собака может никогда не захотеть общаться с щенком и дружить с ним. Так бывает. Также некоторые собаки просто не любят слишком маленьких и активных щенков. Но когда малыши подрастают, может начаться новый этап и развиться крепкая дружба</li></ol>\n<p>Процесс адаптации может занять от нескольких дней до нескольких месяцев. Любовь, терпение, предсказуемость и последовательность помогут взрослой собаке адаптироваться к появлению нового члена семьи максимально гладко.</p>\n<p>Желаю успехов! 💚</p><p class=\"src\">Источник: канал Doggy Brain, <a href=\"https://t.me/doggybrain/2292\" target=\"_blank\" rel=\"noopener\">t.me/doggybrain/2292</a></p>"
},

"id": "kormlenie-neskolkih",
"sec": "dve-sobaki",
"author": "lychko",
"type": "Вопрос-ответ",
"img": "img/m/kormlenie.webp",
"title": "Как организовать кормление нескольких собак",
"lead": "Опыт семьи с пятью собаками и разбор ситуации, когда одна собака проверяет чужую миску.",
"html": "<p>\"Интересует личный опыт + общие рекомендации. Как вы организуете кормление стаи? Как разделяете миски/процесс? С какими сложностями сталкивались, когда собак много?\"</p>\n<p>У нас 5 собак и кормление организовано следующим образом.</p>\n<p>Подростки (Мия и Колобок) едят в отдельной комнате за закрытой дверью (щенковый корм всем представляется сильно вкуснее, чем взрослый, поэтому мы их с щенячества кормим отдельно). Раньше Колобок воровал у Мии, но проблема решилась просто - оказалось, что Колобок растет более крупным и ему необходимо больше еды. Увеличив порцию Колобку, воровство из чужой миски прекратилось. Поэтому они спокойно едят вместе в одной комнате, не мешая друг другу, и следить за ними не требуется. Также внутри комнаты они разделены кроватью (миски ставим по разные стороны кровати) - таким образом они не видят друг друга во время кормления и не беспокоятся.</p>\n<p>Взрослые едят в кухне-гостиной. Миски ставятся в разные углы на достаточном отдалении друг от друга. Айс раньше был склонен бежать проверять миску Акелы, поэтому теперь он получает миску вторым - когда он заканчивает есть, проверять у Акелы уже нечего, и попыток не предпринимается. Кире никто есть не мешает, хотя она и ест дольше всех - она девушка строгая, её никто не беспокоит)</p>\n<p>У каждого есть определенное конкретное место, где они едят, и оно не меняется. Никто никому не мешает. Следить нет необходимости.</p>\n<h2 id=\"t1\">Продолжение вопроса</h2>\n<p>\"У нас необычная ситуация в частном доме: есть домашний пёс, к нему в гости ходит подруга. Она всю жизнь бездомная, но компанейская, освоила заход в дом и социальный сон на ковре :) Заодно и социальный приём пищи. Три месяца отрабатываем совместное кормление: пес на своём месте получает миску первым, потом в смежном помещении ставится миска для подруги. Собаки видят друг друга, но не сильно беспокоятся, едят спокойно. Сложности были в начале, когда ели разную еду - в чужой миске было вкуснее. Стали кормить одинаково, обмен мисками стал менее интенсивным.</p>\n<p>Пёса худеет и критично, чтобы он не воровал, подруга стройная и часто ковыряется в миске (у неё есть и другие места кормления). Едят с разной скоростью. Сейчас научила своего после опустошения миски просить десерт, но он все равно норовит проверить дружескую тарелку :) Меня утомляет за ними следить...\"</p>\n<p>Если есть проблема \"обмена мисками\" и собаки мешают друг другу спокойно есть, то самый простой вариант - кормить в раздельных комнатах, закрывая одну из собак. Процесс похудения, особенно за счёт снижения калорийности / объема порции - уже может быть достаточно сильным фактором стресса. Собаке в такой ситуации физически сложно отказаться от проверки чужой миски, если она доступна. Не стоит превращать процесс основного принятия пищи в тренировку.</p>\n<p>Принятие пищи - очень важный момент, который должен проходить в спокойной обстановке и без конкуренции. Важно, чтобы никто в это время не спешил, не заглатывал еду с огромной скоростью, спеша заглянуть в миску к соседу, и не беспокоился, что у него могут отобрать еду 💚</p><p class=\"src\">Источник: канал Doggy Brain, <a href=\"https://t.me/doggybrain/2178\" target=\"_blank\" rel=\"noopener\">t.me/doggybrain/2178</a></p>"
},

"id": "sobaka-v-dom-k-koshke",
"sec": "sobaka-i-kot",
"author": "lychko",
"type": "Статья",
"img": "img/m/sobaka-k-koshke.webp",
"title": "Как привести собаку в дом к кошке",
"lead": "Что подготовить для кошки заранее и как прожить первое время вместе, чтобы всем животным было комфортно.",
"html": "<p>Если у вас уже есть кошка, но вы мечтаете о собаке, то необходимо учесть несколько важных моментов, прежде чем привести собаку в дом, чтобы всем животным было комфортно.</p>\n<h2 id=\"t1\">Потребности и благополучие кошки</h2>\n<p>Чтобы появление собаки в доме не стало для кошки тяжёлым фактором стресса, необходимо убедиться, что у кошки закрыты все базовые потребности и достаточно условий среды для жизни вместе с собакой. Это очень важно, так как кошки очень тяжело реагируют на сильный стресс, из-за чего у них могут развиваться серьезные заболевания (например, идиопатический цистит).</p>\n<ul><li>Расположите место кормления в недоступном для собаки месте</li><li>Чистая вода должна быть в постоянном доступе в отдалении от места кормления и также в недоступном месте для собаки</li><li>Подготовьте лежанки для сна в укромных местах, недоступных собаке. Например, на столе, верхних полках, нишах или ящиках шкафа</li><li>Также проведите ревизию игрушек, когтеточек и лотков - всё это важные базовые потребности кошки, и они должны быть полностью закрыты</li><li>Организуйте место для сна и кормления собаки таким образом, чтобы маршруты собаки к этим местам не пересекались с маршрутами кошки к её местам для сна и особенно к лотку</li><li>Обеспечьте кошке доступ к верхотурам (полки, столы, шкафы, тумбочки). Кошкам, как виду, очень важны вертикальные пространства. И эта потребность особенно остро актуализируется, когда в доме появляется собака - у кошки должна быть возможность уходить от собаки в недоступное для нее место и чувствовать себя в безопасности</li></ul>\n<h2 id=\"t2\">Знакомство и первое время вместе в одном доме</h2>\n<ul><li>Не настаивайте на контакте между животными, дайте кошке время привыкнуть к новому жильцу. Не нужно насильно знакомить или заставлять находиться рядом</li><li>Помогайте животным в коммуникации - отвлекайте собаку, когда она проявляет слишком навязчивое внимание к кошке, помогайте освоить правила взаимодействия с кошкой, хвалите за спокойное нахождение рядом</li><li>Если собака слишком бурно реагирует на кошку и не может успокоиться, предлагайте собаке альтернативные занятия (игрушки, долгоиграющие лакомства). Включите в ваш распорядок регулярные успокаивающие занятия для собаки - лизательные коврики, поиск лакомств, любые развивающие и нюхательные игры</li><li>При необходимости также можно помочь с помощью аромата лаванды (аромасаше с капелькой масла в комнате) и успокаивающей музыки (не громко)</li><li>Не забывайте уделять время кошке, сохраняя вашу привычную рутину. Выделяйте время для ласки и игр. Чтобы собака не мешала, можно закрываться с кошкой в комнате во время игр с ней</li><li>Учитывайте потребности собаки. Чем качественнее будут закрыты потребности собаки (прогулки, игры, новые впечатления, контакт с людьми и другими собаками и т.д.), тем меньше у собаки будет причин утолять скуку или снимать стресс о кошку :)</li></ul>\n<p>Кошки и собаки могут прекрасно уживаться вместе, дружить, нежиться, спать рядом и даже играть. Как минимум, если потребности обоих видов качественно закрываются, животные могут жить вместе мирно.</p><p class=\"src\">Источник: канал Doggy Brain, <a href=\"https://t.me/doggybrain/1568\" target=\"_blank\" rel=\"noopener\">t.me/doggybrain/1568</a></p>"
},

"id": "deti-i-sobaki-gayd",
"sec": "sobaka-i-rebenok",
"author": "lychko",
"type": "Гайд",

"title": "Дети и собаки: правила безопасного общения",
"lead": "Бесплатный гайд Doggy Brain: основы безопасного общения, чего нельзя делать с собакой и идеи безопасных совместных игр ребёнка и собаки.",
"html": "<p>На курсе Dog Emotion and Cognition Брайан Хэйр (профессор эволюционной антропологии в Университете Дьюка) приводил интересную статистику. По статистике 70% укусов собак приходятся на маленьких детей до 10 лет 💔 Причем в трети случаев речь идет именно о домашних, семейных собаках, которые никогда ранее никого не кусали.</p>\n<p>Почему так происходит? Как этого избежать?</p>\n<p>На мой взгляд, самый эффективный способ - помогать взрослым лучше понимать собак. Способствовать распространению осведомленности о том, что вообще свойственно собакам, как виду, и как они общаются. Ведь, чтобы модерировать чьё-либо взаимодействие, необходимо чётко понимать, что именно и почему происходит.</p>\n<ul><li>Какие действия в отношении себя собака может воспринять как угрозу?</li><li>Какие действия могут её напугать? А какие, напротив, - помогут выстроить контакт?</li><li>На какие сигналы тела собаки необходимо обращать внимание, чтобы понять, что сейчас чувствует собака, расположена ли она к общению?</li><li>Какие игры ребенка с собакой имеют ряд рисков, а какие более безопасны?</li></ul>\n<p>В моём бесплатном гайде \"Дети и собаки\" вы найдёте информацию о том, как выстроить безопасное общение между собакой и ребенком.</p>\n<p>💡 СОДЕРЖАНИЕ ГАЙДА:</p>\n<ul><li>Основы безопасного общения с собакой</li><li>Что нельзя делать с собакой во избежание конфликта</li><li>Как общаться с собакой безопасно</li><li>Идеи безопасных и полезных совместных игр и занятий для собаки и ребенка</li></ul><div class=\"linkset\"><a href=\"https://drive.google.com/file/d/1zMXB2uQvlNaBD6saGFne5ZQD5wneIVPU/view?usp=share_link\" target=\"_blank\" rel=\"noopener\"><b>Скачать гайд «Дети и собаки»</b><span>Google Диск, бесплатно</span><i>↗</i></a></div><p class=\"src\">Источник: канал Doggy Brain, <a href=\"https://t.me/doggybrain/667\" target=\"_blank\" rel=\"noopener\">t.me/doggybrain/667</a></p>"

"title": "Укусы змей",
"lead": "Чего не делать и что делать, если собаку укусила змея. И почему про сыворотку в клинике стоит узнать заранее.",
"html": "<h2 id=\"t1\">Чего НЕ делать</h2>\n<ul><li class=\"em\">❌ не нужно вводить никакие антигистаминные препараты (например, цитрин или супрастин)</li><li class=\"em\">❌ нельзя обезболивать посредством НПВП (например, мелоксикам, онсиор, превикокс)</li><li class=\"em\">❌ не отсасывать яд, не делать надрезы и не накладывать жгут! — в этих случаях выше вероятность развития инфекции!</li></ul>\n<h2 id=\"t2\">Что делать</h2>\n<ul><li class=\"em\">✅ минимизировать стресс и движения животного</li><li class=\"em\">✅ ехать в клинику</li></ul>\n<p>В клинике должны сделать антизмеиную сыворотку, которая в России продается в аптеках и стоит 500 руб. О том, есть ли в клинике сыворотка, нужно узнать заранее!</p>\n<p>Также вы можете купить эту сыворотку сами, если едете с собакой куда-то далеко на лето и точно знаете, что к врачу попасть не сможете.</p>\n<p>Сыворотку в клинике вводят внутривенно, но, в крайнем случае, если именно вам потребуется вводить сыворотку самостоятельно, можно это сделать внутримышечно или подкожно.</p><p class=\"src\">Источник: канал Dog’n’Fox, <a href=\"https://t.me/dognfox/16712\" target=\"_blank\" rel=\"noopener\">t.me/dognfox/16712</a></p>"
},
{
"id": "pamyatka-zhara",
"sec": "pervaya-pomosh",
"sub": "Жара и холод",
"author": "antipina",
"type": "Памятка",
"img": "img/m/zhara.webp",
"title": "Памятка на жаркую погоду",
"lead": "Горячий асфальт, прогулки, вода, машина, охлаждение и намордник: как помочь собаке пережить жару без перегрева.",
"html": "<ul>\n<li>Выбираем холодные поверхности — земля, трава. Асфальт и песок на солнце горячие. Если собака маленькая, перегрев наступает ещё быстрее. Также в особой зоне риска щенки и старики (терморегуляция другая), брахицефалы, собаки с тёмной шерстью. Как проверить, насколько асфальт горячий: трогаем ладонью, держим руку 10 сек. Помните, что собака идёт по асфальту без обуви — ей жарче</li>\n<li>Время для прогулок — утро и вечер, до наступления жары. Днём — гигиенические прогулки (в туалет на 5–10 мин). Держимся в тени</li>\n<li>Не оставляйте собаку в машине одну. При температуре 24 градуса на улице за считаные минуты салон авто нагревается до 40 градусов. Даже если машина в тени, разница будет незначительной. Всего 5 минут — и тепловой удар. 20 минут — и собака погибает</li>\n<li>С собой всегда берите воду для собаки. Есть специальные бутылочки-поилки, или можно использовать складные силиконовые миски. Предлагайте воду чаще. На жаре собака дышит ртом, чтобы охладиться, горло быстро пересыхает. Не поите собаку ледяной водой (чревато спазмами и другими проблемами с внутренними органами)</li>\n<li>Можно мочить водой подмышки, живот, уши, лапы. Не лить воду на голову и спину собаки</li>\n<li>Если собака идёт плавать самостоятельно — ок, но регулируйте скорость захода в воду. Если не идёт — не закидывайте её в водоём. Резкая смена температуры тела опасна, вплоть до остановки сердца</li>\n<li>Не стригите мохнатую собаку слишком коротко. Шерсть выполняет защитную функцию, от солнца в том числе. Вычёсывайте подшёрсток</li>\n</ul>\n<h2 id=\"h1\">Охлаждение</h2>\n<p>Можно (некоторым собакам прямо необходимо) использовать:</p>\n<ul><li>охлаждающие попоны (проверяйте периодически ладонью температуру тела собаки под попоной)</li><li>охлаждающие коврики (выбирайте гелевые: они имеют небольшую разницу температуры с воздухом, так собака не застудится, но сможет охладиться)</li></ul>\n<h2 id=\"h2\">Намордник</h2>\n<p>Если собака ходит в наморднике, одно правило (не только для жаркой погоды): намордник должен быть удобным.</p>\n<ul><li>свободный (можно открыть пасть, чтобы подышать, высунув язык, и попить)</li><li>лёгкий (лучше всего подходит каучук или пластик)</li><li>медицинский намордник не для улицы, его используют только в клинике и только на короткое время</li></ul>"
},
{
"id": "pamyatka-zima",
"sec": "pervaya-pomosh",
"sub": "Жара и холод",
"author": "antipina",
"type": "Памятка",
"img": "img/m/zima.webp",
"title": "Памятка на зиму",
"lead": "Как понять, что собака замерзает, кто в зоне риска и как помочь не замёрзнуть. Плюс первая помощь при переохлаждении и обморожении.",
"html": "<h2 id=\"z1\">Признаки того, что собака замерзает или замёрзла</h2>\n<ul><li>Холодные уши</li><li>Холодная мордочка</li><li>Поджимание лапок по одной</li><li>Дрожь</li><li>Поскуливание</li><li>Ускорение в движении (пытается согреться)</li><li>Если собака не просто замёрзла, а уже произошло переохлаждение, то она будет замедляться</li></ul>\n<h2 id=\"z2\">Кто в зоне риска</h2>\n<ul><li>Щенки и старики — терморегуляция ещё не та или уже не та</li><li>Собаки с определённым типом шерсти (без подшёрстка, йорки и т. п.), собаки без шерсти (ксоло, китайская хохлатая). Кстати, слышала миф, что ксоло не мёрзнут, потому что у них температура тела выше, но на самом деле чем больше разница температур с окружающей средой, тем сильнее ощущается холод</li><li>Маленькие собаки (тело ближе к снегу и льду)</li></ul>\n<h2 id=\"z3\">Как помочь не замёрзнуть</h2>\n<ul><li>Тёплая одежда. Важен крой — максимально не мешающий движению собаки и закрывающий все крупные мышцы (спина, грудь, бёдра). Бывают комбинезоны, жилетки, попоны. Попоны обычно заходят тем, кто не переносит остальные виды одежды</li><li>Для особо мерзлявых на уши можно надевать снуд (он не должен прижимать уши)</li><li>Воск для лапок защищает не только от реагентов, но и от холода</li><li>Некоторые собаки способны носить обувь, но к этому способу я отношусь очень осторожно: любая одежда и обувь будут менять движения собаки, особенно будьте внимательны к тому, насколько скользко собаке в обуви</li><li>Дополнительная физическая активность на прогулке, если не скользко под лапами, позволяет здоровье ОДА и собака не зацикливается на палках и мячах. В качестве активности может быть игра с сородичами, игра с человеком, лёгкая пробежка, апортировка (кинули 1–2 раза апорт, отдохнули несколько минут)</li><li>В особые морозы сокращаем время на улице и балансируем нагрузкой дома</li></ul>\n<h2 id=\"z4\">Переохлаждение и обморожение</h2>\n<p>Что делать при переохлаждении и обморожении — страницы из гайда «Первая помощь» доктора Натальи Федосеевой:</p>\n<div class=\"gallery\"><a href=\"img/a/pereohlazhdenie.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a/pereohlazhdenie.webp\" alt=\"Переохлаждение\" loading=\"lazy\"></a><a href=\"img/a/obmorozhenie.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a/obmorozhenie.webp\" alt=\"Обморожение\" loading=\"lazy\"></a></div>\n"
},

"id": "vrednye-produkty",
"sec": "pervaya-pomosh",
"sub": "Отравления",
"author": "antipina",
"type": "Памятка",
"img": "img/m/vrednye.webp",
"pdf": "pdf/vrednye-produkty.pdf",
"title": "Вредные и опасные продукты для собак",
"lead": "Лук, чеснок, виноград, шоколад, макадамия, дрожжевое тесто, соль и другие: что нельзя давать собаке и почему.",
"html": "<p>В памятке разобрано, чем опасен каждый продукт и сколько нужно, чтобы навредить собаке. Несколько примеров:</p>\n<ol class=\"steps\"><li><b>Лук репчатый</b>Содержит вещество, которое разрушает красные кровяные тельца, вызывая анемию у собак и кошек. Даже небольшого количества хватает для токсического воздействия. Это касается репчатого и зелёного лука в любом виде: сыром, сушёном или варёном. Доедание собаками шашлыков на майские опасно луком в том числе!</li><li><b>Виноград и изюм</b>Свежий или сушёный виноград повреждает почки у собак. Всего 3 г изюма на каждый кг веса собаки могут вызвать отравление, рвоту, боли в животе и диарею. Способа определить, насколько ваша собака восприимчива, нет, поэтому кормить виноградом строго запрещено.</li><li><b>Шоколад</b>Содержит ксантиновые алкалоиды. Чем меньше собака, тем острее ситуация: для собаки 15 кг критически опасны около 100 г горького шоколада.</li><li><b>Дрожжевое тесто</b>Может подняться прямо в желудке, вызвать боль и вздутие, а при брожении образуется алкоголь.</li></ol>\n<p>Полный список с объяснениями откройте в PDF.</p>"
},
{
"id": "aptechka-sostav",
"sec": "aptechka",
"author": "antipina",
"type": "Список",
"img": "img/m/aptechka.webp",
"title": "Аптечка для собаки: что положить",
"lead": "Препараты, инвентарь и техники помощи при ранах, аллергии, отравлениях и рвоте.",
"html": "<p class=\"note\">Дозы в списке ориентировочные. Перед тем как давать собаке любой препарат, согласуйте дозу с ветеринарным врачом.</p>\n<h2 id=\"ap1\">Часть 1: препараты</h2>\n<h4>Растворы для промывания ран (использовать один из препаратов)</h4>\n<ul><li>хлоргексидин 0,05%</li><li>мирамистин</li><li>фурацилин</li></ul>\n<h4>Кровоостанавливающие средства (при кровотечениях)</h4>\n<ul><li>перекись водорода 3%</li><li>капрамин — для остановки капиллярного кровотечения при повреждении когтей</li><li>гемостатический порошок (например, Статин, останавливает в том числе капиллярные кровотечения)</li></ul>\n<h4>Антигистаминные средства (при аллергических реакциях, доза 1 мг/кг, использовать один из препаратов)</h4>\n<ul><li>цетрин</li><li>зодак</li><li>зиртек</li></ul>\n<p>При сильных аллергических реакциях, инъекционные: преднизолон (в таблетке 5 мг, на каждые 5 кг веса давать по 1 таблетке). При анафилактическом шоке: адреналин (0,02 мг/кг).</p>\n<h4>При отравлениях — сорбенты</h4>\n<p>Полисорб или энтеросгель, можно энтерозоо (ветеринарный препарат), смекта (при диареях).</p>\n<h4>Другие средства</h4>\n<ul><li>Жаропонижающее: мелоксикам в инъекциях, 10 мг/мл</li><li>Противоожоговое: Пантенол спрей или пенка</li><li>Офтальмологические (для промывания при травмах глаз): физраствор (раствор натрия хлорида), флокасол</li><li>Антидоты: к изониазиду — пиридоксина гидрохлорид; к зоокумарину — фитоменадион (витамин К1)</li><li>Противорвотное: маропитант (серения/маропиталь), ондансетрон (латран). Внимание: церукал не является противорвотным средством у собак!</li><li>Ранозаживляющее: левомеколь, банеоцин</li><li>Антипротозойное: пиростоп — в случае укуса клеща и подозрения на пироплазмоз</li></ul>\n<h2 id=\"ap2\">Часть 2: инвентарь</h2>\n<ul><li>термометр (лучше электронный)</li><li>одноразовые шприцы 1, 2, 3, 5, 10, 20 мл</li><li>стерильные перчатки</li><li>марлевые салфетки, ватные диски, бинты (перевязочный материал)</li><li>выкручиватель клещей</li><li>таблеткодаватель</li><li>набор для внутривенной катетеризации: катетеры всех размеров, жгут, бритва или машинка для забривания шерсти, тонкий лейкопластырь для фиксации катетера, бинт-флекс для закрытия катетера</li><li>инструменты: ножницы изогнутые и прямые</li><li>охлаждающий элемент</li></ul>\n<h2 id=\"ap3\">Часть 3: техники помощи</h2>\n<h4>Поверхностные раны</h4>\n<p>Промыть хлоргексидином или раствором натрия хлорида 0,9%. Заложить ранозаживляющую мазь — левомеколь, пантенол, банеоцин.</p>\n<h4>Аллергическая реакция</h4>\n<p><b>Признаки:</b> зуд, расчёсы, пятна, волдыри, пузыри, сыпь, покраснения глаз и носа, затруднённое дыхание, одышка, свистящий звук при вдохе, хрипы, удушье, кашель, чихание, рвота, понос, сонливость, судороги, потеря сознания, лихорадка.</p>\n<p><b>Пути попадания аллергенов:</b> контактный (контакт кожи с внешними факторами), трансмиссивный (укусы насекомых, змей), алиментарный или пищевой, ингаляционный (через дыхательные пути).</p>\n<p><b>Первая помощь:</b></p>\n<ul><li>устранить воздействие аллергена, если это возможно</li><li>цетрин 10 мг в таблетке на каждые 5 кг веса животного два раза в день</li><li>преднизолон 5 мг в таблетке, по 1 таблетке на каждые 5 кг веса</li><li>зодак или зиртек — 2 капли на 1 кг массы тела</li></ul>\n<h4>Пищевые расстройства</h4>\n<p><b>Адсорбенты при поносах:</b></p>\n<ul><li>полисорб внутрь 2–3 раза в день за 30 минут до кормления, 5–7 дней</li><li>энтеросгель внутрь за 30 минут до кормления 2–3 раза в день</li><li>энтерозоо внутрь 2–3 раза в день, 5–7 дней</li><li>смекта: 1 пакетик на 100 мл тёплой воды, 1–2 мл раствора на 1 кг массы, в рот 2–5 раз в день</li></ul>\n<p><b>При рвоте:</b> серения/маропиталь 0,1 мл/кг подкожно с интервалом 24 часа; латран (ондансетрон) 0,5 мг/кг внутримышечно.</p>\n<h4>Отравления изониазидом и зоокумаринами</h4>\n<ul><li>Изониазид: вызвать рвоту (перекись водорода 10 мл/кг массы тела размешать с водой, влить в пасть) и сделать инъекцию пиридоксина в/м или п/к 0,7 мл на каждый кг веса</li><li>Зоокумарины: вызвать рвоту, инъекции К1 — 1 мл на 2 кг веса</li></ul>\n"
},
{
"id": "dogfrendli-dom",
"sec": "adaptaciya",
"author": "antipina",
"type": "Статья",
"img": "img/m/dogfriendly.webp",
"title": "Догфрендли дом",
"lead": "Как обустроить пространство, в котором собаке комфортно: безопасность, контроль над телом, возможность исследовать и сенсорный комфорт.",
"html": "<p>Поведение собаки напрямую связано с её окружением. Страхи, агрессия, повышенная эмоциональная возбудимость, «непослушание» — это часто не характер и не упрямство, а реакция на неудобную, перегружающую или небезопасную среду. Собака, как и человек, чувствует себя спокойнее и устойчивее, когда её окружают предсказуемость, безопасность, контроль над телом и возможностями.</p>\n<h2 id=\"df1\">1. Безопасность и предсказуемость</h2>\n<ul>\n<li class=\"em\">🔐 <b>Уединённое место для отдыха</b> (не в проходах, не у входных дверей, без сквозняков). Особенно важно в доме с детьми, другими животными или высокой активностью людей</li>\n<li class=\"em\">🛋️ <b>Место отдыха на возвышенности</b> (кресло, кровать, диван и даже подоконник, если собака выбирает. Конечно, в случае с подоконником его необходимо дополнительно обустроить)</li>\n<li class=\"em\">🛟 <b>Место безопасности.</b> Одно из основных мест отдыха, где собаку никто и никогда не заставляет что-то делать, не проводит никаких манипуляций, не вытаскивает оттуда силком. Да, можно уговаривать и выманивать, но не вытаскивать из места безопасности силой</li>\n<li class=\"em\">🪜 <b>Удобный пандус, лесенка или ступенька</b> для безопасного подъёма и спуска — это особенно важно для маленьких, пожилых, «длинных» собак и щенков</li>\n<li class=\"em\">😴 <b>Социальный сон</b> — возможность спать рядом или в одном помещении с человеком или другим значимым социальным партнёром</li>\n<li class=\"em\">🧊 <b>Не скользкий пол!</b> Не устану говорить, что скользкий пол — отличная основа для разной степени травм, развития неврозов, ранних заболеваний суставов. Плитка, ламинат, кварцвинил, паркет — всё это очень скользко для собак (и котов тоже). Добавьте ковры, нескользящие дорожки. Сейчас представлено огромное разнообразие вариантов</li>\n<li class=\"em\">🍲 <b>Еда</b> — в спокойной обстановке, без команд, выдержки, отзыва от миски и рук в миске. Сами миски должны стоять там, где никто не будет мешать, ходить мимо, задевать собаку, пока она ест. Ещё сюда же — ежедневная гигиена мисок и всегда чистая вода в доступе. А ещё лучше, если вода будет стоять в нескольких помещениях, а не в одном</li>\n<li class=\"em\">🕰 <b>Рутина и стабильный режим</b>, баланс нагрузки и отдыха с учётом индивидуальных особенностей, возраста, здоровья собаки</li>\n<li class=\"em\">🤬 <b>Атмосфера без крика, наказаний, частых ссор между людьми.</b> Хронический бытовой стресс — причина многих поведенческих и физиологических проблем</li>\n</ul>\n<h2 id=\"df2\">2. Контроль над собственным телом</h2>\n<ul>\n<li class=\"em\">❌ Собака не обязана терпеть прикосновения, если она не хочет, — даже от членов семьи. Подробнее об этом в материале <a href=\"#/m/kommunikaciya\">«Коммуникация человека с собакой»</a></li>\n<li class=\"em\">🚪 Возможность уйти от взаимодействия — спрятаться, лечь в покое, удалиться в другую комнату</li>\n<li class=\"em\">👀 Уважение к зонам отдыха и личным границам — не трогать, не гладить, не отвлекать без причины</li>\n<li class=\"em\">🗽 Свобода перемещений. Да, мы можем и должны убрать из зоны доступа собаки опасное и ценное. При необходимости можем даже исключить целую комнату из её доступа или воспользоваться детскими воротами безопасности. Но нельзя запирать собаку в клетку «ради её безопасности»</li>\n<li class=\"em\">💩 Возможность сходить в туалет чаще, чем 2 раза в день, — особенно актуально для щенков, пожилых, маленьких, болеющих собак</li>\n</ul>\n<h2 id=\"df3\">3. Возможность исследовать</h2>\n<p>🔍 <b>Обогащение среды:</b></p>\n<ul><li>картонные коробки</li><li>«игра в таможню» с совместной распаковкой покупок</li><li>самодельные тоннели</li><li>«ревизия» вещей из ящиков и полок</li><li>наблюдательные точки — место у окна, балкона (подходит не всем собакам)</li><li>площадки для свободного наблюдения</li></ul>\n<p>🍖 Игрушки для грызения, лизания, добывания, поиска (натуральные, самодельные, покупные).</p>\n<p>🧸 <b>Игры, в которые нравится играть именно вашей собаке:</b></p>\n<ul><li>поиск дома или на прогулке</li><li>ленивые, мягкие перетяжки</li><li>догонялки с человеком</li><li>просто таскать любимую игрушку по дому — тоже вариант</li></ul>\n<h2 id=\"df4\">4. Сенсорный комфорт</h2>\n<ul>\n<li class=\"em\">💡 Мягкий, тёплый свет — особенно вечером. Ночь = тишина и темнота, насколько это возможно</li>\n<li class=\"em\">✨ Чистый воздух: без освежителей, спреев, парфюма. Обоняние — главный сенсор у собаки, оно чувствительнее в десятки раз, чем у нас</li>\n<li class=\"em\">🔊 Минимум резких и громких звуков. Отключите сигналы оповещения на бытовой технике везде, где это возможно</li>\n</ul>\n<blockquote>Итого: подходящая собаке окружающая среда — это не избалованность, а терапия, профилактика и база для устойчивого поведения. Она помогает телу, нервной системе и психике работать гармонично. А это основа для счастливой жизни вместе, хороших отношений и обучения.</blockquote>\n"

"id": "deti-i-sobaki-otvetstvennost",

"title": "Любая собака может укусить: дети и ответственность взрослого",
"lead": "Почему собаки кусают детей, каким сигналам научить ребёнка и почему безопасность всегда на взрослом.",
"html": "<h2 id=\"d1\">Чтобы собака не укусила ребёнка</h2>\n<p>Любая собака может укусить!</p>\n<p>Нет собак, которые не кусаются — есть те, которых ещё не довели до этой реакции. И хорошо, если никогда не доведут, но так бывает, увы, не всегда.</p>\n<p>Собаки кусают потому, что другие их предупреждающие сигналы не учитываются и игнорируются. Особенно — детьми. Если взрослый, даже не обладая знанием языка тела собаки, интуитивно может прочитать её сигналы как угрожающие в какой-то момент, то дети этого делать не умеют. Их нужно обучать быть:</p>\n<ul><li>внимательными</li><li>бережными и аккуратными по отношению к собаке</li></ul>\n<p>Это так важно😭</p><div class=\"gallery\"><a href=\"img/a3/dognfox_13201-1.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a3/dognfox_13201-1.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a3/dognfox_13201-2.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a3/dognfox_13201-2.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a3/dognfox_13201-3.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a3/dognfox_13201-3.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a3/dognfox_13201-4.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a3/dognfox_13201-4.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a3/dognfox_13201-5.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a3/dognfox_13201-5.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a3/dognfox_13201-6.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a3/dognfox_13201-6.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a3/dognfox_13201-7.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a3/dognfox_13201-7.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a3/dognfox_13201-8.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a3/dognfox_13201-8.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a3/dognfox_13201-9.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a3/dognfox_13201-9.webp\" alt=\"\" loading=\"lazy\"></a></div>\n<h2 id=\"d2\">Взросление рядом с животным в семье</h2>\n<p>Захотелось написать какой-то добрый пост про животных и детей. Но тут не обойдётся одной добротой, потому что всегда есть обратная сторона у фразы «пусть дети растут с животными, это полезно» :)</p>\n<p>Сколь часто мы видим, как дети обнимают собак слишком крепко, ложатся на них, тянут за уши, садятся сверху. И взрослые в этот момент улыбаются, снимают видео, говорят: «Смотри, как он её любит!».</p>\n<p>Любовь ребёнка это не ответственность.  Ответственность всегда принадлежит взрослому!</p>\n<p>Дети только учатся жить в этом мире. Они не знают, что неподвижность собаки может быть не спокойствием, а замиранием, и что отвёрнутая голова и зевок это просьба о дистанции.</p>\n<p>Задача взрослого видеть это и постепенно, по мере взросления ребёнка, объяснять ему все собачьи и кошачьи сигналы.</p>\n<p>Животное никогда не должно терпеть дискомфорт, чтобы ребёнок научился чему-то или получил свою детскую радость неприятным для животного образом.</p>\n<p>И ребёнок никогда не должен нести полную ответственность за животное! Безопасность и ребёнка, и животных в доме полностью зависит от решений взрослого.</p>\n<p>Наша роль — объяснять детям, что чувствует животное. Показывать, когда можно подойти, а когда лучше остановиться. Учить не только любви, но и уважению. А научить мы этому можем, только если сами это знаем!</p>\n<p>Самые безопасные отношения между ребёнком и животным возникают там, где рядом есть взрослый, который умеет понимать обоих.</p><div class=\"gallery\"><a href=\"img/a3/dognfox_15877-1.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a3/dognfox_15877-1.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a3/dognfox_15877-2.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a3/dognfox_15877-2.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a3/dognfox_15877-3.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a3/dognfox_15877-3.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a3/dognfox_15877-4.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a3/dognfox_15877-4.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a3/dognfox_15877-5.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a3/dognfox_15877-5.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a3/dognfox_15877-6.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a3/dognfox_15877-6.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a3/dognfox_15877-7.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a3/dognfox_15877-7.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a3/dognfox_15877-8.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a3/dognfox_15877-8.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a3/dognfox_15877-9.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a3/dognfox_15877-9.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a3/dognfox_15877-10.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a3/dognfox_15877-10.webp\" alt=\"\" loading=\"lazy\"></a></div><p class=\"src\">Источник: канал Dog’n’Fox, <a href=\"https://t.me/dognfox/13201\" target=\"_blank\" rel=\"noopener\">t.me/dognfox/13201</a></p>"

"id": "vneshnie-parazity",
"sec": "obrabotki",
"author": "shmakova",
"type": "Гайд и мифы",
"img": "",
"title": "Обработки от блох и клещей: гайд и 10 мифов",
"lead": "Когда начинать обрабатывать, чем отличаются формы препаратов и 10 мифов, из-за которых собака остаётся без защиты.",
"html": "<p>Друзья, с приходом тепла как никогда актуальна тема обработки от блох и клещей</p>\n<p>Укус паразита — это не только зуд и раздражение, но и постоянный дискомфорт, влияющий на поведение собаки..молчу о возможных серьезнейших <a href=\"https://www.svoydoctor.ru/vladeltsam/poleznoe/stati/chem-blokhi-i-kleshchi-zarazhayut-sobak/\" target=\"_blank\" rel=\"noopener\">заболеваниях,</a> переносчиками которых являются внешние паразиты.</p>\n<p>Пока я учусь на курсе ветеринарии, я структурировала всю самую свежую и научную информацию о защите от внешних паразитов в удобный  для своих клиентов и читателей канала.</p>\n<p>Что внутри?</p>\n<ul><li>Когда реально начинать обрабатывать (даже если за окном ещё снег?)</li><li>Формы препаратов: в чем отличие с точки зрения ветеринарии</li><li>Как подобрать защиту и остаться без нежелательных друзей</li></ul>\n<p>Этот гайд — выжимка из лекции по противопаразитарным обработкам, которой я хочу поделиться с вами, чтобы ваши хвостики были здоровы и спокойны</p>\n\n<div class=\"linkset\"><a href=\"https://disk.yandex.ru/i/UBMpjqU6H5E1BA\" target=\"_blank\" rel=\"noopener\"><b>Гайд «Внешние паразиты»</b><span>PDF, Яндекс Диск</span><i>↗</i></a></div>\n<h2 id=\"o2\">10 мифов об обработке</h2>\n<h4>Миф №1: «Главное – защита от клещей, остальное неважно»</h4>\n<p>Кроме иксодовых клещей существуют власоеды, подкожные и ушные клещи, блохи. Они вызывают дерматиты, аллергии, облысение и сильный зуд. Защита должна быть комплексной – от всех внешних паразитов.</p>\n<h4>Миф №2: «Бравекто раз в 3 месяца = полная защита»</h4>\n<p>Срок действия Бравекто – 12 недель (84 дня). Очень важно, что раз в 3 месяца мы оставляем \"слепое окно\" на 6-8 дней, когда собака беззащитна перед клещами, поэтому крайне важны доп обработки спреями.</p>\n<h4>Миф №3: «Таблетки достаточно, чтобы защититься»</h4>\n<p>При использовании таблеток паразиты погибают только после(!) укуса. Т.е. собака может принести клеща на шерсти в дом, лечь с ним в кровать, пока он не присосется, это несёт большую угрозу. В купе с таблеткой всегда используем и контактную обработку (спреи), которые отпугнут паразита на стадии запрыгивания на питомца.</p>\n<h4>Миф №4: «Я не вижу паразитов – значит их нет»</h4>\n<p>Блохи не живут на собаке постоянно, они приходят только кусать. А подкожные клещи не видны глазу. Отсутствие видимых паразитов не равно их отсутствию, об этом есть подробнее в гайде в посте выше</p>\n<h4>Миф №5: «Зимой можно отдыхать от обработок»</h4>\n<p>Блохи зимуют в подвалах и подъездах круглый год. Клещи просыпаются при +3...+5°C. В городах зимой бывают оттепели – пироплазмоз регистрируют даже в январе.</p>\n<h4>Миф №6: «Ошейник от блох – это удобно и надежно»</h4>\n<p>Ошейник работает только при прилегании к коже(!). На пушистых собаках он часто бывает не так эффективен как кажется на первый взгляд.</p>\n<h4>Миф №7: «Капли действуют сразу после нанесения»</h4>\n<p>Капли распределяются по коже в среднем минимум 48 часов. В эти дни нельзя мочить собаку, купать, гулять под дождем. Только через 2-3 суток наступает полная защита.</p>\n<h4>Миф №8: «Можно искупать собаку сразу после капель – ничего страшного»</h4>\n<p>Шампуни смывают защитный жировой слой с препаратом. Эффективность падает на 50–70%. Не мойте собаку 3 дня до и 3 дня после обработки каплями.</p>\n<h4>Миф №9: «Разделю таблетку на большое количество мг на нескольких мелких собак – сэкономлю»</h4>\n<p>Таблетки нельзя делить! Вещество распределено неравномерно: одна собака получит передозировку, другая – ноль защиты. Каждой собаке – своя дозировка по весу.</p>\n<h4>Миф №10: «Мы не гуляем в лесу – клещи не страшны»</h4>\n<p>Клещи сидят в траве на высоте 20-50 см и цепляются за шерсть. Городские собаки болеют пироплазмозом не реже тех, кто живёт загородом.</p><p class=\"src\">Источник: канал «Пёсика: заметки зоопсихолога», <a href=\"https://t.me/psypesika/134\" target=\"_blank\" rel=\"noopener\">t.me/psypesika/134</a></p>"
},

"title": "«Какой ты кинолог, если твоя собака…»",
"lead": "Почему собака специалиста не обязана быть его рекламой и по чему на самом деле стоит оценивать кинолога.",
"html": "<p>…лает, тянет поводок, подбирает с земли, не подходит по команде?</p>\n<p>И правда.</p>\n<p>Вот у меня, например, Бусинка вполне может подобрать с земли что-нибудь вкусное. И нет, наличие у меня образования не делает найденную еду менее привлекательной.</p>\n<p>Зима, когда перевозбуждается, может орать на других собак. Именно орать. Громко и эмоционально.</p>\n<p>Лето не любит общаться с людьми. И я не собираюсь делать из него душу компании, чтобы кому-то доказать свою профессиональную состоятельность.</p>\n<p>А хаси...</p>\n<p>Хаси, кажется, вообще не знают, что я кинолог. Иногда у меня есть подозрение, что они не знают даже о моём существовании.</p>\n<p>В общем, можете забирать мои сертификаты и дипломы.</p>\n<p>Почему-то существует убеждение, что собака кинолога должна быть ходячей демонстрацией его профессиональных навыков...</p>\n<p>...Чтобы поводок провисал, подзыв был железобетонным, мимо собак проходила с лицом буддийского монаха, а найденную на земле куриную кость брезгливо обходила за три метра.</p>\n<p>И желательно, чтобы всё это происходило само собой. Просто потому, что хозяин — кинолог.</p>\n<p>Но вот какая штука -</p>\n<p>мои собаки не обязаны работать моей рекламой.</p>\n<p>Я знаю, почему Бусинка интересуется едой на земле. Я понимаю, что происходит с Зимой в момент перевозбуждения. Я уважаю нежелание Лето общаться с посторонними людьми.</p>\n<p>А с хасями у нас свои договорённости.</p>\n<p>И да, я работаю с тем поведением, которое влияет на безопасность, благополучие собак и окружающих.</p>\n<p>Но я не собираюсь исправлять всё подряд только потому, что кому-то со стороны кажется, что \"у кинолога такого быть не должно\".</p>\n<p>Мне вообще кажется странной сама идея, что профессионализм специалиста определяется отсутствием у его собак нежелательного поведения.</p>\n<p>Знания о поведении не отменяют темперамент, породные особенности, индивидуальный опыт, физиологию и эмоциональные реакции.</p>\n<p>У кинолога нет секретного пульта дистанционного управления своей собакой.</p>\n<p>Можно научить собаку очень многому.</p>\n<p>Но уметь научить и считать необходимым научить — две совершенно разные вещи.</p>\n<p>Я думаю, люди слишком часто оценивают кинологов по тому, насколько удобны их собаки. А я бы оценивала по тому, понимает ли специалист свою собаку. Замечает ли, когда ей трудно. Умеет ли помочь. Способен ли организовать среду так, чтобы не создавать проблем ни собаке, ни окружающим.</p>\n<p>И может ли позволить своей собаке быть собакой.</p>\n<p>Так что да:</p>\n<p>Бусинка может подобрать еду, Зима может наорать,  Лето может не захотеть с вами знакомиться. А Винни и Пряня могут продолжить делать вид, что меня нет.</p>\n<p>И мне совершенно не стыдно за то, что мои собаки — живые собаки.</p>\n<p>А вот за представление о том, что хорошая собака обязана быть удобной всегда и для всех, мне иногда бывает неловко.</p>\n<p>Особенно когда его транслируют сами кинологи.</p><p class=\"src\">Источник: канал «В партнёрстве с собакой», <a href=\"https://t.me/withadog/71\" target=\"_blank\" rel=\"noopener\">t.me/withadog/71</a></p>"
},

"id": "marker-i-kliker",
"sec": "vospitanie",

"author": "galimova",
"type": "Статья",

"title": "Подкрепление, маркер и кликер: что это такое",
"lead": "Что считается подкреплением, зачем нужен маркер и как правильно пользоваться кликером.",
"html": "<p>В речи специалистов и собачников часто мелькают такие слова, как “подкрепление”, “маркер” и “кликер”. Давайте разберемся, что это такое</p>\n<p>Согласно теории оперантного научения (привет, Скиннер) эффективные и приносящие желаемый результат действия используются всё чаще.</p>\n<p>Бесполезные же со временем отбрасываются, не используются.</p>\n<h2 id=\"t1\">Подкрепление. С чем его едят?</h2>\n<p>Интересно, что подкреплением является не только еда.</p>\n<p>Что еще? Все, что хочет конкретная собака в данный момент. Понюхать кустик, подойти к собачке, поскорее открыть дверь - они хотят миллион всего и мы это используем. Хотя еда и игра тоже работают отлично, а, главное, просто. А если эти мотивации поломались, то можно найти причины и “настроить” их.</p>\n<h2 id=\"t2\">Что такое маркер?</h2>\n<p>Просто информация. Так мы сообщаем, в какой именно момент собака была молодец.</p>\n<p>Зачем он вообще нужен? С ним проще. Например, мы хотим выработать поведение посадки. Собака села мы полезли в карман, нашуршали пакетиком  она вскочила и в момент, когда мы лакомство выдали, успела сделать сто действий. Вместо посадки закрепилось последнее (подпрыгивание).</p>\n<p>Или закрепилась цепочка: села подпрыгнуланям. Далеко не то, что мы хотели.</p>\n<p>Маркер в этом плане сильно упрощает нам жизнь. Он служит той самой лампочкой Павлова, условным сигналом: когда дадут зарплату и за что именно.</p>\n<h2 id=\"t3\">Итак, что такое кликер?</h2>\n<p>Это и есть наш маркер.</p>\n<p>Точнее, условным сигналом становится щелчок кликера/короткое слово.</p>\n<h2 id=\"t4\">Как использовать?</h2>\n<p>Все просто!</p>\n<p>Клик в момент правильного поведения, а затем награда.</p>\n<p>Чтобы маркер закрепился, нужно некое количество повторений клик=ням.</p>\n<p>Чтобы щелчок не терял свою ценность и значимость, один клик=одна нямка.</p>\n<p>А еще после каждого клика всегда следует ням в 100% случаев. Если щелкнули не вовремя, нямку все равно придется выдать, а в следующий раз быть внимательнее 👌🏻</p><div class=\"gallery\"><a href=\"img/a3/aleydog_31-1.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a3/aleydog_31-1.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a3/aleydog_31-2.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a3/aleydog_31-2.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a3/aleydog_31-3.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a3/aleydog_31-3.webp\" alt=\"\" loading=\"lazy\"></a><a href=\"img/a3/aleydog_31-4.webp\" target=\"_blank\" rel=\"noopener\"><img src=\"img/a3/aleydog_31-4.webp\" alt=\"\" loading=\"lazy\"></a></div><p class=\"src\">Источник: канал «ваш кинолог ALEYHAB», <a href=\"https://t.me/aleydog/31\" target=\"_blank\" rel=\"noopener\">t.me/aleydog/31</a></p>"

"id": "kak-rabotaet-povedenie",

"title": "Как работает поведение собаки и как его изменить",
"lead": "Поведение, которое приносит результат, закрепляется. Разбор на примерах: собака рвётся в дверь и тянет поводок.",
"html": "<p>На примерах: собака тянет поводок, возбуждается и рвётся на прогулку</p>\n<p>Очень просто:</p>\n<p>Поведение, которое приносит желаемый результат — закрепляется.</p>\n<p>Поведение, которое не приносит — со временем исчезает.</p>\n<p>Собака делает что-то?</p>\n<p>Подумайте: \"что она получает за это?\"</p>\n<p>Даже если поведение неудобное для вас — оно работает для неё!</p>\n<p>Задача — изменить ситуацию:</p>\n<ul><li>чтобы поведение не приводило к цели,</li><li>чтобы цель можно было достигнуть по-другому,</li><li>или чтобы и вовсе не было нужды вести себя так (менеджмент).</li></ul>\n<p>Собака рвётся в дверь.</p>\n<p>Хочет побыстрее выйти.</p>\n<p>Дверь открывается — поведение закрепляется.</p>\n<p>Альтернатива: открываем дверь, когда собака спокойна.</p>\n<p>Менеджмент: меньше суеты перед выходом, собираемся, когда собака расслаблена.</p>\n<p>Собака тянет поводок.</p>\n<p>Хочет быстрее дойти до интересного.</p>\n<p>Натянула — пошли вперёд. Поведение закрепилось.</p>\n<p>Альтернатива: идём, когда поводок провис.</p>\n<p>Менеджмент: комфортная шлейка, длинный поводок, спокойные маршруты.</p>\n<p>Чем комфортнее и безопаснее чувствует себя собака — тем меньше нужды тянуть.</p>\n<p>Важно менять не только само поведение, но и среду, в которой оно возникает</p><p class=\"src\">Источник: канал «ваш кинолог ALEYHAB», <a href=\"https://t.me/aleydog/109\" target=\"_blank\" rel=\"noopener\">t.me/aleydog/109</a></p>"

"html": "<p>Мы уже разобрались, как работают наказание и подкрепление. А как работает принцип бабушки? 👵🏻</p>\n<p>Он основан на подкреплении менее желаемого поведения более желаемым поведением. По мнению собаки, естественно. Запутались? Давайте разбираться.</p>\n<p>Бабушка хочет, чтобы вы съели суп. Вы не хотите суп, но хотите конфетку. Тогда она предлагает вам “съешь суп - получишь конфетку”. Вы соглашаетесь, так как суп не такая уж большая цена за столь желаемую конфету.</p>\n<p>То есть вы осуществили менее желаемое вами поведение (съесть суп), ради более желаемого (съесть конфетку). Всем выгодно, вы и бабушка в итоге добились того, чего хотели 😏</p>\n<p>Вернемся к собакам —&gt; листай карусель</p><div class=\"linkset\"><a href=\"https://www.instagram.com/p/Cpezu6qIR99/\" target=\"_blank\" rel=\"noopener\"><b>Листать карусель в Instagram</b><span>продолжение с картинками</span><i>↗</i></a></div>"

ка не слушается на улице</h2>\n<p>Возможные причины, почему собака не хочет есть лакомство и взаимодействовать с вами на прогулках:</p>\n<ul><li>незакрытые базовые потребности</li><li>проблемы со здоровьем</li><li>неподходящее состояние</li><li>слишком сложная обстановка</li><li>проблемы с питанием или лакомство не имеет ценности</li><li>прогулка перегружена требованиями</li><li>владелец постоянно конкурирует с тем, что на самом деле хочет собака</li><li>человеку не хватает ясности и понимания, как выстраивать тренировку и объяснять задачи</li><li>собаке не интересно и скучно с хозяином</li></ul>\n<div class=\"linkset\"><a href=\"https://vkvideo.ru/video-164680776_456239296\" target=\"_blank\" rel=\"noopener\"><b>Смотреть в ВК Видео</b><i>↗</i></a><a href=\"https://rutube.ru/video/private/e255ef65a56cc84b385c09c298c4a626/?p=1yaRTKp7XZb3AdUZ8blGyA\" target=\"_blank\" rel=\"noopener\"><b>Смотреть на Rutube</b><i>↗</i></a></div>"

"title": "Хочу собаку! Как выбрать щенка",
"lead": "Выпуск подкаста с кинологом: как выбрать щенка, почему щенки — маленькие демоны и как не ошибиться с заводчиком.",
"html": "<p>Как выбрать щенка? Почему щенки — это маленькие демоны? Как не ошибиться с заводчиком? Обсуждаем с Альбиной, кинологом и специалистом по поведению собак.</p><div class=\"linkset\"><a href=\"https://music.yandex.ru/album/29413831\" target=\"_blank\" rel=\"noopener\"><b>Яндекс Музыка</b><i>↗</i></a><a href=\"https://vk.com/podcast-211101368_456239030\" target=\"_blank\" rel=\"noopener\"><b>ВКонтакте</b><i>↗</i></a><a href=\"https://podcasts.apple.com/us/podcast/id1733270466\" target=\"_blank\" rel=\"noopener\"><b>Apple Podcasts</b><i>↗</i></a><a href=\"https://open.spotify.com/show/7a8hLIxeA92rLS50CZQV8J\" target=\"_blank\" rel=\"noopener\"><b>Spotify</b><i>↗</i></a></div><p class=\"src\">Источник: канал «ваш кинолог ALEYHAB», <a href=\"https://t.me/aleydog/38\" target=\"_blank\" rel=\"noopener\">t.me/aleydog/38</a></p>"
